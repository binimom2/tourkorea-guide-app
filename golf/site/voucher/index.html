<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>예약 확정서 (Voucher)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ══════════════════════════════════════════════════════════════════
   예약 확정서(Voucher) — 손님이 카톡·이메일로 받은 링크로 연다.
   주소: /golf/site/voucher/?no=<접수번호>&t=<토큰>
   자료는 /api/golf-book {action:'voucher'} 한 번으로 받는다(회사 정보·업체 주소까지 서버가 붙여 준다).
   모양은 여행사 바우처 관례(토토부킹 등)를 따랐다 — 호텔 프론트가 익숙한 배치.
   인쇄·화면 캡처로도 쓰이므로 한 단(세로 한 줄)으로만 짠다.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --navy:#1F2B4D; --fairway:#123A2B; --ink:#15211C; --muted:#6B7570; --line:#E3E6EA;
  --paper:#F5F6F8; --font:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
.sheet{max-width:760px;margin:0 auto;padding:22px 20px 60px}
.brand{display:flex;justify-content:flex-end;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:2px solid var(--ink);font-weight:900;font-size:15px}
.brand small{font-weight:600;color:var(--muted);font-size:12px}
h1{margin:22px 0 4px;font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
h1 small{font-size:18px;font-weight:800;margin-left:8px;vertical-align:middle}
.tip{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
/* 머리·청구 상자는 연한 초록(사장님 2026-09-29, 예전 남색) */
.head{background:#E3F1E7;color:var(--fairway);border-radius:6px 6px 0 0;padding:16px 18px}
.head .bn{font-size:15px;margin-bottom:6px}
.head .bn b{font-size:17px;font-weight:900;letter-spacing:.02em}
.head h2{margin:0 0 6px;font-size:18px;font-weight:900}
.head p{margin:0;font-size:12.5px;color:rgba(18,58,43,.78);line-height:1.6}
.body{background:var(--paper);padding:18px 18px 20px;margin-bottom:22px;border-radius:0 0 6px 6px}
.body h3{margin:0 0 10px;font-size:15px;font-weight:900}
.body .line{font-size:13.5px;margin:3px 0}
.body .line b{font-weight:800}
.tbl{background:#fff;border-radius:6px;padding:8px 14px;margin:12px 0 6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tbl div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.tbl div:last-child{border-bottom:0}
.tbl span{color:var(--muted)}
.tbl b{font-weight:700;text-align:right}
.sec{margin:0 0 22px}
.sec h3{margin:0 0 6px;font-size:14.5px;font-weight:900}
.sec p{margin:0;font-size:13.5px;white-space:pre-wrap;line-height:1.65}
.sec p.small{font-size:12px;color:var(--muted)}
.box{background:var(--paper);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.box h3{margin:0 0 10px;font-size:15px;font-weight:900}
.box ul{margin:0;padding:0;list-style:none}
.box li{font-size:12.5px;line-height:1.6;padding-left:12px;text-indent:-12px;margin:2px 0}
.box li.red{color:#D9412B}
.box p{margin:0;font-size:12.5px;white-space:pre-wrap;line-height:1.65}
/* 인쇄 단추는 문서 맨 아래(사장님 2026-10-01 — 떠 있으면 내용을 가린다) */
.act{max-width:760px;margin:-30px auto 40px;padding:0 20px;display:flex;justify-content:center;gap:8px}
.act button{background:var(--fairway);color:#fff;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.err{max-width:560px;margin:80px auto;padding:0 20px;text-align:center}
.err h2{font-size:20px;font-weight:900;margin:0 0 8px}
.err p{color:var(--muted);font-size:14px}
.total{display:flex;justify-content:space-between;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:14px;font-weight:800;margin-bottom:22px}
.total i{font-style:normal;color:var(--muted);font-weight:600;font-size:12px;margin-left:6px}
/* 인보이스(여행사 수배 건) */
.itin{width:100%;border-collapse:collapse;font-size:13.5px}
.itin th{text-align:left;padding:7px 8px;background:var(--paper);font-size:12px;color:var(--muted);letter-spacing:.06em}
.itin td{padding:7px 8px;border-bottom:1px solid var(--line);font-weight:700}
.itin .nw{white-space:nowrap}
.itin .mut{color:var(--muted);font-weight:600}
.amt{background:#E3F1E7;color:var(--fairway);border-radius:6px;padding:14px 18px;margin-bottom:22px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.amt div{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13.5px}
.amt div span{opacity:.85}
.amt div b{font-size:17px;font-weight:800}
.amt .sum{border-top:2px solid #2E7D4F;margin-top:8px;padding-top:10px}
.amt .sum span{font-size:15px;font-weight:800;opacity:1}
.amt .sum b{font-size:26px;font-weight:900;color:#1f6b3f}
/* 사이트 예약 인보이스(사장님 2026-10-02) — 안내문 굵게, 머리 줄 통일, 품목 글자 통일, 계좌 한 줄, Issued by 오른쪽 */
.tip.strong{font-size:13.5px;font-weight:800;color:var(--ink)}
.head.ih .hl{font-size:15px;font-weight:800;color:var(--fairway);line-height:1.6}
/* 값 줄 맞춤 + 이름은 「Invoice No.」 폭에 첫·끝 글자를 맞춰 고르게 벌림(사장님 2026-10-03) */
.head.ih .hl span{color:#7A8580;font-weight:700;display:inline-block;width:78px;margin-right:20px;text-align:justify;text-align-last:justify;text-justify:inter-character;white-space:nowrap}   /* 1pt 줄이고 제목·내용 사이 띄움(사장님 2026-10-03) */   /* 앞 이름(Invoice No.·에이전트명 …)은 회색(사장님 2026-10-02) */
.itin.same th{text-align:center;font-size:13px}
.itin.same td:first-child,.itin.same td:last-child{text-align:center!important}
.itin.same td{font-size:14.5px;font-weight:700;color:var(--ink);vertical-align:top}
/* 여행사 디파짓·잔금 인보이스 한 장으로(사장님 2026-10-03) */
.head.cp{border-radius:6px;margin-bottom:14px;padding:12px 16px}
.head.cp .cfm{font-style:normal;background:#2E7D4F;color:#fff;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:900;margin-left:6px}
.head.cp .cpg{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 12px;margin-top:6px;font-size:13px;align-items:baseline}
.head.cp .cpg span{color:#7A8580;font-weight:700;white-space:nowrap}
.head.cp .cpg b{font-weight:800;color:var(--fairway)}
.head.cp .cpg b.wide{grid-column:2/-1}
.head.cp .cpg{grid-template-columns:78px 1fr 64px 1fr;margin-top:0}
.head.cp .cpg span.no,.head.cp .cpg b.no{font-size:15px;padding-bottom:3px}
.head.cp .cpg b.no{font-size:16px;font-weight:900}
.sec.cp{margin-bottom:12px}
.inv .nt{color:#D32F2F;font-weight:800}   /* 수배요청서 비고 — 항목 옆 빨강 */
.sec.cp h3{font-size:13.5px;margin-bottom:4px}
.sec.cp p{font-size:12.5px;line-height:1.55}
.itin.cp th{padding:4px 8px;font-size:11.5px}
.itin.cp td{padding:4px 8px;font-size:12.5px}
.cp2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.cp2>.sec:only-child{grid-column:1/-1}
.amt.cp{padding:10px 16px;margin-bottom:12px}
.amt.cp div b{font-size:15px}
.amt.cp .sum{margin-top:6px;padding-top:7px}
.amt.cp .sum b{font-size:22px}
@media(max-width:560px){ .head.cp .cpg{grid-template-columns:auto 1fr} .cp2{grid-template-columns:1fr} }
@media print{ .sheet.inv{zoom:.88} }   /* 인보이스는 인쇄 때 조금 줄여 A4 한 장에 */
.itin.kv{margin-bottom:12px}
.itin.kv th{text-align:center;font-size:13px}
.itin.kv td{font-size:14.5px;color:var(--ink);vertical-align:top}
.itin.kv td:first-child{width:150px;color:var(--muted);white-space:nowrap}
.itin.kv tr.top td{border-top:2px solid #C9D3CE}   /* 품목 사이 굵은 줄 */
/* 휴대폰: 구분·금액 칸을 좁혀 내용 칸이 넓게(사장님 2026-10-03 모바일 점검) */
@media(max-width:560px){
  .sheet{padding:16px 12px 50px}
  .body{padding:12px 10px 14px}
  .itin.kv td,.itin.kv th{padding:6px 5px;font-size:13px}
  .itin.kv td:first-child{width:auto;white-space:normal;word-break:keep-all;min-width:58px}
  .itin.kv td.amt3{width:auto!important;font-size:13px}
  .head.ih .hl{font-size:14px}
  .head.ih .hl span{width:70px;margin-right:12px}
}
.itin.kv td.amt3{width:120px;text-align:right;vertical-align:middle;white-space:nowrap;font-weight:800;border-left:1px solid var(--line)}
.box.bank{font-size:15px;font-weight:800}
.box.bank .bankmemo{margin:8px 0 0;padding-top:8px;border-top:1px dashed #d9dcd8;font-size:13.5px;font-weight:600;white-space:pre-wrap;color:var(--ink)}
.box.bank .bankmemo b{font-weight:900;margin-right:6px}
.box.bank .banknote{margin:8px 0 0;font-size:13.5px;font-weight:700;color:#D32F2F}
.box.bank .acct{font-size:19px;font-weight:900;color:#111;letter-spacing:.01em}   /* 검정(사장님 2026-10-03 — 아래 빨간 안내와 겹치지 않게) */
.sec.issued{text-align:right}
/* 상단 회사명·Issued by 는 연한 회색(사장님 2026-10-03) */
.brand,.sec.issued h3,.sec.issued p,.sec.issued p.small{color:#A9B0AC}
.sec.issued h3,.sec.issued h3 span{font-size:15px;font-weight:900!important}   /* 아래 회사명도 위와 같은 굵기·크기 — 톤 통일(사장님 2026-10-03) */
/* 편집 모드 — 어드민이 적을 칸은 노란색 */
.ed{font:inherit;font-size:14px;font-weight:700;background:#FFF4B8;border:2px solid #F2C94C;border-radius:6px;padding:5px 8px;color:var(--ink)}
input.ed{width:150px;text-align:right}
input.ed.wide{width:260px;max-width:60vw}
.cfno{color:#D32F2F;font-weight:900}   /* 컨펌번호 빨강(사장님 2026-10-03) */
.paid{color:#2E7D4F;font-weight:900}
.teet,.tbl b .teet{color:#B00000;font-weight:900;font-size:15px}
.tbl b .paid{color:#2E7D4F}.tbl b .cfno{color:#D32F2F}   /* 표 안 span 기본 회색(.tbl span)을 이긴다 */   /* 골프 확정 티업 진한 빨강(사장님 2026-10-03) */
textarea.ed{display:block;width:100%;margin:6px 0;resize:vertical;font-weight:600;line-height:1.5}
.edbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFF4B8;border-bottom:2px solid #F2C94C;padding:10px 16px;font-size:13.5px}
.edbar button{margin-left:auto;background:var(--fairway);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:800;cursor:pointer}
.edbar #edMsg{font-weight:700}
/* 인쇄 때 브라우저가 찍는 날짜·제목·주소·쪽수 줄 없애기(사장님 2026-10-03) — 용지 여백을 0으로 하면 크롬이 안 찍는다. 여백은 종이 안쪽 padding 으로 */
@page{size:A4;margin:0}
@media print{ .edbar{display:none} .act{display:none} .sheet{padding:12mm 14mm;max-width:none} body{background:#fff} .head{-webkit-print-color-adjust:exact;print-color-adjust:exact} .body,.box{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>
</head>
<body>
<div id="app"><div class="err"><p>예약 확정서를 불러오는 중…</p></div></div>
<div class="act" id="act" style="display:none"><button type="button" onclick="window.print()">🖨 인쇄 / PDF 저장</button></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function dfmt(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  if(!m) return s || "";
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return s + "(" + DOW[d.getDay()] + ")";
}
const KIND_T = { courses: "골프장 / Golf Course", hotels: "호텔 / Hotel" };
function won(n){ return Number(n || 0).toLocaleString("ko-KR") + "원"; }

/* 담긴 줄 하나 = 확정서 한 장(업체 머리 + 상세표). 종류마다 표의 줄이 다르다. */
/* 품목마다 어드민이 적는 확정 칸(it.teeOk) — 골프 확정 티업과 같은 방식으로 전 품목 통일(사장님 2026-10-03) */
/* 바우처는 영문만(사장님 2026-10-03) — 호텔 프론트·골프장이 읽는 문서. 품목 값(객실명 등)은 받은 그대로 */
/* 골프 확정 티업 · 그 밖 확정 내용은 상세표에, 호텔 컨펌번호는 Agent Memo에 빨간 글씨로 */
function confRow(it, i){
  const lb = it.kind === "courses" ? "Tee Time" : "Confirmed";
  const ph = it.time ? "희망 " + it.time : it.kind === "courses" ? "예: 07:30" : "확정 시간 · 내용";
  if(EDIT) return [lb, { html: '<input class="ed" data-tee="' + i + '" value="' + esc(it.teeOk || "") + '" placeholder="' + esc(ph) + '" maxlength="60">' }];
  return it.teeOk ? [lb, it.teeOk] : null;
}
/* 손님 요청(하이플로어 등) — 직원이 영어로 적는다. 손님이 적은 원문은 노란 칸 예시 글로만 보인다 */
function reqRow(v, it, i){
  if(EDIT) return ["Guest Request", { html: '<input class="ed wide" data-req="' + i + '" value="' + esc(it.req || "") + '" placeholder="' + esc(v.req ? "손님: " + v.req : "예: High floor") + '" maxlength="200">' }];
  return it.req ? ["Guest Request", it.req] : null;
}
/* 줄 차례 호텔 → 골프 → 기타, 같은 종류는 날짜순(사장님 2026-10-03) — [줄, 원래 번호]. 노란 칸은 원래 번호로 저장한다 */
function kindSorted(items){
  const KR = k => k === "hotels" ? 0 : k === "courses" ? 1 : 2;
  return (items || []).map((it, i) => [it, i]).sort((a, b) => KR(a[0].kind) - KR(b[0].kind) || String(a[0].date || "").localeCompare(String(b[0].date || "")) || a[1] - b[1]);
}
function itemHtml(v, it, i, pos){
  const ven = it.venue || {};
  const date = dfmt(it.date) + (it.dateEnd && it.dateEnd !== it.date ? " ~ " + dfmt(it.dateEnd) : "");
  const rows = [["Booking No.", v.no + (v.items.length > 1 ? "-" + ((pos == null ? i : pos) + 1) : "")]];
  const cf = it.kind === "hotels" ? null : confRow(it, i);
  if(it.kind === "hotels"){
    const n = it.nights || 1;
    /* 날짜가 줄 중간(2026-11- / 03)에서 끊기지 않게 날짜 하나씩 묶음(휴대폰, 2026-10-03) */
    const nw = s => '<span style="white-space:nowrap">' + esc(s) + '</span>';
    rows.push(["Check-in ~ Check-out", { html: nw(dfmt(it.date)) + (it.dateEnd && it.dateEnd !== it.date ? ' ~ ' + nw(dfmt(it.dateEnd)) : '') + ' / ' + nw(n + " Night" + (n > 1 ? "s" : "")) }]);
    rows.push(["Guest Name", v.guest]);
    const bd = bedsEn(it);
    rows.push(["Room Type / Bed Type", roomEn(it.option) + (bd ? " / " + bd : "")]);
    /* 아동은 생년월일도 같이 적는다(2026-09-19) — 호텔이 아동 요금(만 11세까지)을 생년월일로 확인한다 */
    const kids = it.child ? ", Child " + it.child + ((it.ages || []).length ? " (" + it.ages.map((a, k) => {
      const b = (it.births || [])[k] || "";
      return (b.length === 8 ? b.slice(0, 4) + "-" + b.slice(4, 6) + "-" + b.slice(6, 8) + " · " : "") + a + "y";
    }).join(", ") + ")" : "") : "";
    const rm = it.rooms || 1;
    rows.push(["Guests / Rooms", "Adult " + (it.adult || it.pax || 0) + kids + " / " + rm + " Room" + (rm > 1 ? "s" : "")]);
    /* 아동 엑스트라 베드를 «추가 안 함»으로 고른 예약(2026-09-19) — 호텔이 베드를 넣지 않게 적어 준다 */
    if(it.noBed) rows.push(["Extra Bed", "No extra bed for child (breakfast only)"]);
    rows.push(["Breakfast", ven.bf === true ? "Included" : ven.bf === false ? "Not Included" : "-"]);
  } else if(it.kind === "courses"){
    /* 골프는 「Date / Tee Time」「Round / Players」 나란히, 확정 티업 빨강(사장님 2026-10-03).
       확정 티업이 없으면 손님 희망 시간(검정), 편집 모드면 노란 칸 */
    const tt = EDIT ? cf[1].html : it.teeOk ? '<span class="teet">' + esc(it.teeOk) + '</span>' : esc(it.time || "-");
    rows.push(["Date / Tee Time", { html: esc(date) + ' / ' + tt }]);
    rows.push(["Guest Name", v.guest]);
    const pl = (it.pax || 0) + " Player" + ((it.pax || 0) > 1 ? "s" : "");
    rows.push(["Round / Players", (it.option ? String(it.option).replace(/(\d+)\s*홀/g, "$1 Holes") + " / " : "") + pl]);   // 「18홀」→「18 Holes」(사장님 2026-10-01)
  } else {
    rows.push(["Date", date]);
    rows.push(["Guest Name", v.guest]);
    if(it.option) rows.push(["Item", it.option]);
    if(it.pax) rows.push(["Qty", String(it.pax)]);
    if(it.riders) rows.push(["Passengers", it.riders + " pax"]);   // 차량 탑승 인원수(2026-09-11)
    if(it.time) rows.push(["Note", it.time]);
    if(cf) rows.push(cf);
  }
  if(v.paid) rows.push(["Payment", { html: '<span class="paid">Full Payment</span>' }]);   // Breakfast 아래(사장님 2026-10-03)
  const rq = reqRow(v, it, i); if(rq) rows.push(rq);
  return '<div class="head">'
    + '<h2>' + esc(ven.en || it.name) + '</h2>'
    + '<p>' + (ven.addr ? '· ' + esc(ven.addr) + '<br>' : '') + (ven.tel ? '· ' + esc(ven.tel) : '') + '</p>'
    + '</div><div class="body">'
    + '<h3>Booking Details</h3>'
    + '<div class="tbl">' + rows.map(r => '<div><span>' + esc(r[0]) + '</span><b>' + (r[1] && r[1].html ? r[1].html : esc(r[1])) + '</b></div>').join("") + '</div>'
    + '</div>';
}
/* 객실명 영문(사장님 2026-10-03 「Deluxe Type / 2Twin」) — 요금표 객실명이 한글이라 흔한 낱말을 바꿔 적는다. 긴 말부터 바꾼다 */
const ROOM_EN = [["원베드룸","One Bedroom"],["투베드룸","Two Bedroom"],["쓰리베드룸","Three Bedroom"],["이그제큐티브","Executive"],["비치프론트","Beachfront"],
  ["슈페리어","Superior"],["슈페리얼","Superior"],["스탠다드","Standard"],["스탠더드","Standard"],["디럭스","Deluxe"],["프리미어","Premier"],["프리미엄","Premium"],
  ["시그니처","Signature"],["레지던스","Residence"],["스튜디오","Studio"],["주니어","Junior"],["스위트","Suite"],["패밀리","Family"],["그랜드","Grand"],
  ["로얄","Royal"],["로열","Royal"],["클럽","Club"],["코너","Corner"],["오션뷰","Ocean View"],["씨뷰","Sea View"],["시티뷰","City View"],["가든뷰","Garden View"],
  ["풀뷰","Pool View"],["리버뷰","River View"],["마운틴뷰","Mountain View"],["풀빌라","Pool Villa"],["풀억세스","Pool Access"],["풀액세스","Pool Access"],
  ["빌라","Villa"],["발코니","Balcony"],["테라스","Terrace"],["킹","King"],["트윈","Twin"],["더블","Double"],["싱글","Single"],["트리플","Triple"],
  ["객실","Room"],["룸","Room"],["타입","Type"],["오션","Ocean"],["가든","Garden"],["풀","Pool"],["뷰","View"]];
function roomEn(s){
  let t = String(s || "");
  ROOM_EN.forEach(([k, e]) => { t = t.split(k).join(" " + e + " "); });
  t = t.replace(/\s+/g, " ").trim();
  if(!t) return "-";
  return /\b(Room|Suite|Villa|Studio|Residence|Bedroom|Type)\b/.test(t) ? t : t + " Type";
}
/* 손님이 고른 침대 구성 — 담을 때 문구(label)의 「2트윈 1트리플+1엑스트라베드+1아동조식포함」을 읽어 「2Twin 1Triple + 1Extra Bed + 1Child Breakfast」로 */
function bedsEn(it){
  const src = String(it.label || ""), BED = { "트윈": "Twin", "더블": "Double", "싱글": "Single", "트리플": "Triple" };
  const m = /\d+박\s+((?:\d+(?:트윈|더블|싱글|트리플)\s*)+)((?:\+\d+(?:엑스트라베드|아동조식포함))*)/.exec(src);
  if(!m) return "";
  let t = m[1].trim().split(/\s+/).map(x => x.replace(/(\d+)(트윈|더블|싱글|트리플)/, (_, n, k) => n + BED[k])).join(" ");
  (m[2].match(/\+\d+(?:엑스트라베드|아동조식포함)/g) || []).forEach(x => {
    const n = x.replace(/\D/g, "");
    t += " + " + n + (/엑스트라/.test(x) ? "Extra Bed" : "Child Breakfast");
  });
  return t;
}
/* 「투어코리아 (TOURKOREA)」 → 「TOURKOREA」 — 괄호 안 영문이 있으면 그것만 */
function enName(n){ const m = /\(([^)]*[A-Za-z][^)]*)\)/.exec(n || ""); return m ? m[1].trim() : (n || ""); }

/* ?it=<줄 번호> — 품목 한 장만(사장님 2026-10-03: 직원은 한 번에 적고, 받는 쪽엔 품목마다 따로). 편집 모드는 늘 전체 */
const ONE = (() => { const x = new URLSearchParams(location.search).get("it"); return x != null && /^\d+$/.test(x) ? +x : null; })();
function render(v){
  const c = v.company || {};
  const all = kindSorted(v.items).map(([it, i], k) => [it, i, k]);
  const pick = ONE != null && !EDIT ? all.filter(x => x[1] === ONE) : [];

  const noHotel = !shown.some(x => x[0].kind === "hotels");
  const terms = String(c.terms || "").split(/\n/).map(t => t.trim()).map(t => noHotel ? t.replace(/^호텔\s*체크인\s*시/, "체크인 시") : t).filter(Boolean);
  const co = enName(c.name);
  /* Confirm No.(빨강) — 품목마다 업체 컨펌번호를 적는다(사장님 2026-10-03, 골프도 호텔과 똑같이).
     호텔은 확정 칸(teeOk)이 곧 컨펌번호, 골프 등은 teeOk가 티업이라 따로 cfNo. 아무것도 안 적었으면 우리 확정번호 */
  const cfs = shown.map(([it, i]) => ({ it, i, h: it.kind === "hotels", val: it.kind === "hotels" ? it.teeOk : it.cfNo }));
  const many = cfs.length > 1;
  const nm = x => many ? esc(x.it.venue && x.it.venue.en || x.it.name) + ' ' : '';
  const cfHtml = EDIT
    ? cfs.map(x => '<span class="cfno">Confirm No. ' + nm(x) + '</span>'
        + '<input class="ed" ' + (x.h ? 'data-tee' : 'data-cf') + '="' + x.i + '" value="' + esc(x.val || "") + '" placeholder="' + (x.h ? '호텔' : '업체') + ' 컨펌번호" maxlength="60">').join("<br>")
    : (cfs.some(x => x.val)
        ? cfs.filter(x => x.val).map(x => '<span class="cfno">Confirm No. ' + (many ? nm(x) + ': ' : '') + esc(x.val) + '</span>').join("<br>")
        : '<span class="cfno">Confirm No. ' + esc(v.cno) + '</span>');
  $("#app").innerHTML = '<div class="sheet">'
    + '<div class="brand">' + esc(co) + '</div>'
    + '<h1>Voucher<small>예약 확정서</small></h1>'
    + shown.map(([it, i, k]) => itemHtml(v, it, i, k)).join("")
    /* 「Agent Memo : Confirm No. …」 한 줄로 나란히(사장님 2026-10-03) */
    + '<div class="sec"><h3>Agent Memo : ' + cfHtml + '</h3>'
      + (EDIT ? '<textarea class="ed" id="edMemo" rows="3" placeholder="안내 사항 등 (영문)">' + esc(v.memo || "") + '</textarea>'
        : v.memo ? '<p>' + esc(v.memo) + '</p>' : '') + '</div>'
    + '<div class="sec"><h3>Booked by : <span style="font-weight:600">' + esc(co) + (c.tel ? ' (Tel : ' + esc(c.tel) + ')' : '') + '</span></h3>'
      + (c.regNo ? '<p class="small">- Registration No : ' + esc(c.regNo) + '</p>' : '')
      + (c.tel2 ? '<p class="small">- Tel : ' + esc(c.tel2) + '</p>' : '')
      + (c.email ? '<p class="small">- Email : ' + esc(c.email) + '</p>' : '') + '</div>'
    + (c.notes ? '<div class="box"><h3>Important Notes</h3><p>' + esc(c.notes) + '</p></div>' : '')
    + '<div class="box"><h3>Terms &amp; Conditions</h3><ul>'
      + '<li class="red">- This voucher can be shown as captured picture with mobile phone.</li>'
      + terms.map(t => '<li>- ' + esc(t) + '</li>').join("")
      + (c.emergency ? '<li>- Emergency Contact : ' + esc(c.emergency) + '</li>' : '')
    + '</ul></div>'
    + '</div>';
  document.title = "Voucher " + v.no + " · " + co;
  $("#act").style.display = "";
  if(EDIT){
    $("#app").insertAdjacentHTML("afterbegin", '<div class="edbar">✏ <b>수정 모드</b> — '
      + (v.status === "done" ? '' : '<b style="color:#D32F2F">(발송 전)</b> · ')
      + '노란 칸을 채우고 아래 「저장」, 보낼 때는 「발송하기」. 손님 화면에는 적은 글자만 보입니다.'
      + '<span id="edMsg"></span></div>');
    edSaveBtn(v); edSendBtn(v);
  }
}
/* ── 편집 모드(?edit=1) — 관리 화면 「바우처 열기 · 수정」으로 열면 확정 티업·메모를 바로 적는다(사장님 2026-10-01).
   같은 브라우저의 직원 로그인(gs-auth) 토큰으로 서버에 저장한다. 손님이 이 주소를 받아도 로그인이 없어 그냥 바우처로 보인다 ── */
function staffToken(){
  try{ const a = JSON.parse(localStorage.getItem("gs-auth") || "null"); return (a && (a.access_token || (a.currentSession && a.currentSession.access_token))) || ""; }catch(e){ return ""; }
}
const EDIT = new URLSearchParams(location.search).get("edit") === "1" && !!staffToken();
/* 저장 단추는 문서 맨 아래 인쇄 단추 옆(사장님 2026-10-03) */
function edSaveBtn(v){
  if(!$("#edSave")) $("#act").insertAdjacentHTML("afterbegin", '<button type="button" id="edSave">💾 저장</button>');

}
/* 직원 토큰으로 /api/golf-book 부르기 */
async function staffApi(body){
  const r = await fetch("/api/golf-book", { method: "POST",
    headers: { "content-type": "application/json", Authorization: "Bearer " + staffToken() }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if(r.status === 401) throw new Error("로그인이 만료되었습니다. 관리 화면을 새로고침한 뒤 다시 해 주세요.");
  return j;
}
/* 노란 칸 저장(창은 안 닫음) */
async function putEdit(v){
  const tees = {}; document.querySelectorAll("[data-tee]").forEach(e => { tees[e.dataset.tee] = e.value.trim(); });
  const reqs = {}; document.querySelectorAll("[data-req]").forEach(e => { reqs[e.dataset.req] = e.value.trim(); });
  const cfs = {}; document.querySelectorAll("[data-cf]").forEach(e => { cfs[e.dataset.cf] = e.value.trim(); });
  const j = await staffApi({ action: "vEdit", no: v.no, memo: $("#edMemo").value, tees, reqs, cfs });
  if(!j.ok) throw new Error(j.error || "저장하지 못했습니다.");
}
function closeSoon(msg, t){
  msg.textContent = t; window.close();
  setTimeout(() => { msg.textContent = t + " — 이 탭을 닫으셔도 됩니다"; }, 300);
}
async function saveEdit(v){
  const btn = $("#edSave"), msg = $("#edMsg");
  btn.disabled = true; msg.textContent = "저장 중…";
  try{
    await putEdit(v);
    /* 저장하면 창을 닫는다(사장님 2026-10-01). 브라우저가 닫기를 막으면 안내만 남긴다 */
    closeSoon(msg, "✅ 저장했습니다");

/* 인보이스 「발송」(사장님 2026-10-03) — 적은 것 저장 → 초안이면 공개(release) → 손님 이메일로 보냄.
   고칠 것 없으면 그냥 이 단추만 누르면 된다. 단추 차례: 저장 · 발송 · 인쇄 */
function edSendBtn(v){
  /* 단추 차례 통일(사장님 2026-10-03): 저장 · 인쇄 · 발송하기 — 여행사 인보이스 창과 같게 */
  if(!$("#edSend")) $("#act").insertAdjacentHTML("beforeend", '<button type="button" id="edSend">📨 발송하기</button>');
  $("#edSend").onclick = () => sendInvoice(v);
}
async function sendInvoice(v){
  /* 바우처도 같은 「발송」(사장님 2026-10-03) — 저장 → 아직 발급 전이면 ⑤ 발급(status done) → 이메일 */
  const isInv = v.type === "invoice", done = v.status === "done";
  if(!isInv && !v.paid) return alert("입금확인 뒤에 바우처를 발송할 수 있습니다.");
  if(!isInv && [...document.querySelectorAll("[data-tee]")].some(e => !e.value.trim()))
    return alert("노란 확정 칸(티업 · 호텔 컨펌번호 등)을 모두 채운 뒤 발송해 주세요.");
  const q = isInv
    ? (v.released ? "인보이스를 다시 보냅니다." : "인보이스를 발송합니다 — 여행사 보관함·손님 링크에 인보이스가 보이게 됩니다.")
    : (done ? "바우처를 다시 보냅니다." : "바우처를 발급·발송합니다 — 여행사 보관함·손님 링크에 바우처가 보이게 됩니다.");
  if(!confirm(q + "\n손님 이메일이 있으면 이메일로도 보냅니다.\n\n발송할까요?")) return;
  const btn = $("#edSend"), msg = $("#edMsg");
  btn.disabled = true; msg.textContent = "발송 중…";
  try{
    await putEdit(v);
    if(isInv && !v.released){
      const r = await staffApi({ action: "release", no: v.no });
      if(!r.ok) throw new Error(r.error || "발송하지 못했습니다.");
      v.released = true;
    }
    if(!isInv && !done){
      const r = await staffApi({ action: "status", no: v.no, status: "done" });
      if(!r.ok) throw new Error(r.error || "바우처를 발급하지 못했습니다.");
      v.status = "done";
    }
    const m = await staffApi({ action: "send", no: v.no });
    closeSoon(msg, m.ok ? "✅ 발송했습니다 · 📧 " + (m.to || "")
      : m.setup ? "✅ 발송했습니다 (이메일 자동발송은 아직 설정 전 — 링크를 직접 보내 주세요)"
      : "✅ 발송했습니다 (이메일은 못 보냄: " + (m.error || "") + ")");
  }catch(e){ msg.textContent = "❌ " + ((e && e.message) || "발송하지 못했습니다."); }
  btn.disabled = false;
}
/* ── 인보이스(사장님 2026-09-21) — 실시간 견적으로 들어온 여행사 수배 건은 컨펌하면 바우처 대신 이 화면이 나간다.
   서버가 v.type==='invoice' 로 견적 내용(v.quote)과 총액만 준다 — 항목별 원가는 오지 않는다 ── */
function dshort(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); if(!m) return s || "";
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return m[2] + "/" + m[3] + " (" + ["일","월","화","수","목","금","토"][d.getDay()] + ")";
}
function renderInvoice(v){

     호텔·골프는 일정표 줄(h:/g:날짜), 차량·가이드·기타투어는 포함 사항 줄(veh/guide/tour) */

        : '<a href="' + esc(location.pathname + location.search.replace(/&d=\w+/, "") + "&d=balance") + '">잔금 인보이스 &amp; 확정서 보기 →</a>') + '</p>' : '';
  $("#app").innerHTML = '<div class="sheet inv">'
    + '<div class="brand">' + esc(c.name || "") + '</div>'
    + (bal ? '<h1>Balance Invoice<small>잔금 인보이스 · 확정서</small></h1>'
           + '<p class="tip">※ <b>디파짓 입금이 확인되어 예약이 확정되었습니다.</b> 아래 잔금을 기한까지 입금해 주세요. 이 문서는 예약 확정서(Confirmation)를 겸합니다.</p>'
           : '<h1>Deposit Invoice<small>디파짓 인보이스</small></h1>'
           /* 디파짓 입금확인 뒤 잔금 인보이스 발송 전(2026-10-03) */
           + (v.depPaidAt ? '<p class="tip">※ <b>디파짓 입금이 확인되었습니다.</b> 예약 확정 후 잔금 인보이스 · 확정서를 보내 드립니다.</p>'
             : '<p class="tip">※ 요청하신 수배의 디파짓 인보이스입니다. 기한까지 디파짓을 입금해 주시면 예약을 확정하고 잔금 인보이스 · 확정서를 보내 드립니다.</p>'))
    + other
    /* 한 장에 들어오게 줄임(사장님 2026-10-03 「너무 길다」) — 머리·Booking Summary 를 한 상자 두 칸으로,
       포함·요청 사항은 나란히, 1인 요금 × 인원 = 총액은 한 줄 */
    + '<div class="head ih cp">'
      /* Invoice No. 도 같은 격자 첫 줄 — 값 시작 자리를 아래 줄들과 맞춤(사장님 2026-10-03 「줄맞춤」) */
      + '<div class="cpg">'
        + '<span class="no">Invoice No.</span><b class="wide no">' + esc(v.cno) + (bal ? '-B' : '-D')
        + (bal ? ' <i class="cfm">CONFIRMED · 확정</i>' : '') + '</b>'
        + '<span>발행일</span><b>' + esc(issued) + '</b>'
        + '<span>견적번호</span><b>' + esc(q.quoteNo || "") + '</b>'
        /* 차례: 발행일·견적번호 / 에이전트명(한 줄 통째) / 일정·인원. 동선·항공은 뺌(사장님 2026-10-03) */
        + '<span>에이전트명</span><b class="wide">' + esc(to.company || v.guest || "") + (to.contact ? ' · ' + esc(to.contact) + ' 님' : '') + '</b>'
        + '<span>일정</span><b>' + esc(q.start || "") + ' ~ ' + esc(q.end || "") + (q.nights ? ' (' + q.nights + '박 ' + (q.tripDays || q.nights + 1) + '일)' : '') + '</b>'
        + '<span>인원</span><b>' + (q.pax || 0) + '명</b>'
      + '</div></div>'
    + (days ? '<div class="sec cp"><h3>일정표</h3><table class="itin cp"><thead><tr><th>날짜</th><th>지역</th><th>호텔</th><th>골프장</th></tr></thead><tbody>' + days + '</tbody></table></div>' : '')
    + '<div class="cp2">'
      + ((q.includes || []).length ? '<div class="sec cp"><h3>포함 사항</h3><p>' + q.includes.map(t => '· ' + esc(t) + incNote(t)).join("\n") + '</p>'
        + (none.length ? '<p style="margin-top:4px;color:#D9412B;font-weight:700">· 불포함(선택하지 않음): ' + esc(none.join(", ")) + '</p>' : '') + '</div>' : '')
    + '</div>'
    + '<div class="amt cp">'
      + (q.perKrw ? '<div><span>1인 ' + won(q.perKrw) + ' × ' + (q.pax || 0) + '명</span><b>' + won(q.totalKrw) + '</b></div>' : '')
      /* 디파짓 인보이스: 총액 아래 디파짓이 청구액. 잔금 인보이스: 총액 − 디파짓(입금 완료) = 잔금이 청구액. 디파짓을 안 정했으면 총액 그대로 */
      + (bal && pay.dep
          ? (q.perKrw ? '' : '<div><span>총액 (Total)</span><b>' + won(q.totalKrw) + '</b></div>') + '<div><span>디파짓 입금 완료</span><b>− ' + won(pay.dep.total) + '</b></div>'
            + '<div class="sum"><span>잔금 청구 (Balance Due)</span><b>' + won(pay.bal ? pay.bal.total : Math.max(0, (q.totalKrw || 0) - pay.dep.total)) + '</b></div>'
          : !bal && pay.dep
          ? (q.perKrw ? '' : '<div><span>총액 (Total)</span><b>' + won(q.totalKrw) + '</b></div>')
            + '<div class="sum"><span>디파짓 청구 (Deposit Due)</span><b>' + won(pay.dep.total) + '</b></div>'
          : '<div class="sum"><span>Total (청구 금액)</span><b>' + (q.totalKrw ? won(q.totalKrw) : '-') + '</b></div>')
      + '</div>'
    /* 입금 일정(사장님 2026-09-23) — 디파짓·잔금 1인 금액 × 인원, 기한 */
    + (v.pay ? '<div class="sec cp"><h3>입금 일정 (Payment)</h3><table class="itin cp"><thead><tr><th>구분</th><th>1인</th><th>인원</th><th>금액</th><th>입금 기한</th></tr></thead><tbody>'
        + [["디파짓 (Deposit)", v.pay.dep], ["잔금 (Balance)", v.pay.bal]].filter(x => x[1]).map(x => '<tr><td class="nw">' + x[0] + '</td><td class="nw">' + won(x[1].per)
          + '</td><td class="nw">× ' + (q.pax || 0) + '명</td><td class="nw">' + won(x[1].total) + '</td>'
          /* 입금 기한은 빨간색(사장님 2026-09-23). 잔금 인보이스에서는 디파짓 줄을 「입금 완료」로 */
          + '<td class="nw" style="color:#D32F2F">' + ((bal || v.depPaidAt) && x[1] === v.pay.dep ? '<span style="color:#2E7D4F">✓ 입금 완료</span>' : x[1].due ? esc(dshort(x[1].due)) + '까지' : '-') + '</td></tr>').join("")
        + '</tbody></table></div>' : '')
    + bankHtml(c.bank, v.memo)
    + (c.invoiceNote ? '<div class="box"><h3>안내</h3><p>' + esc(c.invoiceNote) + '</p></div>' : '')
    + '<div class="sec issued"><h3>Issued by : <span style="font-weight:600">' + esc(c.name || "") + (c.tel ? ' (Tel : ' + esc(c.tel) + ')' : '') + '</span></h3>'
      + (c.regNo ? '<p class="small">- Registration No : ' + esc(c.regNo) + '</p>' : '')
      + (c.tel2 ? '<p class="small">- Tel : ' + esc(c.tel2) + '</p>' : '')
      + (c.email ? '<p class="small">- Email : ' + esc(c.email) + '</p>' : '')
      + (c.issuer ? '<p class="small">- 담당 : ' + esc(c.issuer) + '</p>' : '') + '</div>'
    + '</div>';
  document.title = (bal ? "잔금 인보이스·확정서 " : "디파짓 인보이스 ") + (q.quoteNo || v.no) + " · " + (c.name || "");
  $("#act").style.display = "";
}
/* ── 사이트 예약(장바구니·단품) 인보이스(사장님 2026-09-29) — 호텔 컨펌 뒤 나가고, 입금확인되면 같은 링크가 바우처로 바뀐다 ── */
/* 입금 계좌 한 줄 — 계좌번호만 진한 파랑·크게(사장님 2026-10-02) */
function bankHtml(bank, memo){
  /* 메모는 송금 안내 줄 바로 아래, 같은 상자 안(사장님 2026-10-03) */
  const mm = memo ? '<p class="bankmemo"><b>Memo</b> ' + esc(memo) + '</p>' : '';
  if(!bank) return memo ? '<div class="box bank">' + mm + '</div>' : "";
  /* 은행명·예금주도 계좌번호와 같은 글자(사장님 2026-10-03) */
  const t = esc(String(bank).replace(/\s*\n\s*/g, " ").trim());
  return '<div class="box bank">입금계좌안내 : <b class="acct">' + t + '</b>'
    + '<p class="banknote">* 에이전트명 또는 담당자명으로 송금 부탁 드립니다.</p>' + mm + '</div>';   // 사장님 2026-10-03
}
function renderItemInvoice(v){
  const c = v.company || {}, to = v.to || {};
  /* 호텔은 한 줄에 몰아 쓰면 글자가 밀린다 — 구분·내용 표로 나눠 적는다(사장님 2026-10-03) */
  const dl = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? m[1] + "." + m[2] + "." + m[3] + " " + dshort(s).replace(/^\S+\s*/, "") : (s || ""); };
  /* 품목마다 [구분, 내용] 줄 — 표 하나에 「구분 · 내용 · 금액」, 금액은 품목 첫 줄 오른쪽에 한 번(사장님 2026-10-03) */
  const linesOf = it => {
    const lb = String(it.label || "");
    if(it.kind === "hotels"){
      const paxSeg = lb.split(" · ").filter(p => /^(성인|아동)/.test(p)).join(" · ");
      const tot = (it.adult || 0) + (it.child || 0) || it.pax || 0;
      const bm = /\d+박\s+([^·]+)/.exec(lb), beds = bm ? bm[1].trim() : "";
      const n = it.nights || 0;
      return [["호텔", '<b>' + esc(it.name) + '</b>'],
        ["날짜", esc(dl(it.date)) + (it.dateEnd && it.dateEnd !== it.date ? ' ~ ' + esc(dl(it.dateEnd)) : '') + (n ? ' · ' + n + '박' : '')],
        ["총 인원수", tot + '명' + (it.child && paxSeg ? ' <span class="mut">(' + esc(paxSeg) + ')</span>' : '')],
        ["룸타입 / 베드타입", esc(it.option || "-") + (beds ? ' / ' + esc(beds) : '')]];
    }
    if(it.kind === "courses"){   // 총인원수 / 홀수 (조는 뺌, 사장님 2026-10-03)
      const p = it.pax || 0, holes = String(it.option || "").replace(/\s+/g, "");
      return [["골프장", '<b>' + esc(it.name) + '</b>'], ["날짜", esc(dl(it.date))],
        ["총인원수 / 홀수", p + '명' + (holes ? ' / ' + esc(holes) : '')]];
    }
    const rest = lb.split(" · ").filter(p => !/^\d{4}\./.test(p)).join(" · ");
    return [[esc(it.kindT || "상품"), '<b>' + esc(it.name) + '</b>'],
      ["날짜", esc(dl(it.date)) + (it.dateEnd && it.dateEnd !== it.date ? ' ~ ' + esc(dl(it.dateEnd)) : '')],
      ["내용", esc(rest || it.option || "-")]];
  };
  const body = kindSorted(v.items).map(([it]) => {
    const L = linesOf(it), amt = it.asked ? '<span class="mut">문의</span>' : won(it.krw);
    return L.map((r, k) => '<tr' + (k === 0 ? ' class="top"' : '') + '><td>' + r[0] + '</td><td>' + r[1] + '</td>'
      + (k === 0 ? '<td class="amt3" rowspan="' + L.length + '">' + amt + '</td>' : '') + '</tr>').join("");
  }).join("");
  /* 머리 다섯 줄은 Invoice No. 와 같은 크기·굵기·색(사장님 2026-10-02) */
  const hl = (k, val) => '<div class="hl"><span>' + k + '</span> ' + esc(val) + '</div>';
  $("#app").innerHTML = '<div class="sheet inv">'
    + '<div class="brand">' + esc(c.name || "") + '</div>'
    + '<h1>Invoice<small>인보이스</small></h1>'
    + (v.paid && v.status === 'done' ? '<p class="tip strong">※ 입금이 확인되었습니다.</p>'
      : v.paid ? '<p class="tip strong">※ 입금이 확인되었습니다. 바우처(예약 확정서)를 준비 중이며, 준비되면 이 링크에서 바로 보실 수 있습니다.</p>'
              /* 골프는 「예약이 가능하며」(사장님 2026-10-03) */
              : '<p class="tip strong">※ 요청하신 예약이 ' + ((v.items || []).some(x => x.kind === "courses") ? '가능하며' : '확정되었습니다.') + ' 아래 금액을 입금해 주시면 확인 후 바우처(예약 확정서)를 보내 드립니다.</p>')
    + '<div class="head ih">'
      /* 차례: 번호 · 발행일 · 에이전트명 · 예약자명, 예약번호 뺌(사장님 2026-10-03) */
      + hl("Invoice No.", v.invNo || v.cno)
      + hl("발행일", String(v.confirmedAt || "").slice(0, 10))
      + hl("에이전트명", to.company || v.guest || "")
      + hl("예약자명", v.guest || "") + '</div>'
    + '<div class="body" style="padding-top:12px"><table class="itin kv"><thead><tr><th>구분</th><th>내용</th><th>금액</th></tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<div class="amt"><div class="sum"><span>Total (청구 금액)</span><b>' + won(v.total) + '</b></div></div>'
    + bankHtml(c.bank, EDIT ? "" : v.memo)
    /* 어드민 「인보이스 발급」은 이 원본을 수정 모드로 띄워 메모를 덧붙인다(사장님 2026-10-03, 바우처와 같은 방식) */
    + (EDIT ? '<div class="sec"><h3>Memo</h3><textarea class="ed" id="edMemo" rows="3" placeholder="입금 기한·예약처 컨펌번호 등 덧붙일 글">' + esc(v.memo || "") + '</textarea></div>' : '')
    + (c.invoiceNote ? '<div class="box"><h3>안내</h3><p>' + esc(c.invoiceNote) + '</p></div>' : '')
    + '<div class="sec issued"><h3>Issued by : <span style="font-weight:600">' + esc(c.name || "") + (c.tel ? ' (Tel : ' + esc(c.tel) + ')' : '') + '</span></h3>'
      + (c.regNo ? '<p class="small">- Registration No : ' + esc(c.regNo) + '</p>' : '')
      + (c.email ? '<p class="small">- Email : ' + esc(c.email) + '</p>' : '') + '</div>'
    + '</div>';
  document.title = "인보이스 " + v.no + " · " + (c.name || "");
  $("#act").style.display = "";
  if(EDIT){
    $("#app").insertAdjacentHTML("afterbegin", '<div class="edbar">✏ <b>수정 모드</b> — '
      + (v.released ? '' : '<b style="color:#D32F2F">(발송 전)</b> · ')
      + '노란 칸에 덧붙일 글을 적고 아래 「저장」, 보낼 때는 「발송하기」. 손님 화면에는 적은 글자만 보입니다.'
      + '<span id="edMsg"></span></div>');
    edSaveBtn(v); edSendBtn(v);
  }
}
function fail(msg){
  $("#app").innerHTML = '<div class="err"><h2>예약 확정서를 열 수 없습니다</h2><p>' + esc(msg) + '</p></div>';
}
(async () => {
  const q = new URLSearchParams(location.search);
  const no = q.get("no") || "", t = q.get("t") || "";
  if(!no || !t) return fail("바우처 주소가 올바르지 않습니다. 받으신 링크를 그대로 열어 주세요.");
  try{
    const r = await fetch("/api/golf-book", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "voucher", no, t, d: q.get("d") || "", e: EDIT ? "1" : "", i: q.get("inv") === "1" ? "1" : "" }) });
    const j = await r.json().catch(() => ({}));
    if(!j || !j.ok) return fail((j && j.error) || "서버 응답이 없습니다. 잠시 뒤 다시 열어 주세요.");
    if(j.v && j.v.type === "invoice") (j.v.kind === "items" ? renderItemInvoice : renderInvoice)(j.v); else render(j.v);
  }catch(e){ fail("서버 연결에 실패했습니다. 잠시 뒤 다시 열어 주세요."); }
})();
</script>
</body>
</html>
