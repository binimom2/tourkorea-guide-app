<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투어코리아 · 사이트 관리</title>
<script src="../ovguard.js"></script><!-- 창 안에서 드래그하다 배경에서 떼도 창이 안 닫히게(공통 안전장치, 사장님 2026-09-14) -->
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../data.js"></script>
<style>
:root{
  --fairway:#123A2B; --fairway-deep:#08170F; --fairway-mid:#1C5B42;
  --paper:#F7F3E9; --marigold:#E8A33D; --ink:#15211C;
  --line:rgba(18,58,43,.18); --muted:#5E6F66; --danger:#c0492f;
  --font:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
/* 적어 넣은 글자는 검정(굵기는 보통 — 굵게 했더니 너무 진하다고 하심), 예시 글(placeholder)은 옅은 회색 — 둘이 비슷해 보여 헷갈린다고 하심(사장님 2026-09-19) */
/* 이 PC 글꼴(맑은 고딕)은 굵기가 보통·굵게 둘뿐이라 그 사이가 없다 — 보통 굵기에 아주 가는 검정 테두리(0.3px)를 둘러
   「보통과 굵게의 중간」으로 보이게 한다. 보통은 회색처럼 보이고 굵게는 너무 진하다고 하심(사장님 2026-09-19) */
/* ⚠ 처음엔 -webkit-text-stroke(글자 테두리)로 했는데, 그 뒤로 「한글을 치면 마지막 글자가 지워져 두 번씩 친다」고 하심.
   입력 처리 코드에는 그 칸 값을 건드리는 곳이 없어, 한글 조합 중인 글자와 테두리 그리기가 부딪친 것으로 보고
   조합과 무관한 그림자(text-shadow)로 바꿨다 — 다시 text-stroke로 돌리지 말 것. */
input,select,textarea{font:inherit;color:#000;text-shadow:0 0 .55px rgba(0,0,0,.75)}
input::placeholder,textarea::placeholder{color:#B4BDB8;font-weight:400;opacity:1;text-shadow:none}
select[data-rmf=sur]{text-shadow:none}

/* ── 로그인 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--fairway),var(--fairway-deep))}
.lbox{background:var(--paper);border-radius:18px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 22px 60px rgba(0,0,0,.35)}
.lbox h1{margin:0 0 3px;font-size:21px;font-weight:900;letter-spacing:-.04em}
.lbox p.sub{margin:0 0 22px;font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld label{font-size:11.5px;font-weight:800;color:var(--muted)}
.fld input{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px}
.fld input:focus{outline:2px solid var(--marigold);outline-offset:1px}
.lbtn{width:100%;background:var(--fairway);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:800;margin-top:6px}
.lbtn:hover{background:var(--fairway-mid)}
.lerr{margin-top:11px;font-size:13px;font-weight:700;color:var(--danger);min-height:18px}

/* ── 헤더 ── */
.top{position:sticky;top:0;z-index:40;background:var(--fairway);color:#fff}
.top .in{max-width:1180px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b.brand{font-size:16px;font-weight:900;letter-spacing:-.03em}
.top .who{margin-left:auto;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.72);white-space:nowrap}
.top a,.top button.lnk{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;text-decoration:none}
.top a:hover,.top button.lnk:hover{background:rgba(255,255,255,.22)}
/* 직원·어드민이 화면끼리 오갈 수 있게 — 손님 로그인과는 다른 문이다 */
.jump{display:flex;gap:6px;flex-wrap:wrap}

/* ── 탭 ── */
.tabs{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;color:var(--fairway)}
.tabs button.on{background:var(--fairway);border-color:var(--fairway);color:#fff}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--fairway)}
.subtabs button.on{background:var(--marigold);border-color:var(--marigold);color:#2A1A00}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px 17px;margin-bottom:14px}
.card > h2{margin:0 0 3px;font-size:15.5px;font-weight:800}
.card > p.desc{margin:0 0 13px;font-size:12.5px;color:var(--muted)}

/* ── 표 ── */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1020px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
th{background:rgba(18,58,43,.06);font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td input,td select,td textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px}
td input:focus,td select:focus,td textarea:focus{outline:2px solid var(--marigold);outline-offset:0}
td textarea{resize:vertical;min-height:34px;line-height:1.45}
/* 소개 문구처럼 긴 글을 적는 칸은 더 높게 잡는다 */
td textarea.big{min-height:80px}
/* 지역 · 이름 · 영문 · 등급 한 줄, 그 아래 안내사항을 넓게(사장님 2026-09-23 — 사진칸 때문에 줄 높이가 남는다) */
.infogrid{display:grid;grid-template-columns:86px minmax(180px,1.4fr) minmax(160px,1.2fr) 60px;gap:6px}
.infogrid>.infod{grid-column:1/-1}
.infogrid>.infod textarea{min-height:120px}
.infohd>span{white-space:nowrap}
/* 포함·불포함사항은 그 줄 「아래」에 한 줄을 더 깔아 넓게 적는다.
   위 줄과 한 덩어리로 보이도록 사이 선을 지우고 아래 줄만 선을 남긴다. */
tr.mainrow td{border-bottom:0;padding-bottom:2px}
/* 접힌 아래 줄(포함·불포함·요금·바우처 주소)은 감춘다 — 「▸ 펼치기」로 연다(사장님 2026-09-17) */
tr.subrow.fold{display:none}
tr.mainrow:has(+tr.subrow.fold) td{border-bottom:1px solid var(--line);padding-bottom:8px}   /* 접힌 줄은 밑줄로 구분 */
.foldb{color:#2A1A00;background:#FFF3DA;border-color:#F0D39A}
.regchips{margin:0 0 10px}
.regchips button b{font-weight:800;opacity:.7;margin-left:2px}
tr.subrow td{padding:0 6px 11px}
/* 포함·불포함은 반씩 나눠 쓰고, 요금은 그 아래 한 줄을 통째로 쓴다(칸이 다섯 개라 넓어야 한다) */
.ierow{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding-left:58px}
.pcell{grid-column:1/-1}
.iecell{display:flex;flex-direction:column;gap:3px}
.iecell b{font-size:11px;font-weight:800;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.iecell b a{font-size:10.5px;font-weight:800;color:var(--fairway-mid);text-decoration:none}
.iecell b a:hover{text-decoration:underline}
.iecell textarea{min-height:50px}
/* 요금 칸 — 읽기 전용이라 입력칸과 다르게 보이도록 바탕을 깔고 테두리를 점선으로 */
.pbox{min-height:50px;padding:7px 9px;border:1px dashed var(--line);border-radius:7px;
  background:rgba(18,58,43,.035);display:flex;flex-direction:column;gap:3px}
.pbox span{font-size:11.5px;line-height:1.45}
.preg{font-weight:800;color:var(--fairway)}
.pln{color:var(--ink);font-variant-numeric:tabular-nums}
.pno{font-weight:800;color:var(--danger)}
.pmute{color:var(--muted)}
/* 요금 줄 — 기간 · 구분 · 시간 · 18홀 · 9홀 한 줄. 「＋」로 얼마든지 더한다. */
.rhint{font-weight:700;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:4px}
/* 기간 칸 258px — 날짜 입력 두 개(각 116px)+물결+틈에 252px이 든다. 234px일 때 끝 날짜가 「구분」 칸 위로 13px 넘어가 겹쳤다(사장님 2026-09-18) */
.rhead,.rrow{display:grid;grid-template-columns:258px 84px 74px 88px 88px 26px;
  gap:5px;align-items:center}
.rhead{font-size:10.5px;font-weight:800;color:var(--muted);padding:0 1px}
/* 메뉴별 요금(스파·티켓…) — 메뉴(시간 포함) · 코스·내용 · 적용 기간 · 밧 네 칸 */
.mhead,.mrow{grid-template-columns:1fr 1.1fr 258px 100px 44px 26px}   /* …밧 · 복사 · ✕ */
/* 메뉴 요금 줄 「복사」 — 호텔 객실 「복사」 단추와 같은 모양(사장님 2026-09-19) */
.rcpy{background:none;border:1px solid var(--line);border-radius:6px;color:var(--fairway);
  font-size:11px;font-weight:800;padding:4px 5px;cursor:pointer;white-space:nowrap}
.rcpy:hover{background:rgba(18,58,43,.08)}
.mhead{align-items:end}   /* 「적용 기간」 머리글이 두 줄(설명 + 시작일·끝일)이라 아래로 맞춘다 */
.mrow .rdate.mprom input{background:#FEF6E4;border-color:#E8C88A}   /* 기간이 든 줄(프로모션)은 노랗게 */
/* 기간 칸 — 위는 「자주 쓰는 기간」 고르기, 아래는 날짜 두 개.
   달력을 매번 여는 게 일이라, 한 번 담아 둔 기간을 골라 쓰는 길을 위에 뒀다. */
.rper{display:flex;flex-direction:column;gap:3px;min-width:0}
/* 날짜 두 칸은 어디서든 «시작 ~ 끝» 한 줄로 나란히 — 스파·티켓 메뉴 줄은 .rper 없이 .rdate만 써서 이 배치가 안 먹고
   시작·끝이 세로로 쌓여 윗줄·아랫줄 날짜와 섞여 보였다(사장님 2026-09-19 「기간이 헷갈림」). 그래서 .rper 조건을 뺐다 */
.rdate{display:grid;grid-template-columns:1fr 10px 1fr;gap:4px;align-items:center;min-width:0}
/* 머리글의 「시작일 ~ 끝일」 — 아래 날짜 칸과 같은 배치라 칸 위에 딱 맞게 선다 */
.rdhd{margin-top:2px}
.rdhd>span{font-weight:800;color:var(--ink)}
.rrow input,.rrow select{padding:5px 6px;font-size:12px;border:1px solid var(--line);
  border-radius:6px;background:#fff;width:100%}
.rrow input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
/* 방금 더했거나 마지막으로 손댄 요금 줄 — 정렬로 자리가 바뀌어도 찾기 쉽게 노랗게(사장님 2026-09-18) */
.rrow.hot{background:#FFE9A8;border-radius:8px;box-shadow:0 0 0 4px #FFE9A8}
.rtil{text-align:center;color:var(--muted);font-size:11px}
.rdel{background:none;border:0;color:var(--danger);font-size:13px;font-weight:900;
  cursor:pointer;padding:2px}
.rdel:hover{background:rgba(192,73,47,.1);border-radius:5px}
.rnone{font-size:11.5px;color:var(--muted);padding:4px 1px}
.radd{margin-top:5px;align-self:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:800;color:var(--fairway)}
.radd:hover{background:rgba(18,58,43,.06)}
/* ── 호텔 객실 (2026-09-03~) ──
   호텔은 골프장과 요금 모양이 달라 칸을 따로 뒀다. 한 객실이 «내용 한 줄 + 기간별 요금 여러 줄»이다.
   내용(면적·뷰·침대·조식·사진)은 golf_site에, 요금(주중·주말)은 요금표에 나뉘어 저장된다. */
.rmlist{display:flex;flex-direction:column;gap:9px}
.rmrow{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff}
.rmhead{display:grid;grid-template-columns:1.5fr 78px 96px 1.2fr 62px 44px 22px;gap:5px;align-items:center}
.rmhead input{padding:5px 6px;font-size:12px;border:1px solid var(--line);border-radius:6px;width:100%}
/* 침대 칸 — 줄바꿈이 되는 칸이라 textarea. 적은 줄 수만큼 높이가 따라간다(rows) */
.rmhead textarea{padding:5px 6px;font-size:12px;font-family:inherit;line-height:1.35;border:1px solid var(--line);border-radius:6px;width:100%;resize:none;min-height:0;box-sizing:border-box;white-space:pre-wrap}
.rmbf{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.rmbf input{margin:0;width:auto}
.rmcpy{background:none;border:1px solid var(--line);border-radius:6px;color:var(--fairway);
  font-size:11px;font-weight:800;padding:4px 5px;cursor:pointer;white-space:nowrap}
.rmcpy:hover{background:rgba(18,58,43,.08)}
.rmdel,.rmrdel{background:none;border:0;color:var(--danger);font-size:13px;font-weight:900;cursor:pointer;padding:2px}
.rmdel:hover,.rmrdel:hover{background:rgba(192,73,47,.1);border-radius:5px}
.rminc{display:flex;align-items:center;gap:7px;margin-top:6px}
.rminc>label{font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}
/* 최소 숙박·갈라디너 — 한 줄에 이어서, 「＋」 단추는 줄 끝에(사장님 2026-09-23) */
/* 호텔 규칙 줄 안내 글자 — 검정, 한 단계 크게(사장님 2026-09-23) */
.rcell .rminc>label{font-size:11.5px;color:#222}
.rcell .rminc .rhint{font-size:12px!important;color:#222}
.rcell .hrow{font-size:13px;color:#222}
.rminc.hrule{margin-top:4px}
/* 인보이스 확인·수정 창 */
#invPrev{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.ivbox{background:#fff;border-radius:10px;width:min(1320px,100%);height:min(94vh,1200px);display:flex;flex-direction:column;overflow:hidden}
.ivtop{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ivmain{flex:1;display:grid;grid-template-columns:minmax(360px,470px) 1fr;min-height:0}
.ivmain iframe{width:100%;height:100%;border:0;border-left:1px solid var(--line)}
.ivform{overflow:auto;padding:6px 14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;align-content:start}
.ivform h4{grid-column:1/-1;margin:12px 0 0;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:3px}
.ivf{display:flex;flex-direction:column;gap:2px;font-size:11.5px;font-weight:700;color:#222}
.ivf.wide{grid-column:1/-1}
.ivf input,.ivf textarea,.ivday input{padding:5px 7px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;font-weight:600}
.ivdays{grid-column:1/-1;display:flex;flex-direction:column;gap:3px}
.ivday{display:flex;gap:4px;align-items:center;font-size:11.5px}
.ivday b{width:78px;flex:none}
.ivday input{min-width:0;flex:1;padding:3px 5px;font-size:12px}
@media (max-width:900px){ .ivmain{grid-template-columns:1fr;grid-template-rows:auto 60vh} .ivmain iframe{border-left:0;border-top:1px solid var(--line)} }
.rminc.hrule>label{min-width:78px}
.hlist{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.hrow{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.rminc .hrow input{flex:none;width:auto;padding:3px 5px}
.rminc .hrow input.hnum{width:70px}
.rminc .hrow input.hname{width:110px}
.hdel{border:none;background:none;color:#D32F2F;cursor:pointer;font-size:13px}
.hadd{padding:3px 9px;font-size:11.5px;border:1px dashed var(--line);border-radius:6px;background:#fff;cursor:pointer}
.wedays{display:flex;gap:4px}
.wedays button{padding:2px 8px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer}
.wedays button.on{background:#D32F2F;border-color:#D32F2F;color:#fff}
.rminc input{flex:1;padding:5px 6px;font-size:12px;border:1px solid var(--line);border-radius:6px;min-width:0}
/* 요금줄은 내용 폭만큼만(끝쪽 색 여분 없이), 남는 폭은 사진칸이 쓴다(사장님 2026-09-23) */
.rmbody{display:grid;grid-template-columns:max-content minmax(200px,1fr);gap:10px;margin-top:7px}
.rmrates{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.rmhd .hdsplit{display:flex;gap:5px}
.rmhd .hdsplit>span{text-align:center}
.rmhd .hdsplit>span:first-child{width:100px}
.rmhd .hdsplit>span:last-child{flex:1}
/* 한 기간 = 왼쪽(날짜 + 구분) · 가운데(요금표: 주중·주말 두 줄 × 다섯 칸) · ✕ (사장님 2026-09-19) */
.rmhd,.rmrate{display:grid;grid-template-columns:330px auto 22px;gap:6px;align-items:center;justify-content:start}
/* 구분 · 기간을 한 줄로 나란히(사장님 2026-09-23) — 줄 높이를 줄인다. 달력 칸은 날짜가 딱 들어갈 만큼만 */
.rmrate .rper{flex-direction:row;align-items:center;gap:5px}
.rmrate .rper select{flex:none;width:100px;padding-left:4px;padding-right:2px}
.rmrate .rper input[type=date]{padding:5px 2px 5px 4px}
.rmrate .rper .rdate{grid-template-columns:1fr 8px 1fr;gap:2px}
.rmrate .rper .rdate{flex:1}

<script>
/* ══════════════════════════════════════════════════════════════
   위브투어타일랜드 사이트 관리 (어드민 전용)

   다루는 데이터 (Supabase guide_data)
     golf_site       사이트에 보이는 내용 전부 — 이 화면에서만 만든다

function buildPriceIndex(){

       한 항목 = { name, menu:[{n,u,p}] } — 프로그램 이름·시간(단위)·밧 */
    Object.keys(r).forEach(k=>{
      if(k==='courses'||k==='hotels'||!Array.isArray(r[k])) return;

      r[k].forEach(o=>{ if(o&&o.name) PIDX[k][key(o.name)]={reg,o}; });

/* ══════ 값 읽고 쓰기 (경로 문자열) ══════

function getPath(o,p){
  return p.split('.').reduce((a,k)=>(a==null?a:a[/^\d+$/.test(k)?Number(k):k]),o);
}
function setPath(o,p,v){
  const ks=p.split('.'); let cur=o;
  for(let i=0;i<ks.length-1;i++){ const k=/^\d+$/.test(ks[i])?Number(ks[i]):ks[i]; cur=cur[k]; }
  const last=ks[ks.length-1];
  cur[/^\d+$/.test(last)?Number(last):last]=v;
}

/* ══ 한글 마지막 글자 지킴이 (사장님 2026-09-19) ══
   증상: 「소파」까지 치고 마우스로 다른 곳을 누르면 조합 중이던 마지막 글자(「파」)가 사라져 두 번씩 친다.
         키보드로 확정(스페이스·엔터 등)하지 않은 글자를, 브라우저(IME)가 클릭 순간 «확정»이 아니라 «취소»해 버리는 것이다.
         이 화면의 입력 처리기에는 그 칸의 값을 고치는 곳이 없다 — 그래서 값을 되살리는 쪽으로 막는다.
   원리: 조합 중에 본 마지막 값(치던 글자 포함)을 기억해 두었다가, 조합이 끝난 직후 값이 그보다 «짧아졌고»
         그게 키보드(백스페이스·Esc)가 아니라 마우스 클릭 직후에 벌어진 일이면 기억해 둔 값으로 되돌리고
         input 이벤트를 다시 보내 자료(S·요금표)에도 반영한다. 글자를 일부러 지운 경우(키보드)는 건드리지 않는다. */
/* 2차(같은 날): 객실 이름 칸(「슈페리어스위트」의 「트」)에서도 나왔다 — 클릭뿐 아니라 Tab으로 넘어갈 때·칸을 벗어난 뒤
   늦게 빠지는 경우까지 막는다. 「클릭 직후일 때만」 조건을 버리고, **지우는 키(Backspace·Delete·Esc)를 누른 경우만 빼고**
   되살린다. 칸을 벗어날 때(focusout)와 change 직전(캡처 단계 — 이름 칸의 change 처리기가 잘린 이름으로 요금표 자리를
   옮기기 전에)에도 한 번 더 본다. */
(function(){
  const DEL={Backspace:1,Delete:1,Escape:1};
  const ime={el:null,val:null,valTs:0,delTs:0};
  let pend=null;                                   // 조합이 막 끝난 칸 — {el,want,until}
  document.addEventListener('keydown',e=>{ if(DEL[e.code]||DEL[e.key]){ ime.delTs=Date.now(); pend=null; } },true);   // 지우는 키를 누르면 되살리기를 그만둔다
  document.addEventListener('input',e=>{
    const el=e.target;
    if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA')) return;
    if(e.isComposing){ ime.el=el; ime.val=el.value; ime.valTs=Date.now(); }
  },true);
  function fix(){
    if(!pend) return;
    const {el,want,until}=pend;
    if(Date.now()>until){ pend=null; return; }
    if(el.value===want||el.value.length>=want.length) return;            // 제대로 확정됐다(아직은) — 조금 뒤 다시 본다
    pend=null;
    const lost=want.slice(el.value.length);
    el.value=want;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    /* 되살렸을 때 한 줄 알린다 — 「내 실수인지 프로그램 문제인지 알 수가 없다」(사장님). 이 알림이 뜨면 프로그램(입력기) 쪽에서
       글자가 빠진 것을 잡아 준 것이고, 알림 없이 글자가 없으면 처음부터 안 쳐진 것이다. */
    try{ if(typeof toast==='function') toast('↩ 빠질 뻔한 마지막 글자 「'+lost+'」를 되살렸습니다'); }catch(_){}
  }
  document.addEventListener('compositionend',e=>{
    const el=e.target, want=(ime.el===el)?ime.val:null, valTs=ime.valTs;
    ime.el=null; ime.val=null;
    if(want==null) return;
    if(ime.delTs>=valTs) return;                                          // 지우는 키로 끝난 조합 — 일부러 지운 것이다
    pend={el,want,until:Date.now()+1200};
    fix(); [0,60,250,600].forEach(ms=>setTimeout(fix,ms));                // 브라우저마다 값이 빠지는 때가 조금씩 다르다
  },true);
  /* 칸을 벗어나는 순간·change 직전에도 본다. 다시 그 칸에 글자를 치기 시작하면 기다리던 것은 버린다 */
  document.addEventListener('focusout',e=>{ if(pend&&pend.el===e.target) fix(); },true);
  document.addEventListener('change',e=>{ if(pend&&pend.el===e.target) fix(); },true);
  document.addEventListener('beforeinput',e=>{ if(pend&&pend.el===e.target&&!e.isComposing) pend=null; },true);
})();
/* 입력은 전부 여기서 받아 S에 반영한다 */

       프로그램이 커서를 넣어 준 경우(창이 아직 초점을 못 받아 focusin이 안 뜸)에 예전 이름이 비어
       요금표 자리가 안 따라가 요금이 사라졌다(사장님 2026-09-18). 글자마다 요금표 자리 이름도 같이 옮겨
       두면 칸을 벗어나기 전에 Ctrl+S를 눌러도 요금이 새 이름을 따라간다. */
    if(el.dataset.prev===undefined) el.dataset.prev=String(getPath(S,p)||'');
    setPath(S,p,el.value);             // (다 치고 칸을 벗어날 때 요금 칸만 새로 그린다)
    const cntEl=document.getElementById('iCnt');
    if(cntEl&&el.dataset.prev!==el.value&&renamePriceHome(cntEl.dataset.k,el.dataset.prev,el.value)) el.dataset.prev=el.value;
  }else if(el.dataset.list){           // 지역 차례처럼 「·」로 이어 적고 목록으로 저장하는 칸
    setPath(S,p,el.value.split(/[·,]/).map(s=>s.trim()).filter(Boolean));
  }else if(el.dataset.pics){           // 사진칸 — 첫 줄이 대표(img), 나머지가 imgs
    const list=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    const o=getPath(S,p);
    if(o){ o.img=list[0]||''; o.imgs=list.slice(1); }
  }else{
    setPath(S,p,el.value);
  }
  markDirty('site');
});

function refreshItemOn(el){

  /* 한 항목이 두 줄(위: 이름·소개, 아래: 포함·불포함)이라 둘 다 같이 흐려져야 한다 */

   글자마다 다시 그리면 한글 조합이 끊기므로 change(=칸을 벗어날 때)에서만 한다. */
/* 이름칸에 들어갈 때 예전 이름을 적어 둔다 — 이름을 바꾸면 요금표의 자리도 그 이름으로 따라가게(아래 change) */
document.getElementById('pane').addEventListener('focusin',e=>{

/* 글 칸(소개 문구·포함·불포함…)은 눌러 들어가면 내용 길이만큼 저절로 늘어난다(사장님 2026-09-18) — 전에는 매번 모서리를
   끌어서 늘린 뒤 작업했다. 칸을 벗어나도 줄이지 않는다 — 줄이면 아래 칸들이 위로 튀어 방금 누른 단추를 빗나간다.
   표를 다시 그리면(찾기·저장 등) 원래 높이로 돌아가 목록은 계속 짧게 유지된다. 사진 주소 칸은 제외 */
function growTa(el){
  if(!el||el.tagName!=='TEXTAREA'||!el.dataset||!el.dataset.p||el.closest('.picbox')) return;
  if(el.scrollHeight>el.clientHeight+2) el.style.height=(el.scrollHeight+6)+'px';
}

/* 요금표(golf_pricing)는 이름으로 이어진다. 이름을 고치면 옛 이름 자리의 요금이 못 찾아져 「요금이 사라진」 것처럼 보였다
   (복사 뒤 풀네임으로 고칠 때, 사장님 2026-09-17). 그래서 이름이 바뀌면 요금표 자리의 이름도 같이 바꾼다.
   새 이름 자리에 이미 요금이 들어 있으면 그쪽을 살리고(합치지 않는다) 옛 자리는 그대로 둔다. */
function renamePriceHome(k,oldName,newName){
  if(!P||!P.regions) return false;
  const nk=n=>String(n||'').replace(/\s+/g,'').toLowerCase();
  if(!nk(oldName)||!nk(newName)||nk(oldName)===nk(newName)) return false;
  const arrName=(k==='hotels')?'hotels':(k==='courses')?'courses':k;
  let src=null, dst=null;
  Object.values(P.regions).forEach(rv=>{ (rv&&rv[arrName]||[]).forEach(o=>{
    if(!o) return;
    if(nk(o.name)===nk(oldName)) src=src||o; else if(nk(o.name)===nk(newName)) dst=dst||o; }); });
  if(!src) return false;
  const has=o=>!!((Array.isArray(o.rates)&&o.rates.length)||(Array.isArray(o.menu)&&o.menu.length)||(Array.isArray(o.rooms)&&o.rooms.length)||oldSeasonCount(o));
  if(dst&&has(dst)) return false;
  if(dst) Object.values(P.regions).forEach(rv=>{ const a=rv&&rv[arrName]; if(Array.isArray(a)){ const i=a.indexOf(dst); if(i>=0) a.splice(i,1); } });
  src.name=newName;
  buildPriceIndex(); markDirty('rates');
  return true;
}
document.getElementById('pane').addEventListener('change',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.pname) return;
  const cnt=document.getElementById('iCnt'); if(!cnt) return;
  const k=cnt.dataset.k, tr=el.closest('tr'), sub=tr&&tr.nextElementSibling;
  if(el.dataset.prev!==undefined&&el.dataset.prev!==el.value){ renamePriceHome(k,el.dataset.prev,el.value); el.dataset.prev=el.value; }
  if(!sub||!sub.classList.contains('subrow')) return;
  const item=getPath(S,el.dataset.p.replace(/\.n$/,''));
  /* 호텔은 아래 줄이 「객실 요금」 칸이다 — 이름이 바뀌면 그 칸이 들고 있던 이름도 같이 고쳐야 한다 */
  const rcell=sub.querySelector('.rcell');
  if(rcell){
    const box=document.createElement('div'); box.innerHTML=roomCell(item,Number(rcell.dataset.rix));
    rcell.replaceWith(box.firstChild);
    cnt.innerHTML=itemCntHTML(k);
    return;
  }
  const old=sub.querySelector('.pcell'); if(!old) return;
  const box=document.createElement('div'); box.innerHTML=priceCell(k,item);
  old.replaceWith(box.firstChild);
  cnt.innerHTML=itemCntHTML(k);
});
function anyDirty(){ return Object.keys(dirty).some(k=>dirty[k]); }
window.addEventListener('beforeunload',e=>{ if(anyDirty()){ e.preventDefault(); e.returnValue=''; } });

/* ══════ 📑 견적 기록 (사장님 2026-09-16) ══════
   실시간 견적(/golf/)에서 「견적서 보기」를 눌러 견적서가 만들어지면 guide_data/golf_quotes 에 그때 금액이 통째로 남는다
   (요금표를 나중에 고쳐도 지난 견적은 안 바뀐다). 여기서는 그 기록을 표로 보여 원가(항목별 금액)가 제대로 잡혔는지 확인한다.
   읽기만 한다 — 고치거나 지우지 않는다. */
let QUOTES=null, quoteQ='', quoteOpen='';
const qKrwUp=n=>Math.ceil(n/1000)*1000;   // /golf/ 의 krwUp 과 같은 규칙(1인 요금 천원 단위 올림)
const qNum=n=>Number(n||0).toLocaleString('ko-KR');
async function loadQuotes(){
  try{ const list=await loadRaw('golf_quotes'); QUOTES={list:Array.isArray(list)?list:[]}; }
  catch(e){ QUOTES={error:'견적 기록을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'}; }
  drawQuotes();
}
function drawQuotes(){
  const p=document.getElementById('pane');

    p.innerHTML='<div class="card"><h2>📑 견적 기록</h2><p class="desc">불러오는 중…</p></div>';

  if(QUOTES.error){
    p.innerHTML='<div class="card"><h2>📑 견적 기록</h2><p class="desc" style="color:#B23B3B">'+esc(QUOTES.error)+'</p>'
      +'<button class="add" id="qtReload">다시 불러오기</button></div>';
    document.getElementById('qtReload').onclick=()=>{ QUOTES=null; drawQuotes(); };
    return;
  }
  const all=QUOTES.list||[];
  const q=quoteQ.trim().toLowerCase();

    const fx=Number(r.fx||0), pax=Number(r.pax||0);

/* ══════ 🏢 여행사 회원 (B2B, 사장님 2026-09-17) ══════
   손님 사이트에서 여행사가 아이디·비밀번호·명함으로 가입을 신청하면 여기 「대기」로 들어온다.
   명함을 보고 승인하면 그 아이디로 로그인해 실시간 견적을 바로 쓴다(별도 단계 없음). 레벨은 하나.
   마진 예외: 비워 두면 기본, 특정 여행사만 다른 마진을 줄 때 숫자(밧)를 적는다.
   ⚠ 첫 승인 전에 README-여행사회원-권한정책.txt 의 정책 SQL이 실행되어 있어야 한다. */
const AG_STATUS=[
  {k:'pending',   t:'대기',   c:'#E8A33D'},
  {k:'approved',  t:'승인',   c:'#2E7D4F'},
  {k:'rejected',  t:'거절',   c:'#B23B3B'},
  {k:'suspended', t:'정지',   c:'#9AA5A0'}
];
let AGENCIES=null, agFilter='pending', agOpenId='', agCard={};
const agSt=k=>AG_STATUS.filter(s=>s.k===k)[0]||AG_STATUS[0];
async function agencyApi(action,payload){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const token=session&&session.access_token;
    if(!token) return {error:'로그인이 만료되었습니다. 다시 로그인해 주세요.'};
    const r=await fetch('/api/agency',{method:'POST',
      headers:{'content-type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify(Object.assign({action},payload||{}))});
    return await r.json().catch(()=>({error:'서버 응답을 해석할 수 없습니다.'}));
  }catch(e){ return {error:'서버 연결 실패: '+((e&&e.message)||e)}; }
}
async function loadAgencies(){
  const j=await agencyApi('list');
  AGENCIES=j.error?{error:j.error}:{list:Array.isArray(j.list)?j.list:[]};
  drawAgencies();
}
function drawAgencies(){
  const p=document.getElementById('pane');
  if(AGENCIES===null){
    p.innerHTML='<div class="card"><h2>🏢 여행사 회원</h2><p class="desc">불러오는 중…</p></div>';
    loadAgencies(); return;
  }
  if(AGENCIES.error){
    p.innerHTML='<div class="card"><h2>🏢 여행사 회원</h2><p class="desc" style="color:#B23B3B">'+esc(AGENCIES.error)+'</p><button class="add" id="agReload">다시 불러오기</button></div>';
    document.getElementById('agReload').onclick=()=>{ AGENCIES=null; drawAgencies(); };
    return;
  }
  const canDecide=(GROLE==='admin'||GROLE==='manager');
  const all=AGENCIES.list||[];
  const cnt=k=>all.filter(a=>a.status===k).length;
  const list=all.filter(a=>agFilter==='all'||a.status===agFilter);
  const th=(t,st)=>'<th style="text-align:left;white-space:nowrap;padding:8px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);'+(st||'')+'">'+t+'</th>';
  const td=(t,st)=>'<td style="padding:8px 8px;font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:top;'+(st||'')+'">'+t+'</td>';
  const rows=list.map(a=>{
    const st=agSt(a.status), open=agOpenId===a.id;
    const badge='<span style="font-size:10.5px;font-weight:800;color:#fff;background:'+st.c+';border-radius:999px;padding:1px 8px">'+st.t+'</span>';
    const main='<tr data-ag="'+esc(a.id)+'" style="cursor:pointer;'+(open?'background:#FBF7EC;':'')+'">'
      +td(badge,'white-space:nowrap')
      +td('<b>'+esc(a.company||'')+'</b><div style="color:var(--muted);font-size:11.5px">'+esc(a.id)+'</div>')
      +td(esc(a.contact||'')+'<div style="color:var(--muted);font-size:11.5px">'+esc(a.tel||'')+(a.email?' · '+esc(a.email):'')+'</div>')
      +td(esc((a.at||'').replace('T',' ').slice(0,16)),'white-space:nowrap;color:var(--muted)')
      +td(a.margin==null?'<span style="color:var(--muted)">기본</span>':'<b>'+esc(a.margin)+'밧</b>','white-space:nowrap')
      +td(esc(a.note||''),'max-width:220px;color:var(--muted)')
      +td(open?'▲':'▼','text-align:center;color:var(--muted)')
      +'</tr>';
    if(!open) return main;
    const card=agCard[a.id];
    const cardHtml=card===undefined?'<p class="hint">명함을 불러오는 중…</p>'
      :(card&&card.data?'<img src="'+card.data+'" alt="명함" style="max-width:100%;max-height:360px;border:1px solid var(--line);border-radius:8px;background:#fff;object-fit:contain">'
        :'<p class="hint" style="color:#B23B3B">'+esc((card&&card.error)||'명함이 없습니다.')+'</p>');
    const hist=(a.history||[]).slice().reverse().map(h=>'<div>'+esc((h.at||'').replace('T',' ').slice(0,16))+' · '+esc(agSt(h.status).t)+(h.by?' · '+esc(h.by):'')+'</div>').join('');
    const btn=(k,t,c)=>'<button data-st="'+k+'" '+(canDecide?'':'disabled')+' style="background:'+c+';color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;opacity:'+(a.status===k?'.35':'1')+'">'+t+'</button>';
    const sub='<tr data-agsub="'+esc(a.id)+'"><td colspan="7" style="padding:12px 14px 16px;background:#FBF7EC;border-bottom:1px solid var(--line)">'
      +'<div style="display:grid;grid-template-columns:minmax(260px,1fr) 1.2fr;gap:16px;align-items:start">'
        +'<div><div style="font-size:12px;font-weight:800;color:var(--fairway);margin-bottom:6px">명함</div>'+cardHtml+'</div>'
        +'<div>'
          +'<div style="font-size:12px;font-weight:800;color:var(--fairway);margin-bottom:6px">처리</div>'
          +'<div style="display:flex;flex-wrap:wrap;gap:6px">'+btn('approved','✔ 승인','#2E7D4F')+btn('rejected','거절','#B23B3B')+btn('suspended','정지','#9AA5A0')+btn('pending','대기로','#E8A33D')+'</div>'
          +(canDecide?'':'<p class="hint">승인·거절은 어드민·매니저1만 할 수 있습니다.</p>')
          +'<div style="margin-top:12px;font-size:12px;font-weight:800;color:var(--fairway)">마진 예외 (밧, 비우면 기본)</div>'
          +'<div style="display:flex;gap:6px;margin-top:4px"><input data-margin type="number" min="0" step="1" value="'+(a.margin==null?'':esc(a.margin))+'" placeholder="기본" '+(canDecide?'':'disabled')+' style="width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit">'
          +'<button data-f="margin" '+(canDecide?'':'disabled')+' class="add">저장</button></div>'
          +'<div style="margin-top:12px;font-size:12px;font-weight:800;color:var(--fairway)">직원 메모</div>'
          +'<div style="display:flex;gap:6px;margin-top:4px"><input data-note type="text" value="'+esc(a.note||'')+'" placeholder="예: 모두투어 협력사 · 담당 김OO" style="flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit">'
          +'<button data-f="note" class="add">저장</button></div>'
          +'<div style="margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.6">'+(hist||'')+'</div>'
          +(GROLE==='admin'?'<div style="margin-top:14px"><button data-f="remove" style="background:none;border:1px solid #B23B3B;color:#B23B3B;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer">계정·명함·기록 삭제</button></div>':'')
        +'</div>'
      +'</div></td></tr>';
    return main+sub;
  }).join('');
  const fbtn=(k,t)=>'<button data-flt="'+k+'" class="'+(agFilter===k?'on':'')+'">'+t+(k==='all'?' ('+all.length+')':' ('+cnt(k)+')')+'</button>';
  p.innerHTML='<div class="card">'
    +'<h2>🏢 여행사 회원 <span class="bkcnt">대기 '+cnt('pending')+'건</span></h2>'
    +'<p class="desc">손님 사이트에서 들어온 여행사 가입 신청입니다. 줄을 누르면 명함이 펼쳐집니다. <b>승인</b>하면 그 아이디로 로그인해 실시간 견적을 바로 쓸 수 있습니다. 레벨은 하나이고, 특정 여행사만 마진을 달리 줄 때 「마진 예외」에 적습니다.</p>'
    +'<div class="subtabs">'+fbtn('pending','대기')+fbtn('approved','승인')+fbtn('rejected','거절')+fbtn('suspended','정지')+fbtn('all','전부')+'<button data-f="reload">↻ 새로고침</button></div>'
    +(list.length?'<div style="overflow:auto"><table style="min-width:820px"><thead><tr>'+th('상태')+th('여행사 · 아이디')+th('담당자 · 연락처')+th('신청일시')+th('마진')+th('메모')+th('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
      :'<p class="desc" style="padding:18px 0">'+(agFilter==='pending'?'대기 중인 신청이 없습니다.':'해당하는 여행사가 없습니다.')+'</p>')
    +'</div>';
  p.querySelectorAll('.subtabs button[data-flt]').forEach(b=>b.onclick=()=>{ agFilter=b.dataset.flt; drawAgencies(); });
  p.querySelector('.subtabs button[data-f="reload"]').onclick=()=>{ AGENCIES=null; agCard={}; drawAgencies(); };
  p.querySelectorAll('tr[data-ag]').forEach(tr=>tr.onclick=()=>{
    const id=tr.dataset.ag;
    agOpenId=(agOpenId===id)?'':id;
    drawAgencies();
    if(agOpenId&&agCard[id]===undefined){ agencyApi('card',{id}).then(j=>{ agCard[id]=j.error?{error:j.error}:{data:j.data}; if(agOpenId===id) drawAgencies(); }); }
  });
  const openRow=agOpenId?p.querySelector('tr[data-agsub="'+CSS.escape(agOpenId)+'"]'):null;
  if(openRow&&agOpenId){
    const a=all.find(x=>x.id===agOpenId);
    openRow.querySelectorAll('button[data-st]').forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      const st=b.dataset.st, t=agSt(st).t;
      if(st===a.status) return;
      if(!confirm('['+(a.company||a.id)+'] 을(를) 「'+t+'」 상태로 바꿉니다.'+(st==='approved'?'\n승인하면 이 아이디로 로그인해 실시간 견적을 볼 수 있습니다.':'')+'\n\n계속할까요?')) return;
      b.disabled=true;
      const j=await agencyApi('status',{id:a.id,status:st});
      if(j.error){ alert(j.error); b.disabled=false; return; }
      a.status=st; a.history=(a.history||[]).concat([{at:new Date().toISOString(),status:st,by:'나'}]);
      drawAgencies();
    });
    const mBtn=openRow.querySelector('button[data-f="margin"]');
    if(mBtn) mBtn.onclick=async(e)=>{ e.stopPropagation(); const v=openRow.querySelector('input[data-margin]').value.trim(); const j=await agencyApi('margin',{id:a.id,margin:v===''?'':+v}); if(j.error){ alert(j.error); return; } a.margin=j.margin; drawAgencies(); };
    const nBtn=openRow.querySelector('button[data-f="note"]');
    if(nBtn) nBtn.onclick=async(e)=>{ e.stopPropagation(); const v=openRow.querySelector('input[data-note]').value.trim(); const j=await agencyApi('note',{id:a.id,note:v}); if(j.error){ alert(j.error); return; } a.note=v; drawAgencies(); };
    const rBtn=openRow.querySelector('button[data-f="remove"]');
    if(rBtn) rBtn.onclick=async(e)=>{ e.stopPropagation(); if(!confirm('['+(a.company||a.id)+'] 계정과 명함, 신청 기록을 모두 지웁니다. 되돌릴 수 없습니다.\n\n정말 삭제할까요?')) return; const j=await agencyApi('remove',{id:a.id}); if(j.error){ alert(j.error); return; } AGENCIES.list=all.filter(x=>x.id!==a.id); agOpenId=''; drawAgencies(); };
    openRow.querySelectorAll('input').forEach(i=>i.onclick=e=>e.stopPropagation());
  }
}

/* ══════ 📋 예약요청 ══════
   손님이 사이트 장바구니에서 「예약 요청 보내기」를 누르면 여기로 들어온다.
   금액은 «손님 화면에 그때 보이던 값»이다 — 확정가가 아니라 요금표로 다시 확인해야 한다. */
const BOOK_STATUS=[
  {k:'new',   t:'접수',   c:'#E8A33D'},
  {k:'confirmed', t:'컨펌 (바우처·인보이스 발급)', c:'#2E7D4F'},   /* 「컨펌」 단추를 누르면 서버가 이 상태로 바꾼다 */
  {k:'doing', t:'진행중', c:'#1C5B42'},
  {k:'paid',  t:'입금완료', c:'#0b3d91'},   /* 사장님 2026-09-21 — 여행사 보관함에도 이 상태가 그대로 보인다(접수 → 진행중 → 컨펌·인보이스 → 입금완료) */
  {k:'done',  t:'완료',   c:'#3C6E71'},
  {k:'cancel',t:'취소',   c:'#9AA5A0'}
];
let BOOKS=null, bookFilter='live';       // live = 접수+진행중만, all = 전부
async function bookApi(action,payload){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const token=session&&session.access_token;
    if(!token) return {error:'로그인이 만료되었습니다. 다시 로그인해 주세요.'};
    const r=await fetch('/api/golf-book',{method:'POST',
      headers:{'content-type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify(Object.assign({action},payload))});
    return await r.json().catch(()=>({error:'서버 응답을 해석할 수 없습니다.'}));
  }catch(e){ return {error:'서버 연결 실패: '+((e&&e.message)||e)}; }
}
function bookWhen(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d)) return '';
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function bookStatusOf(k){ return BOOK_STATUS.filter(s=>s.k===k)[0]||BOOK_STATUS[0]; }
/* 담긴 줄 하나 — 「람차방 CC · 골프장 파타야 / 09.17 · 18홀 · 4명 / 676,000원」.
   종류 이름은 손님이 보낸 글자를 쓰지 않고 여기서 붙인다. */
const BOOK_KIND={courses:'골프장',hotels:'호텔'};
function bookItemHtml(it){
  const money=(it.asked||!it.krw)?'<i class="bkask">요금 문의</i>'
    :('<b>'+Number(it.krw).toLocaleString('ko-KR')+'원</b>'
      +(it.baht?' <i>('+Number(it.baht).toLocaleString('ko-KR')+'밧)</i>':''));
  const tag=[BOOK_KIND[it.kind]||'', it.region||''].filter(Boolean).join(' ');
  return '<li><span class="bkw">'+esc(it.name)
    +(tag?' <i>· '+esc(tag)+'</i>':'')+'</span>'
    +'<span class="bkd">'+esc(it.label||'')+'</span>'
    +'<span class="bkm">'+money+'</span></li>';
}
function drawBooks(){
  const p=document.getElementById('pane');
  if(BOOKS===null){
    p.innerHTML='<div class="card"><h2>📋 예약요청</h2><p class="desc">불러오는 중…</p></div>';
    loadBooks();
    return;
  }
  if(BOOKS.error){
    p.innerHTML='<div class="card"><h2>📋 예약요청</h2>'
      +'<p class="desc" style="color:#B23B3B">'+esc(BOOKS.error)+'</p>'
      +'<button class="add" id="bkReload">다시 불러오기</button></div>';
    document.getElementById('bkReload').onclick=()=>{ BOOKS=null; drawBooks(); };
    return;
  }
  const all=BOOKS.list||[];
  /* 처리할 것 = 접수·진행중 + 여행사가 보낸 «추가 요청 메시지»를 아직 확인 안 한 건(컨펌 뒤에 온 메시지도 놓치지 않게, 사장님 2026-09-21) */
  const bookLive=b=>b.status==='new'||b.status==='doing'||(+b.msgUnread>0);
  const list=bookFilter==='all'?all:all.filter(bookLive);
  const nNew=all.filter(b=>b.status==='new').length;
  p.innerHTML='<div class="card">'
    +'<h2>📋 예약요청 <span class="bkcnt">'+nNew+'건 새로 들어옴</span></h2>'
    +'<p class="desc">손님이 사이트 장바구니에서 보낸 예약 요청입니다. '
    +'<b>금액은 손님 화면에 그때 보이던 값</b>이라 확정가가 아닙니다 — 요금표로 다시 확인해 안내하세요.</p>'
    +'<div class="subtabs">'
      +'<button class="'+(bookFilter==='live'?'on':'')+'" data-f="live">처리할 것 ('+all.filter(bookLive).length+')</button>'
      +'<button class="'+(bookFilter==='all'?'on':'')+'" data-f="all">전체 ('+all.length+')</button>'
      +'<button data-f="reload">↻ 새로고침</button>'
    +'</div>'
    +(list.length?'<div class="bklist">'+list.map(bookCardHtml).join('')+'</div>'
      :'<p class="desc" style="padding:18px 0">해당하는 예약 요청이 없습니다.</p>')
    +'</div>';
  p.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{
    if(b.dataset.f==='reload'){ BOOKS=null; drawBooks(); return; }
    bookFilter=b.dataset.f; drawBooks();
  });
  bindBookCards(p,list);
}
function bookCardHtml(b){
  const st=bookStatusOf(b.status), c=b.customer||{};
  const who=[c.tel&&('☎ '+c.tel), c.kakao&&('💬 '+c.kakao), c.email&&('✉ '+c.email)]
    .filter(Boolean).join('  ');
  return '<div class="bkcard">'
    +'<div class="bkhd">'
      +'<span class="bkno">'+esc(b.no)+'</span>'
      +'<span class="bkst" style="background:'+st.c+'">'+st.t+'</span>'
      +'<span class="bkat">'+esc(bookWhen(b.at))+'</span>'
      +'<span class="bktot">'+Number(b.total||0).toLocaleString('ko-KR')+'원</span>'
    +'</div>'
    +'<div class="bkwho"><b>'+esc(c.name||'')+'</b> <span>'+esc(who)+'</span></div>'
    /* 여행사 수배 건(실시간 견적) — 줄줄이 펼치지 않고 「📄 수배요청서」 한 장으로 본다(사장님 2026-09-21 "수배서 파일을 꽂아주세요").
       원가 줄은 직원 확인용이라 접어 둔다. b.quote 가 없는 옛 건은 전처럼 메모·줄을 그대로 보여 준다 */
    +((b.agency&&b.quote)
      ? '<div class="bkdocrow"><button class="add" data-bkdoc="'+esc(b.no)+'">📄 수배요청서 보기</button>'
          +'<span class="bkvhint">견적 '+esc(b.quote.quoteNo||'')+' · '+esc(b.quote.start||'')+' ~ '+esc(b.quote.end||'')+' · '+(b.quote.pax||0)+'명 · '+esc(b.quote.route||'')
          +((b.quote.requests||[]).length?' · <b style="color:#B23B3B">요청사항 '+(b.quote.requests||[]).length+'건</b>':'')+'</span></div>'
        +bookMsgsHtml(b)
        +'<details class="bkcost"><summary>원가 내역 (직원 확인용)</summary><ul class="bkitems">'+(b.items||[]).map(bookItemHtml).join('')+'</ul></details>'
      : (c.memo?'<div class="bkmemo">“'+esc(c.memo)+'”</div>':'')
        +'<ul class="bkitems">'+(b.items||[]).map(bookItemHtml).join('')+'</ul>')
    +voucherRowHtml(b)

async function copyText(t){

    const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }

  p.querySelectorAll('[data-vlink]').forEach(btn=>btn.onclick=async()=>{

      location.href='mailto:'+encodeURIComponent(to.trim())+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(kakaoTextOf(b));
      toast('서버 자동 발송이 아직 설정되지 않아 메일 앱을 열었습니다');
      return;
    }
    if(!j||!j.ok){ toast('❌ '+((j&&j.error)||'발송 실패')); return; }
    bookReplace(j.rec);
    toast('📧 '+j.to+' 로 보냈습니다');

  });

async function saveSite(){
  const b=document.getElementById('saveSite');
  if(b&&b.disabled) return;              // 두 번 눌러 두 번 저장되는 것을 막는다
  if(b){ b.disabled=true; b.textContent='저장 중…'; }
  try{
    let ok=true, msg=[];
    if(dirty['site']){
      if(await saveSafe(SITE_KEY,S)){ clearDirty('site'); msg.push('사이트 내용'); } else ok=false;
    }
    /* 요금은 키가 달라 따로 나간다 — 한쪽이 실패해도 다른 쪽은 남는다.
       ⚠ 요금표(golf_pricing) 한 덩이를 요금·코드 화면(/golf/admin/)과 같이 쓴다.
       이 화면이 가진 것은 «regions(골프장·호텔 요금줄)»과 «holidays(공휴일)» 둘뿐이고,
       차량·핸들링·가이드는 저쪽 것이다. 그래서 저장 직전에 서버 최신본을 다시 읽어
       **저쪽 칸은 서버 것을 그대로 살려** 둔다 — 예전에는 덩이째 덮어써서
       한 화면이 다른 화면의 작업을 통째로 지웠다(2026-09-08 사고). */
    if(ok&&dirty['rates']){
      const merged=await mergeRatesForSave(P);
      if(!merged){ toast('⚠ 서버 연결 실패 — 요금을 저장하지 않았습니다'); ok=false; }
      else if(await saveSafe(PRICE_KEY,merged)){ P=merged; clearDirty('rates'); msg.push('요금'); }
      else ok=false;
    }
    if(ok){ hotRate=null; hotItem=null; }   // 저장이 끝나면 요금 줄·옮긴 줄의 노란 표시를 지운다
    drawTabs();

    if(ok) toast(msg.length?('✅ '+msg.join('·')+' 저장했습니다'):'저장할 변경이 없습니다');
    else toast('⚠ '+(msg.length?msg.join('·')+'만 저장되고 나머지는 ':'')+'저장되지 않았습니다 — 화면 위 표시를 확인해 주세요');
  } finally { const c=document.getElementById('saveSite');
    if(c){ c.disabled=false; c.textContent='저장'; } showDirtyNote(); }
}

function TH(){ return S.theme || (S.theme={}); }

/* 사진은 한 칸에 줄마다 하나씩 적는다 — 첫 줄이 카드에 나오는 대표 사진,
   나머지는 상세(2차) 화면의 사진들이 된다. */
/* 작은 사진 한 줄 — 끌어서 순서를 바꾼다(사장님 2026-09-18: 순서를 바꾸려면 전부 지우고 다시 올려야 했다).
   칸(span)을 끄는 것이라 안의 img는 draggable을 끈다 — 켜 두면 그림 파일이 끌려 「새 사진 올리기」로 읽힌다 */
function picThumbsHTML(list){
  return list.map((u,i)=>'<span class="picth'+(i===0?' rep':'')+'" draggable="true" data-pi="'+i+'" '
      +'title="끌어서 순서를 바꿉니다 — 맨 앞이 대표 사진">'
    +'<img src="'+esc(u)+'" alt="" loading="lazy" draggable="false" onerror="this.classList.add(\'bad\')">'
    +'<b data-picdel="'+i+'" title="이 사진 빼기">✕</b>'
    +(i===0?'<i>대표</i>':'')+'</span>').join('');
}
function picsTa(path,x){
  const list=[x.img||''].concat(x.imgs||[]).filter(Boolean);
  const nm=esc(x.n||'사진');
  /* 사진칸 = 미리보기 + 올리기 버튼 + 주소 목록.
     주소 목록(textarea)이 정본이고, 올리기와 ✕는 그 목록을 고칠 뿐이다 —
     둘이 따로 놀면 어느 쪽이 저장되는지 알 수 없게 된다. */
  return '<div class="picbox" data-picbox="'+esc(path)+'" data-nm="'+nm+'">'
    +'<div class="picthumbs">'+picThumbsHTML(list)+'</div>'
    +'<div class="picbtns">'
      +'<button type="button" class="picup">📷 사진 올리기</button>'
      +'<span class="picmsg"></span>'
    +'</div>'
    +(list.length>1?'<div class="pichint">사진을 끌어서 순서를 바꿉니다 · 맨 앞이 대표</div>':'')
    +'<textarea data-p="'+esc(path)+'" data-pics="1" rows="2" '
      +'placeholder="사진을 올리면 주소가 여기 들어옵니다&#10;(한 줄에 한 장 · 첫 줄이 대표 사진)">'+esc(list.join('\n'))+'</textarea>'
    +'</div>';
}
/* ══════════ 사진 올리기 ══════════
   파일을 고르면 브라우저에서 먼저 크기를 줄이고(긴 변 1600px, JPEG) R2에 올린다.
   원본 사진은 한 장에 5MB가 넘는 일이 흔해서, 그대로 두면 손님 화면이 느려진다. */
const PIC_MAX_EDGE=1600, PIC_QUALITY=0.82;
function shrinkImage(file){
  return new Promise(resolve=>{
    /* GIF는 움직이는 그림이라 줄이면 한 장으로 굳는다 — 원본 그대로 올린다 */
    if(file.type==='image/gif'){ resolve(file); return; }
    /* JPEG·PNG·WebP가 아닌 것(AVIF·HEIC, 형식을 모르는 빈 값)은 작아도 JPEG로 다시 만든다 — 저장소(R2)가 그 형식을 안 받고,
       그대로 올리면 .jpg 이름에 AVIF 내용이 들어가 못 여는 기기가 생긴다(사장님 2026-09-22: AVIF가 안 올라갔음).
       브라우저가 그림을 못 열면 null — 올리지 않고 실패로 센다 */
    const reencode=!/^image\/(jpeg|png|webp)$/.test(file.type||'');
    const img=new Image(), fr=new FileReader();
    fr.onload=()=>{ img.src=fr.result; };
    fr.onerror=()=>resolve(reencode?null:file);
    img.onerror=()=>resolve(reencode?null:file);
    img.onload=()=>{
      const s=Math.min(1,PIC_MAX_EDGE/Math.max(img.width,img.height));
      if(s>=1&&file.size<1200000&&!reencode){ resolve(file); return; }   // 이미 작으면 그대로
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>resolve(b||file),'image/jpeg',PIC_QUALITY);
    };
    fr.readAsDataURL(file);
  });
}
async function uploadPics(box,files){
  const ta=box.querySelector('textarea[data-pics]');
  const msg=box.querySelector('.picmsg');
  const base=box.dataset.nm||'사진';
  const {data:{session}}=await sb.auth.getSession();
  const token=session&&session.access_token;
  if(!token){ msg.textContent='로그인이 풀렸습니다. 새로고침 후 다시 해 주세요.'; return; }
  /* 이어붙일 번호는 지금 목록에 있는 장수부터 — 한 장씩 올려도 -1이 반복되지 않게 */
  let n=ta.value.split('\n').map(s=>s.trim()).filter(Boolean).length;
  let done=0, fail=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    /* 형식(type)이 비어 오는 파일(윈도우가 AVIF 등을 모를 때)은 이름의 확장자로 사진인지 본다 */
    if(!/^image\//.test(f.type)&&!/\.(avif|heic|heif|webp|jpe?g|png|gif)$/i.test(f.name||'')){ fail++; continue; }
    msg.textContent=`올리는 중… ${i+1}/${files.length}`;
    try{
      const blob=await shrinkImage(f);
      if(!blob) throw new Error('이 브라우저가 열 수 없는 사진 형식');
      const ext=(blob.type==='image/png')?'png':(blob.type==='image/gif')?'gif':(blob.type==='image/webp')?'webp':'jpg';
      const name=`${base}-${++n}.${ext}`;
      const r=await fetch('/api/golf-img/put?name='+encodeURIComponent(name),{
        method:'PUT',
        headers:{Authorization:'Bearer '+token,'x-file-type':blob.type||'image/jpeg'},
        body:blob
      });
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||'실패');
      /* 목록에 이어 붙이고 input을 알려 S에 반영시킨다(저장 버튼을 눌러야 최종 반영) */
      const cur=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
      cur.push(j.url);
      ta.value=cur.join('\n');
      ta.dispatchEvent(new Event('input',{bubbles:true}));
      done++;
    }catch(e){ fail++; }
  }
  msg.textContent = fail ? `${done}장 올림 · ${fail}장 실패` : `${done}장 올렸습니다 — 저장을 눌러 주세요`;
  redrawPicThumbs(box);
}
/* 주소 목록이 바뀌면 미리보기만 다시 그린다(표 전체를 다시 그리면 입력 중이던 칸이 튄다) */
function redrawPicThumbs(box){
  const ta=box.querySelector('textarea[data-pics]');
  const list=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  box.querySelector('.picthumbs').innerHTML=picThumbsHTML(list);
}
/* 올리기 버튼 · ✕ · 끌어다 놓기 — 표를 다시 그려도 살아 있도록 위임으로 받는다 */
document.getElementById('pane').addEventListener('click',e=>{
  const box=e.target.closest('.picbox'); if(!box) return;
  if(e.target.classList.contains('picup')){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.multiple=true;
    inp.onchange=()=>{ if(inp.files&&inp.files.length) uploadPics(box,[...inp.files]); };
    inp.click();
    return;
  }
  const di=e.target.dataset&&e.target.dataset.picdel;
  if(di!==undefined){
    /* 목록에서만 뺀다 — R2의 파일은 지우지 않는다(다른 골프장이 같은 사진을 쓸 수 있다) */
    const ta=box.querySelector('textarea[data-pics]');
    const list=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    list.splice(Number(di),1);
    ta.value=list.join('\n');
    ta.dispatchEvent(new Event('input',{bubbles:true}));
    redrawPicThumbs(box);
  }
});
/* ── 사진 순서 바꾸기(끌어다 놓기) ── 아래 「파일을 끌어다 올리기」와 같은 drop을 쓰므로, 지금 끌고 있는 것이
   우리 작은 사진인지(picDrag) 먼저 가린다. 놓는 자리는 사진의 왼쪽 반/오른쪽 반으로 앞·뒤를 정한다 */
let picDrag=null;      // { box, i } — 끌기 시작한 사진칸과 그 사진의 차례
function clearPicMarks(){ document.querySelectorAll('.picth.dragging,.picth.dropl,.picth.dropr').forEach(x=>x.classList.remove('dragging','dropl','dropr')); }
document.getElementById('pane').addEventListener('dragstart',e=>{
  const th=e.target.closest&&e.target.closest('.picth'); if(!th) return;
  picDrag={box:th.closest('.picbox'),i:Number(th.dataset.pi)};
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain','pic'); }catch(_){}
  th.classList.add('dragging');
});
document.getElementById('pane').addEventListener('dragend',()=>{ picDrag=null; clearPicMarks(); });
document.getElementById('pane').addEventListener('dragover',e=>{
  const box=e.target.closest('.picbox'); if(!box) return;
  if(picDrag){
    if(box!==picDrag.box) return;              // 다른 골프장 칸으로는 못 옮긴다
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    document.querySelectorAll('.picth.dropl,.picth.dropr').forEach(x=>x.classList.remove('dropl','dropr'));
    const th=e.target.closest('.picth');
    if(th&&Number(th.dataset.pi)!==picDrag.i){
      const r=th.getBoundingClientRect();
      th.classList.add(e.clientX>r.left+r.width/2?'dropr':'dropl');
    }
    return;
  }
  e.preventDefault(); box.classList.add('drop');
});
document.getElementById('pane').addEventListener('dragleave',e=>{
  const box=e.target.closest('.picbox'); if(box) box.classList.remove('drop');
});
document.getElementById('pane').addEventListener('drop',e=>{
  const box=e.target.closest('.picbox'); if(!box) return;
  e.preventDefault(); box.classList.remove('drop');
  if(picDrag){                                   // 순서 바꾸기 — 파일 올리기가 아니다
    const from=picDrag.i, same=(box===picDrag.box);
    const th=e.target.closest('.picth');
    picDrag=null; clearPicMarks();
    if(!same) return;
    const ta=box.querySelector('textarea[data-pics]');
    const list=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    let to=list.length;                          // 사진 사이가 아닌 빈 곳에 놓으면 맨 뒤로
    if(th){ const r=th.getBoundingClientRect(); to=Number(th.dataset.pi)+(e.clientX>r.left+r.width/2?1:0); }
    if(from<to) to--;                            // 뺀 자리만큼 뒤 번호가 당겨진다
    if(to===from||from<0||from>=list.length) return;
    const moved=list.splice(from,1)[0];
    list.splice(to,0,moved);
    ta.value=list.join('\n');
    ta.dispatchEvent(new Event('input',{bubbles:true}));   // S 반영 + 작은 사진 다시 그리기(위 input 위임)
    const msg=box.querySelector('.picmsg'); if(msg) msg.textContent='순서를 바꿨습니다 — 저장을 눌러 주세요';
    return;
  }
  const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])].filter(f=>/^image\//.test(f.type));
  if(fs.length) uploadPics(box,fs);
});
/* 주소를 직접 고쳤을 때도 미리보기가 따라오게 */
document.getElementById('pane').addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.pics){
    const box=e.target.closest('.picbox'); if(box) redrawPicThumbs(box);

/* 골프장·호텔·스파·차량… 모두 같은 표로 편집한다. 종류가 늘어나도 이 함수 하나면 된다. */
/* 골프장·호텔·스파·차량… 모두 같은 표로 편집한다. 종류가 늘어나도 이 함수 하나면 된다.
   표 「본문」과 「틀」을 나눠 둔 이유: 찾기칸에 글자를 칠 때 틀까지 다시 그리면
   입력칸이 새로 만들어져 한글 조합(ㅈ→자→잔)이 매번 끊긴다. 본문만 갈아 끼운다. */
function itemBadge(k){
  /* 배지 칸은 원래 쓰던 이름을 그대로 쓴다 — 골프장 h(홀), 호텔 g(등급), 나머지는 b */
  return { bk: k==='hotels'?'g' : k==='courses'?'h' : 'b',
           bl: k==='hotels'?'등급' : k==='courses'?'홀' : '배지',
           bp: k==='hotels'?'5성' : k==='courses'?'27홀' : '' };
}
function itemRows(k){
  const arr=itemsArr(k), q=iSearch[k]||'', rg=iRegion[k]||'';
  const rows=arr.map((x,i)=>({x,i})).filter(o=>!q
    ||((o.x.n||'')+(o.x.r||'')+(o.x.e||'')+(o.x.d||'')).toLowerCase().includes(q.toLowerCase()))
    /* 지역 칩으로 고른 지역만(사장님 2026-09-17). '__none'은 지역 칸이 빈 줄 */
    .filter(o=>!rg||(rg==='__none'?!(o.x.r||'').trim():(o.x.r||'').trim()===rg));
  /* 「지역」 머리글을 누르면 지역끼리 모아서 보여 준다 — 보기만 바뀌고 저장되는 순서는 그대로다.
     지역 안에서는 원래 넣은 순서를 지킨다(sort가 안정 정렬이라 그대로 남는다).
     regionOrder(파타야·방콕·후아힌…)에 적힌 차례를 따르고, 거기 없는 지역은 뒤에 붙인다. */
  if(sortOn(k)){
    const rOrd=r=>{ const L=S.regionOrder||[], i=L.indexOf(r||''); return i<0?999:i; };
    rows.sort((a,b)=>{ const d=rOrd(a.x.r)-rOrd(b.x.r); if(d) return d;
      return (a.x.r||'').localeCompare(b.x.r||'','ko'); });
  }
  return {arr,q,rows};
}
function itemCntHTML(k){
  const cat=catsAll().filter(c=>c.k===k)[0]||{k:k,t:k,u:'곳'}, u=cat.u||'곳';
  const {arr,q,rows}=itemRows(k);
  const hid=arr.filter(x=>x&&x.on===false).length;   // 손님 화면에서 감춰 둔 것
  /* 요금표에 안 들어와 있는 곳이 몇 곳인지 한눈에 — 자료 넣으면서 같이 챙기라고 */
  const noP=P
    ? arr.filter(x=>{
        /* 스파·티켓… 은 메뉴 줄이 하나라도 있으면 요금이 있는 것 */
        if(isMenuKind(k)){ const m=menuOf(k,x); return !(m&&m.length); }
        /* 호텔은 «객실 요금»이 하나라도 들어 있으면 있는 것으로 친다 */
        if(k==='hotels'&&priceRoomsRO(x).some(r=>Array.isArray(r.rates)&&r.rates.length)) return false;
        const rs=ratesOf(k,x);
        if(rs&&rs.length) return false;
        return !oldSeasonCount(priceHomeOf(k,x));   // 옛 요금표에 있는 곳은 「없음」이 아니다
      }).length : 0;
  return '전체 '+arr.length+u+(q?' · 찾은 것 '+rows.length+u:'')
    +(hid?' · <b style="color:var(--danger)">숨김 '+hid+u+'</b>':'')
    +(noP?' · <b style="color:var(--danger)">요금 없음 '+noP+u+'</b>':'');
}
/* 종류별 「포함사항·불포함사항」 기본 문구. 처음 보는 종류면 공통 문구로 한 벌 만들어 둔다.
   각 줄의 칸을 비워 두면 손님 화면에는 이 문구가 나간다. */
function incExcDef(k){
  S.incExc=S.incExc||{};
  if(!S.incExc[k]){
    const D=window.SITE_DEFAULT.incExc||{}, g=D[k]||D._||{};
    S.incExc[k]={inc:g.inc||'',exc:g.exc||''};
  }
  return S.incExc[k];
}
/* ── 골프장·호텔 줄 아래에 붙는 요금 ──
   기간(부터~까지) · 구분(주중/주말/태국휴일) · 시간(오전/오후) 마다 한 줄씩 더한다.
   금액은 **그린피+캐디+카트를 합친 한 숫자**(밧)다 — 사장님이 그렇게 쓰기로 정했다.
   자료는 golf_site가 아니라 **요금표(golf_pricing)** 쪽에 넣는다. golf_site는
   손님도 읽을 수 있게 열려 있어서, 거기 두면 원가가 그대로 새어 나간다. */
/* 태국휴일은 주말과 요금이 같다(사장님 확인) — 그래서 칸을 하나로 묶었다.
   견적에서 날짜를 볼 때 토·일과 태국휴일을 똑같이 「주말·휴일」로 친다. */
const RATE_PARTS=['주중','주말·휴일'];
/* 트와일라잇·나이트(사장님 2026-09-18)는 넣어 두기만 한다 — 손님 최저가·견적 계산은 종일·오전·오후만 본다(나이트 값이 최저가로 잡히면 안 되므로) */
const RATE_TIMES=['종일','오전','오후','트와일라잇','나이트'];
/* 예전에 「주말」·「태국휴일」로 따로 적힌 것이 있으면 묶어서 보여 준다 */
function normPart(v){ return (v==='주말'||v==='태국휴일'||v==='주말·휴일')?'주말·휴일':'주중'; }
/* 이 항목의 요금 줄들을 꺼내 온다. 없으면 빈 배열을 만들어 둔다. */
/* 요금표에서 이 항목의 «자리» 자체를 꺼내 온다(없으면 null).
   이 안에는 새 요금줄(rates[]) 말고도 옛 시즌줄(seasons[]) 같은 것이 같이 들어 있다. */
function priceHomeOf(k,x){
  if(!P) return null;
  const key=String(x&&x.n||'').replace(/\s+/g,'').toLowerCase();
  if(!key) return null;
  const bag=PIDX[k]; if(!bag) return null;
  const hit=bag[key];
  return hit ? (hit.c||hit.h||hit.o) : null;
}
/* 골프장·호텔이 아닌 종류인가 — 이런 종류는 기간 요금줄 대신 «메뉴별 요금»을 쓴다 */
function isMenuKind(k){ return k!=='courses'&&k!=='hotels'; }
function menuOf(k,x){
  const o=priceHomeOf(k,x);
  if(!o) return null;
  if(!Array.isArray(o.menu)) o.menu=[];
  /* 메뉴 = 이름(n) + 코스·내용(d). 처음에 「아로마스파맛사지 2시간 (스크럽+아로마오일)」처럼
     괄호 안에 내용을 같이 적어 둔 줄은 괄호 안을 d로 떼어 낸다(사장님 2026-09-09) —
     오른쪽 견적 패널 단추에 긴 글이 밀려 끊어져서. 서버(golf-price.js)도 같은 규칙으로 뗀다. */
  o.menu.forEach(m=>{ if(m&&!m.d){ const s=splitMenu(m.n); if(s){ m.n=s.n; m.d=s.d; } } });
  return o.menu;
}
function splitMenu(n){
  const mm=String(n||'').match(/^(.*?)\s*[(（]([^()（）]+)[)）]\s*$/);
  return mm&&mm[1].trim()?{n:mm[1].trim(),d:mm[2].trim()}:null;
}
/* 옛 요금(시즌줄)이 몇 줄 들어 있는지 — 이 화면에서는 고칠 수 없지만 있는지는 알아야 한다 */
function oldSeasonCount(o){ return (o&&Array.isArray(o.seasons)) ? o.seasons.length : 0; }
function ratesOf(k,x){
  const o=priceHomeOf(k,x);
  if(!o) return null;
  if(!Array.isArray(o.rates)) o.rates=[];
  return o.rates;
}
/* ── 자주 쓰는 기간 ──
   같은 기간을 62곳에 되풀이해 넣는다. 달력을 줄마다 두 번 여는 게 큰 일이라,
   한 번 쓴 기간을 목록에 담아 두고 드롭다운으로 고른다.
   목록은 요금표(golf_pricing)의 ratePeriods에 같이 저장된다. */
function ratePeriods(){
  if(!P) return [];
  if(!Array.isArray(P.ratePeriods)) P.ratePeriods=[];
  return P.ratePeriods;
}
const perKey=(f,t)=>(f||'')+'~'+(t||'');
/* 마지막으로 쓴 기간 — 요금줄이 하나도 없는 골프장에 첫 줄을 더할 때 물려준다 */
let lastPeriod={from:'',to:''};
/* 방금 더했거나 마지막으로 고친 요금 줄(자료 그 자체를 가리킨다 — 저장되는 값에는 아무것도 안 붙는다) */
let hotRate=null;
function rememberPeriod(f,t){ if(f||t) lastPeriod={from:f||'',to:t||''}; }
function periodSelHTML(r){
  /* 「기간 고르기」 칸은 화면에서 뺐다(사장님 2026-09-18) — 고를 게 없어 줄 높이만 차지했고, 줄 추가 때 앞 줄 기간을
     물려받고 복사 기능도 있어 필요 없다. 골프장 요금 줄·호텔 객실 요금 줄 둘 다 빠진다. 담아 둔 기간 목록(ratePeriods)은 그대로 둔다 */
  return '';
  const list=ratePeriods(), cur=perKey(r.from,r.to);
  return '<select data-rper="1" title="자주 쓰는 기간에서 고르기 — 달력을 안 눌러도 됩니다">'
    +'<option value="">기간 고르기…</option>'
    +list.map(p=>{ const kk=perKey(p.from,p.to);
      return '<option value="'+esc(kk)+'"'+(kk===cur?' selected':'')+'>'
        +esc(p.label||kk)+'</option>'; }).join('')
    +'<option value="__add">＋ 지금 이 줄의 기간을 목록에 담기</option>'
    +(list.length?'<option value="__del">－ 목록에서 지우기…</option>':'')
    +'</select>';
}
function rateRowHTML(k,idx,r){

/* 메뉴 한 줄 — 프로그램 이름 · 시간(단위) · 밧. 스파·티켓처럼 기간 요금이 아닌 종류가 쓴다 */
function menuRowHTML(idx,m){
  const n=v=>(v===''||v==null)?'':v;
  return '<div class="rrow mrow" data-ri="'+idx+'">'
    /* 시간은 프로그램 이름에 같이 적는다(「타이마사지 2시간」) — 시간 칸은 뺐다(사장님 2026-09-09).
       예전에 u 칸에 적어 둔 값은 저장 자료에 남아 있을 뿐 보이지 않는다. */

    +'<input data-rf="d" value="'+esc(n(m.d))+'" placeholder="스크럽+아로마오일+허브볼">'

       같은 메뉴 이름의 기본 요금을 그 기간 동안 덮어쓴다(프로모션·성수기 요금). */
    +'<div class="rdate'+((m.from||m.to)?' mprom':'')+'">'
      +'<input type="date" data-rf="from" value="'+esc(n(m.from))+'" title="적용 시작 (비우면 늘)">'
      +'<span class="rtil">~</span>'
      +'<input type="date" data-rf="to" value="'+esc(n(m.to))+'" title="적용 끝 (비우면 늘)">'
    +'</div>'
    +'<input type="number" data-rf="p" value="'+esc(n(m.p))+'" placeholder="밧" min="0">'
    /* 이 줄을 그대로 한 줄 더 — 차량처럼 구간만 다르고 나머지가 같은 줄을 잇달아 넣을 때(사장님 2026-09-19) */
    +'<button type="button" class="rcpy" title="이 줄을 바로 아래에 그대로 하나 더 (이름·내용·기간·요금)">복사</button>'
    +'<button type="button" class="rdel" title="이 줄 지우기">✕</button>'
    +'</div>';
}
function priceCell(k,x){
  if(isMenuKind(k)){
    /* 스파·티켓 같은 종류의 요금 = 메뉴별 요금(사장님 2026-09-09).
       저장 자리는 골프장과 같은 요금표(golf_pricing) — 손님에게는 서버가 마진(기본 100밧)을
       얹어 원화로 내려보낸다. 여기 적는 밧은 원가라 손님 화면엔 안 간다. */
    const menu=menuOf(k,x);
    let body;
    if(P===null) body='<div class="pbox"><span class="pmute">요금표를 못 읽었습니다</span></div>';
    else if(menu===null) body='<div class="pbox"><span class="pno">요금표에 「'+esc(x.n||'이름 없음')
      +'」이 없습니다 — 아래 ＋를 누르면 만들어집니다</span></div>';
    else body='<div class="rlist">'
      +'<div class="rhead mhead"><span>메뉴 (시간을 같이 적는다)</span><span>코스 · 내용</span>'
        +'<span>적용 기간 <span class="rhint">비우면 늘 · 넣으면 그 기간만(프로모션)</span>'
          +'<span class="rdate rdhd"><span>시작일</span><span></span><span>끝일</span></span></span><span>밧 (원가)</span></div>'
      +(menu.length?menu.map((m,i)=>menuRowHTML(i,m)).join(''):'<div class="rnone">아직 요금이 없습니다</div>')
      +'</div>';
    return '<div class="iecell pcell" data-pk="'+esc(k)+'" data-pn="'+esc(x.n||'')+'">'
      +'<b>메뉴별 요금 <span class="rhint">1인 기준 밧(종류 단위가 「대」면 1대 기준) — 손님에게는 마진(기본 100밧)을 얹어 원화로 보입니다</span></b>'
      +body
      +'<button type="button" class="radd">＋ 요금 줄 추가</button></div>';
  }
  const rates=ratesOf(k,x);
  /* 요금 줄은 기간 차례로 세운다(사장님 2026-09-17) — 시작일 → 끝일 → 주중/주말 → 종일/오전/오후.
     배열 자체를 정렬해 저장 순서도 같아진다(계산은 순서와 무관). 칸을 다시 그릴 때만 정렬하므로 입력 중에 줄이 튀지 않는다 */
  if(Array.isArray(rates)&&rates.length>1){
    const P_ORD={'주중':0,'주말·휴일':1,'주말':1,'태국휴일':1}, T_ORD={'종일':0,'오전':1,'오후':2,'트와일라잇':3,'나이트':4};
    const d=v=>String(v||'')||'9999-99-99';
    /* 요금(18홀·9홀)을 아직 안 넣은 줄은 맨 아래에 그대로 둔다(사장님 2026-09-18) — 「＋ 요금 줄 추가」 뒤 날짜만 찍었는데
       줄이 제자리를 찾아 올라가 버려 요금을 어디에 넣을지 헷갈렸다. 요금을 넣고 칸에서 손을 떼면 그때 제자리로 간다 */
    const noPrice=r=>(r.p18===''||r.p18==null)&&(r.p9===''||r.p9==null)?1:0;
    rates.sort((a,b)=>(noPrice(a)-noPrice(b))||d(a.from).localeCompare(d(b.from))||d(a.to).localeCompare(d(b.to))
      ||((P_ORD[normPart(a.part)]||0)-(P_ORD[normPart(b.part)]||0))||((T_ORD[a.time]||0)-(T_ORD[b.time]||0)));
  }
  let body;
  if(P===null) body='<div class="pbox"><span class="pmute">요금표를 못 읽었습니다</span></div>';
  else if(rates===null) body='<div class="pbox"><span class="pno">요금표에 「'+esc(x.n||'이름 없음')
    +'」이 없습니다 — 아래 ＋를 누르면 만들어집니다</span></div>';
  else {
    /* 옛 요금표(시즌줄)로 들어 있는 곳은 여기서 못 고치지만, 있다는 것은 알려 준다 —
       안 그러면 「요금 없음」으로 보여서 이미 넣어 둔 요금을 또 넣게 된다. */
    const nOld=oldSeasonCount(priceHomeOf(k,x));
    body='<div class="rlist">'
    +'<div class="rhead"><span>기간</span><span>구분</span><span>시간</span><span>18홀</span><span>9홀</span></div>'
    +(rates.length?rates.map((r,i)=>rateRowHTML(k,i,r)).join('')
      :'<div class="rnone">'+(nOld?('옛 요금표에 '+nOld+'줄이 들어 있습니다 — 「💰 요금표」 탭에서 보입니다')
                                  :'아직 요금이 없습니다')+'</div>')
    +'</div>';
  }
  return '<div class="iecell pcell" data-pk="'+esc(k)+'" data-pn="'+esc(x.n||'')+'">'
    +'<b>요금 <span class="rhint">그린피+캐디+카트 합산 · 밧</span></b>'
    +body
    +'<button type="button" class="radd">＋ 요금 줄 추가</button></div>';
}
/* 요금표에 이 항목 자리가 없으면 만들어 준다. 지역은 사이트 쪽에 적힌 지역을 그대로 쓴다. */
function ensureRateHome(k,x){
  if(!P){ P={regions:{}}; }
  if(!P.regions) P.regions={};
  const reg=(x.r||'기타');
  if(!P.regions[reg]) P.regions[reg]={courses:[],hotels:[]};
  /* 골프장·호텔은 예전 자리(courses·hotels), 그 밖의 종류는 종류 키 그대로(spa·ticket…) */
  const arrName=(k==='hotels')?'hotels':(k==='courses')?'courses':k;
  const arr=P.regions[reg][arrName]=P.regions[reg][arrName]||[];
  const key=String(x.n||'').replace(/\s+/g,'').toLowerCase();
  let o=arr.filter(e=>String(e.name||'').replace(/\s+/g,'').toLowerCase()===key)[0];
  if(!o){ o=isMenuKind(k)?{name:x.n||'',menu:[]}:{name:x.n||'',rates:[]}; arr.push(o); }
  if(isMenuKind(k)){ if(!Array.isArray(o.menu)) o.menu=[]; }
  else if(!Array.isArray(o.rates)) o.rates=[];
  buildPriceIndex();
  return o;
}
/* 요금 줄을 고치거나 더하거나 지운 뒤 — 그 항목의 요금 칸만 새로 그린다 */
function redrawRateCell(cell){
  const k=cell.dataset.pk, name=cell.dataset.pn;
  const box=document.createElement('div');
  box.innerHTML=priceCell(k,{n:name,r:''});
  cell.replaceWith(box.firstChild);
}
document.getElementById('pane').addEventListener('click',e=>{
  const add=e.target.closest('.radd'), del=e.target.closest('.rdel'), cpy=e.target.closest('.rcpy');
  if(!add&&!del&&!cpy) return;
  const cell=e.target.closest('.pcell'); if(!cell) return;
  const k=cell.dataset.pk, name=cell.dataset.pn;
  const item=(itemsArr(k)||[]).filter(z=>String(z.n||'')===name)[0];
  if(!item) return;
  const o=ensureRateHome(k,item);
  let focusRi=-1;                                      // 복사한 새 줄 — 다시 그린 뒤 그 줄 이름 칸에 커서를 둔다
  if(isMenuKind(k)){                                   // 스파·티켓… 메뉴별 요금
    if(cpy){
      /* 이 줄을 바로 아래에 그대로 하나 더(이름·내용·기간·요금 전부) — 구간 이름과 요금만 고치면 된다 */
      const row=e.target.closest('.rrow'); if(!row) return;
      const i=Number(row.dataset.ri), src=o.menu[i]; if(!src) return;
      o.menu.splice(i+1,0,JSON.parse(JSON.stringify(src)));
      focusRi=i+1;
    }
    else if(add) o.menu.push({n:'',u:'',p:''});
    else{ const row=e.target.closest('.rrow'); if(!row) return; o.menu.splice(Number(row.dataset.ri),1); }
  }else if(add){
    /* 기간은 물려받는다 — 같은 기간에 오전·오후를 잇달아 넣는 일이 많다.
       이 골프장에 줄이 하나도 없으면 방금 다른 골프장에서 쓴 기간을 가져온다. */
    const last=o.rates[o.rates.length-1]||lastPeriod;
    hotRate={from:last.from||'',to:last.to||'',part:normPart(last.part),time:'종일',p18:'',p9:''};
    o.rates.push(hotRate);
  }else if(del){
    const row=e.target.closest('.rrow'); if(!row) return;
    o.rates.splice(Number(row.dataset.ri),1);
  }else return;
  markDirty('rates'); redrawRateCell(cell);
  if(focusRi>=0){
    const fresh=[...document.querySelectorAll('#pane .pcell')].filter(c=>c.dataset.pk===k&&c.dataset.pn===name)[0];
    const el=fresh&&fresh.querySelector('.rrow[data-ri="'+focusRi+'"] input[data-rf="n"]');
    if(el){ el.focus(); el.select(); }
  }
  const cnt=document.getElementById('iCnt');       // 「요금 없음 N곳」도 같이 고친다
  if(cnt) cnt.innerHTML=itemCntHTML(cnt.dataset.k);
});
document.getElementById('pane').addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.rf; if(!f) return;
  const cell=e.target.closest('.pcell'), row=e.target.closest('.rrow');
  if(!cell||!row) return;
  const k=cell.dataset.pk, name=cell.dataset.pn;
  const item=(itemsArr(k)||[]).filter(z=>String(z.n||'')===name)[0]; if(!item) return;
  const o=ensureRateHome(k,item);
  const r=(isMenuKind(k)?o.menu:o.rates)[Number(row.dataset.ri)]; if(!r) return;
  r[f]=(f==='p18'||f==='p9'||f==='p') ? (e.target.value===''?'':Number(e.target.value)) : e.target.value;
  if(f==='from'||f==='to'){
    if(isMenuKind(k)){ const dbox=e.target.closest('.rdate'); if(dbox) dbox.classList.toggle('mprom',!!(r.from||r.to)); }
    else rememberPeriod(r.from,r.to);
  }
  /* 정렬 기준(기간·구분·시간)이 바뀌었다 — 입력 중에 줄이 튀지 않게, 이 요금 칸에서 손을 뗄 때(아래 focusout) 다시 세운다(사장님 2026-09-18) */
  /* 요금(18홀·9홀)도 포함 — 요금이 빈 줄은 맨 아래에 있다가 요금이 들어오면 제자리로 가야 한다 */
  if(!isMenuKind(k)){
    cell.dataset.resort='1';
    /* 지금 고치는 줄로 노란 표시를 옮긴다 — 손 떼고 줄이 움직여도 어느 줄이었는지 보인다 */
    if(hotRate!==r){ hotRate=r; cell.querySelectorAll('.rrow.hot').forEach(x=>x.classList.remove('hot')); row.classList.add('hot'); }
  }
  markDirty('rates');
});
/* 요금 칸 밖으로 초점이 나가면(다른 칸을 누르거나 빈 곳을 누르면) 기간·주중/주말·시간 차례로 줄을 다시 세운다.
   칸 안에서 옮겨 다니는 동안은 안 세운다 — 세우면 칸이 새로 그려져 누른 칸의 초점이 날아간다 */
document.getElementById('pane').addEventListener('focusout',e=>{
  const cell=e.target&&e.target.closest&&e.target.closest('.pcell');
  if(!cell||!cell.dataset.resort) return;
  const to=e.relatedTarget;
  if(to&&cell.contains(to)) return;
  /* 달력 팝업이 뜨거나 다른 창으로 넘어가 «창 자체»가 초점을 잃은 것이면 세우지 않는다 — 달력이 닫히거나 입력이 끊긴다.
     표시는 남겨 두므로 다음에 진짜로 칸 밖을 누를 때 세워진다 */
  if(!document.hasFocus()) return;
  delete cell.dataset.resort;
  redrawRateCell(cell);
});
/* 「기간 고르기」 드롭다운 — 고르면 그 줄의 시작·끝 날짜가 한 번에 채워진다 */
document.getElementById('pane').addEventListener('change',e=>{
  const sel=e.target; if(!sel.dataset||!sel.dataset.rper) return;
  const cell=sel.closest('.pcell'), row=sel.closest('.rrow');
  if(!cell||!row) return;
  const k=cell.dataset.pk, name=cell.dataset.pn;
  const item=(itemsArr(k)||[]).filter(z=>String(z.n||'')===name)[0]; if(!item) return;
  const o=ensureRateHome(k,item), r=o.rates[Number(row.dataset.ri)]; if(!r) return;
  const v=sel.value;
  if(v==='__add'){
    if(!r.from&&!r.to){ alert('먼저 이 줄의 기간을 넣어 주세요.\n그 기간이 목록에 담깁니다.'); redrawRateCell(cell); return; }
    const list=ratePeriods(), kk=perKey(r.from,r.to);
    if(list.some(p=>perKey(p.from,p.to)===kk)) alert('이미 목록에 있는 기간입니다.');
    else{
      const lbl=prompt('이 기간을 뭐라고 부를까요?\n(비워 두면 날짜가 그대로 이름이 됩니다)\n\n'+kk,'');
      if(lbl===null){ redrawRateCell(cell); return; }
      list.push({from:r.from||'',to:r.to||'',label:String(lbl).trim()});
      rememberPeriod(r.from,r.to);
      markDirty('rates');
      toast('✅ 기간을 목록에 담았습니다 — 이제 다른 골프장에서 골라 쓰시면 됩니다');
    }
  }else if(v==='__del'){
    const list=ratePeriods();
    const pick=prompt('지울 기간의 번호를 적어 주세요.\n\n'
      +list.map((p,i)=>(i+1)+'. '+(p.label?p.label+' ('+perKey(p.from,p.to)+')':perKey(p.from,p.to))).join('\n'),'');
    const i=Number(pick)-1;
    if(list[i]){ list.splice(i,1); markDirty('rates'); toast('🗑 기간을 목록에서 지웠습니다'); }
  }else if(v){
    const [f,t]=v.split('~');
    r.from=f||''; r.to=t||'';
    rememberPeriod(r.from,r.to);
    markDirty('rates');
  }
  redrawRateCell(cell);
});
/* ── 줄 복사 ──
   시암처럼 「요금·사진·문구는 다 같고 코스 이름만 다른」 곳이 많다. 한 곳을 다 채운 뒤
   복사를 누르면 그 줄을 통째로(요금 줄까지) 베껴 바로 아래에 새 줄로 넣는다.
   이름만 새로 받는다 — 사이트와 요금표를 잇는 기준이 **이름**이라 겹치면 안 된다. */
function nameKey(s){ return String(s||'').replace(/\s+/g,'').toLowerCase(); }
function copyItem(k,i){
  const arr=itemsArr(k), src=arr[i]; if(!src) return;
  /* 요금은 **자리 통째로** 베낀다. 새 요금줄(rates[])만 보면, 옛 시즌줄(seasons[])로
     들어 있는 골프장을 복사할 때 요금이 하나도 안 따라온다 — 처음에 그렇게 만들어 놓쳤다. */
  const home=priceHomeOf(k,src);
  const nRate=(home&&Array.isArray(home.rates))?home.rates.length:0;
  const nMenu=(home&&Array.isArray(home.menu))?home.menu.length:0;   // 스파·티켓… 메뉴 줄
  const nSeason=oldSeasonCount(home);

    +'지역·영문이름·소개문구·사진·포함사항'+priceNote+'이 그대로 따라옵니다.\n'
    +'(저장을 눌러야 실제로 반영됩니다)\n\n새 이름을 적어 주세요:', (src.n||'')+' 2');

  const got=nRate?('요금 '+nRate+'줄 포함'):nSeason?('옛 요금표 '+nSeason+'줄 포함')
    :(home?'※ 원본에 요금이 없어 요금은 안 따라왔습니다':'※ 원본이 요금표에 없어 요금은 안 따라왔습니다');
  toast('📋 「'+name+'」(으)로 베껴 넣었습니다 · '+got+' — 저장을 눌러 주세요');

/* ══════════ 호텔 객실 (2026-09-03~) ══════════
   호텔은 포함·불포함사항을 쓰지 않는다(사장님 지시) — 객실마다 조식 여부가 달라
   한 문장으로 묶이지 않는다. 그 자리에 «객실 타입별 요금»이 들어간다.

   한 객실이 두 군데에 나뉘어 저장된다:
     · 내용(타입·면적·뷰·침대·조식·사진) → golf_site 의 hotels[].rooms[]  … 손님도 읽는다(공개해도 되는 자료)
     · 요금(기간·주중·주말)             → 요금표(golf_pricing) 의 hotels[].rooms[].rates[]
   둘을 잇는 기준은 **객실 타입 이름**이다(사이트↔요금표를 이름으로 잇는 것과 같다).

function siteRoomsOf(x){ if(!Array.isArray(x.rooms)) x.rooms=[]; return x.rooms; }

function priceRoomsRO(x){
  const h=priceHomeOf('hotels',x);
  return (h&&Array.isArray(h.rooms))?h.rooms:[];

function findRoom(list,t){ return list.filter(z=>nameKey(z.t)===nameKey(t))[0]||null; }
/* 써차지 줄인가 — 서버(golf-price.js)의 isSur과 같은 판정이어야 한다 */
function isSurRate(r){ return !!r && (r.sur===true||r.sur===1||r.sur==='1'); }
/* 추가 인원 요금 — 처음에 extraPax(3인)·extraBed(엑스트라베드)로 넣어 둔 값도 읽는다.
   서버(golf-price.js)의 EXTRA_OLD와 같아야 한다. */
const EXTRA_OLD={extraAdult:'extraPax',extraChild:'extraBed'};
function exVal(pr,k){
  if(!pr) return '';
  if(pr[k]!=null&&pr[k]!=='') return pr[k];
  const o=pr[EXTRA_OLD[k]];
  return (o!=null&&o!=='')?o:'';
}
/* 고칠 때 쓴다 — 요금표에 자리가 없으면 만든다 */
function priceRoomOf(x,t){
  const o=ensureRateHome('hotels',x);
  if(!Array.isArray(o.rooms)) o.rooms=[];
  let r=findRoom(o.rooms,t);
  if(!r){ r={t:String(t||''),rates:[]}; o.rooms.push(r); }
  if(!Array.isArray(r.rates)) r.rates=[];
  return r;
}
function hotelByName(n){ return (itemsArr('hotels')||[]).filter(z=>String(z.n||'')===n)[0]||null; }
/* 한 줄 = 한 기간. 「구분」이 «＋추가(써차지)»면 그 기간에 걸린 날은
   기본요금 위에 이 금액이 **더해진다**(크리스마스·연말 같은 특별일). */
/* ── 한 기간에 적는 다섯 가지 값 × 주중·주말 (사장님 2026-09-19) ──
     싱글(1인 사용) · 더블·트윈(2인 사용) · 엑스트라 베드(성인) · 엑스트라 베드(아동) · 아동 조식(엑스트라 베드를 안 쓰는 아동)
   저장 자리: 더블·트윈은 예전 그대로 wd·we(적어 둔 값이 그대로 산다), 나머지는 앞말+Wd/We
     sgWd·sgWe / eaWd·eaWe / ecWd·ecWe / cbWd·cbWe
   서버(golf-price.js)의 ROOM_KINDS와 같아야 한다. */
const ROOM_COLS=[['sg','싱글','1인 사용 1실 1박'],['','더블·트윈','2인 사용 1실 1박'],
  ['ea','엑스트라(성인)','3인째가 성인일 때 · 1박'],['ec','엑스트라(아동)','3인째가 아동일 때 · 1박'],
  ['cb','아동 조식','엑스트라 베드를 안 쓰는 아동 · 1인 1박']];
const rmField=(p,we)=>p?(p+(we?'We':'Wd')):(we?'we':'wd');
const RM_NUM={}; ROOM_COLS.forEach(c=>{ RM_NUM[rmField(c[0],false)]=1; RM_NUM[rmField(c[0],true)]=1; });
/* 예전에는 엑스트라 베드·조식 쿠폰 값을 객실에 한 개씩(기간 없이) 적었다(extraChild·extraAdult).
   그 값은 기간 줄이 비어 있는 동안 그 자리에 그대로 보이고(서버도 그렇게 읽는다),
   이 객실의 요금을 하나라도 고치면 기간 줄로 옮겨 적는다(materializeExtras). */
const RM_OLD={ea:'extraChild',ec:'extraChild',cb:'extraAdult'};
function rmOldVal(pr,p){ return RM_OLD[p]?exVal(pr,RM_OLD[p]):''; }
function rmBlank(r,p){ const a=r[rmField(p,false)], b=r[rmField(p,true)]; return (a===''||a==null)&&(b===''||b==null); }
function materializeExtras(pr){
  if(!pr) return;
  const had=['extraChild','extraAdult','extraPax','extraBed'].some(k=>pr[k]!=null&&pr[k]!=='');
  if(!had) return;
  (pr.rates||[]).forEach(r=>{
    if(isSurRate(r)) return;
    Object.keys(RM_OLD).forEach(p=>{
      const o=rmOldVal(pr,p);
      if(o!==''&&rmBlank(r,p)){ r[rmField(p,false)]=Number(o); r[rmField(p,true)]=Number(o); }
    });
  });
  ['extraChild','extraAdult','extraPax','extraBed'].forEach(k=>{ delete pr[k]; });
}

/* 기본은 빈칸(주중·주말 같은 값 — 호텔 80% 이상, 사장님 2026-09-23). 요일을 누른 호텔만 주말·휴일 줄이 나온다.
   weDays를 아직 안 정한 옛 호텔은 주말 값이 주중과 다르게 적힌 줄이 있으면 토·일로 본다(서버 기본값과 같아 금액이 안 바뀐다). */
function weDaysOf(x){
  const h=priceHomeOf('hotels',x);
  if(h&&Array.isArray(h.weDays)) return h.weDays.map(Number);
  const has=v=>v!==''&&v!=null;
  const diff=(h&&Array.isArray(h.rooms)?h.rooms:[]).some(rm=>(rm.rates||[]).some(r=>!isSurRate(r)&&
    ROOM_COLS.some(c=>{ const a=r[rmField(c[0],false)], b=r[rmField(c[0],true)]; return has(a)&&has(b)&&Number(a)!==Number(b); })));
  return diff?[6,0]:[];
}
/* 요금을 고치기 전에 지금 보이는 요일을 적어 둔다 — 주말 줄이 감춰진 채 주중 값만 고치면
   옛 주말 값(서버는 weDays 없으면 토·일)이 남아 다른 값이 나가게 된다 */
function pinWeDays(x){ const h=ensureRateHome('hotels',x); if(!Array.isArray(h.weDays)) h.weDays=weDaysOf(x); }

   글자마다가 아니라 칸을 벗어날 때 한 번만 한다(한글 조합이 끊기지 않게). */
document.getElementById('pane').addEventListener('change',e=>{

  const was=el.dataset.mt0||'', now=String(el.value||'').trim();

    if(pr){ pr.t=now; markDirty('rates'); }
  }
  /* 이름을 처음 적은 객실에는 빈 요금줄 한 개를 미리 깔아 준다 —
     이름만 적고 나서 「요금 넣는 칸이 어디냐」가 되지 않게(사장님, 2026-09-03). */
  const row=el.closest('.rmrow'); if(!row) return;
  const pr=priceRoomOf(x,now);
  if(!pr.rates.length){
    pr.rates.push({from:lastPeriod.from||'',to:lastPeriod.to||'',wd:'',we:''});
    markDirty('rates');
  }

});

document.getElementById('pane').addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.rmf; if(!f) return;
  const cell=e.target.closest('.rcell'), row=e.target.closest('.rmrow'), rr=e.target.closest('.rmrate');
  if(!cell||!row||!rr) return;
  const x=hotelByName(cell.dataset.rn); if(!x) return;
  const rm=siteRoomsOf(x)[Number(row.dataset.mi)]; if(!rm||!String(rm.t||'').trim()) return;
  const pr=priceRoomOf(x,rm.t), r=pr.rates[Number(rr.dataset.ri)]; if(!r) return;
  /* 객실에 한 개씩 적어 둔 옛 추가요금을 먼저 기간 줄로 옮긴다 — 화면에 보이던 값 그대로라 다시 그릴 것은 없다.
     고친 값을 넣기 «전에» 해야 한다(방금 비운 칸이 옛 값으로 되살아나지 않게). */
  pinWeDays(x);
  const wasBlank=Object.keys(RM_OLD).filter(p=>rmBlank(r,p));
  materializeExtras(pr);
  /* 이 줄을 써차지로 돌리는 참이면 방금 옮겨 적힌 값은 도로 비운다 — 써차지 줄에 들어가면 기본값 위에 또 더해진다 */
  if(f==='sur'&&e.target.value==='1') wasBlank.forEach(p=>{ r[rmField(p,false)]=''; r[rmField(p,true)]=''; });
  r[f]=RM_NUM[f] ? (e.target.value===''?'':Number(e.target.value))
     : (f==='sur')          ? (e.target.value==='1')
     : e.target.value;
  if(f==='sur'){ const m=/^n(\d+)$/.exec(e.target.value); if(m) r.minN=Number(m[1]); else delete r.minN; }
  if(f==='from'||f==='to') rememberPeriod(r.from,r.to);
  markDirty('rates');
  /* 기본요금 ⇄ 써차지를 바꾸면 줄 색과 안내 글자가 같이 바뀌어야 한다 */
  if(f==='sur') redrawRoomRates(row,x);
});

document.getElementById('pane').addEventListener('change',e=>{

    const list=ratePeriods(), kk=perKey(r.from,r.to);

    else{

      if(lbl===null){ redrawRoomRates(row,x); return; }
      list.push({from:r.from||'',to:r.to||'',label:String(lbl).trim()});
      rememberPeriod(r.from,r.to); markDirty('rates');
      toast('✅ 기간을 목록에 담았습니다');
    }
  }else if(v==='__del'){
    const list=ratePeriods();
    const pick=prompt('지울 기간의 번호를 적어 주세요.\n\n'
      +list.map((p,i)=>(i+1)+'. '+(p.label?p.label+' ('+perKey(p.from,p.to)+')':perKey(p.from,p.to))).join('\n'),'');
    const i=Number(pick)-1;
    if(list[i]){ list.splice(i,1); markDirty('rates'); toast('🗑 기간을 목록에서 지웠습니다'); }
  }else if(v){
    const [f,t]=v.split('~');
    r.from=f||''; r.to=t||'';
    rememberPeriod(r.from,r.to); markDirty('rates');
  }
  redrawRoomRates(row,x);
});

document.getElementById('pane').addEventListener('click',e=>{
  const cell=e.target.closest('.rcell'); if(!cell) return;
  const x=hotelByName(cell.dataset.rn); if(!x) return;
  const rooms=siteRoomsOf(x), row=e.target.closest('.rmrow');
  const rm=row?rooms[Number(row.dataset.mi)]:null;
  if(e.target.closest('.rmadd')){
    rooms.push({t:'',size:'',view:'',bed:'',bf:true});
    markDirty('site');
  }else if(e.target.closest('.rmdel')){
    if(!rm) return;
    if(!confirm('「'+(rm.t||'이름 없는 객실')+'」을(를) 지웁니다.\n요금도 같이 지워집니다.\n'
      +'(저장을 눌러야 실제로 반영됩니다)\n\n계속할까요?')) return;
    const home=priceHomeOf('hotels',x);
    if(home&&Array.isArray(home.rooms)){
      const q=home.rooms.indexOf(findRoom(home.rooms,rm.t));
      if(q>=0){ home.rooms.splice(q,1); markDirty('rates'); }
    }
    rooms.splice(Number(row.dataset.mi),1);
    markDirty('site');
  }else if(e.target.closest('.rmcpy')){
    if(!rm) return;
    const nm=prompt('「'+(rm.t||'이름 없는 객실')+'」을(를) 요금까지 그대로 베낍니다.\n\n새 객실 타입 이름:',(rm.t||'객실')+' 2');
    if(nm===null) return;
    const name=String(nm).trim();
    if(!name){ alert('이름을 적어야 합니다.'); return; }
    if(rooms.some(z=>nameKey(z.t)===nameKey(name))){ alert('「'+name+'」은(는) 이미 있습니다.'); return; }
    const copy=JSON.parse(JSON.stringify(rm)); copy.t=name;
    rooms.splice(Number(row.dataset.mi)+1,0,copy);
    markDirty('site');
    const src=findRoom(priceRoomsRO(x),rm.t);
    if(src&&Array.isArray(src.rates)&&src.rates.length){
      materializeExtras(src);                // 객실에 한 개씩 적혀 있던 옛 추가요금도 기간 줄에 실어 같이 베낀다
      priceRoomOf(x,name).rates=JSON.parse(JSON.stringify(src.rates));
      markDirty('rates');
    }
  }else if(e.target.closest('.rmradd')){
    if(!rm) return;
    if(!String(rm.t||'').trim()){ alert('먼저 객실 타입 이름을 적어 주세요.\n요금은 이름으로 이어집니다.'); return; }
    const pr=priceRoomOf(x,rm.t);
    const last=pr.rates[pr.rates.length-1]||lastPeriod;
    pr.rates.push({from:last.from||'',to:last.to||'',wd:'',we:''});
    markDirty('rates');
    redrawRoomRates(row,x); return;          // 요금칸만 — 옆 사진칸은 그대로 둔다
  }else if(e.target.closest('.rmrdel')){
    const rr=e.target.closest('.rmrate');
    if(!rm||!rr) return;
    const pr=priceRoomOf(x,rm.t);
    pr.rates.splice(Number(rr.dataset.ri),1);
    markDirty('rates');
    redrawRoomRates(row,x); return;
  }else return;
  redrawRoomCell(cell);
});

         요금표에 뭐가 들어와 있는지 곁눈질용 요약. 요금은 여기서 못 고친다.
         ── 호텔만 다르다: 포함·불포함 대신 「객실 타입별 요금」이 통째로 들어간다.
         ── 기본은 접혀 있다(.fold) — 줄의 「▸ 펼치기」나 「전부 펼치기」로 연다(사장님 2026-09-17) */
      +'<tr class="subrow'+off+(openSet(k).has(o.i)?'':' fold')+'"><td colspan="4"><div class="ierow">'
        +(k==='hotels' ? roomCell(o.x,o.i)

          +inp(p+'.addr',o.x.addr||'','주소 (영문) — 예: 300 Sukhumvit 55, Bangkok 10110, Thailand')
          +inp(p+'.tel',o.x.tel||'','전화 — 예: +66(0) 2 020 8000')+'</div>'

/* 찾기·지역순 토글처럼 「본문만」 바뀔 때 — 찾기칸은 건드리지 않는다(한글 조합 유지) */
function redrawItems(k){
  const tb=document.getElementById('iBody'); if(!tb) return;
  tb.innerHTML=itemBodyHTML(k);
  const cnt=document.getElementById('iCnt'); if(cnt) cnt.innerHTML=itemCntHTML(k);
  const rc=document.getElementById('iRegs'); if(rc) rc.innerHTML=regChipsHTML(k);
  bindRowBtns();
  bindItemExtras(k);
}
/* ── 골프장 휴장 요일(사장님 2026-09-17) ──
   방콕 쪽은 매주 월요일처럼 정해진 요일에 쉬는 골프장이 많다. 요일을 체크해 두면
   실시간 견적(/golf/)의 날짜별 골프장 선택과 손님 상세의 달력판에서 그 요일이 ✕로 막힌다.
   저장 위치: golf_site courses[i].closed = [요일 번호…] (0 일 … 6 토). 손님도 읽는 자료라 원가와 무관하다. */
const WD_KO=['일','월','화','수','목','금','토'];
function closedCell(i,x){
  const set=new Set(Array.isArray(x.closed)?x.closed.map(Number):[]);
  return '<div class="iecell"><b>휴장 요일 <span class="rhint">체크한 요일은 견적·달력에서 ✕ (선택 불가)</span></b>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">'
    +WD_KO.map((w,d)=>'<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;'+(d===0?'color:#B23B3B':'')+'"><input type="checkbox" data-closed="'+i+'" data-d="'+d+'"'+(set.has(d)?' checked':'')+'> '+w+'</label>').join('')
    +'</div></div>';
}
function bindClosed(k){
  if(k!=='courses') return;
  document.querySelectorAll('#iBody input[data-closed]').forEach(c=>c.onchange=()=>{
    const x=itemsArr(k)[+c.dataset.closed]; if(!x) return;
    const set=new Set(Array.isArray(x.closed)?x.closed.map(Number):[]);
    if(c.checked) set.add(+c.dataset.d); else set.delete(+c.dataset.d);
    x.closed=[...set].sort();
    markDirty('site');
  });
}
/* ── 지역 칩·접기(사장님 2026-09-17) ── */
/* 지역 칩: 전체 · 방콕 n · 파타야 n … (regionOrder 차례, 거기 없는 지역은 뒤에, 지역 칸이 빈 줄은 「지역 없음」) */
function regChipsHTML(k){
  const arr=itemsArr(k), cur=iRegion[k]||'';
  const cnt={}; let none=0;
  arr.forEach(x=>{ const r=(x&&x.r||'').trim(); if(r) cnt[r]=(cnt[r]||0)+1; else none++; });
  const ord=(S.regionOrder||[]).filter(r=>cnt[r]);
  Object.keys(cnt).forEach(r=>{ if(ord.indexOf(r)<0) ord.push(r); });
  const chip=(v,t,n)=>'<button type="button" data-reg="'+esc(v)+'" class="'+(cur===v?'on':'')+'">'+esc(t)+' <b>'+n+'</b></button>';
  return chip('','전체',arr.length)+ord.map(r=>chip(r,r,cnt[r])).join('')+(none?chip('__none','지역 없음',none):'');
}
/* 줄 하나 접기/펼치기 — 표를 다시 그리지 않고 그 줄만 바꾼다(한글 입력 중인 칸이 끊기지 않게) */
function toggleFold(k,i,btn){
  const set=openSet(k), open=!set.has(i);
  if(open) set.add(i); else set.delete(i);
  const tr=btn.closest('tr'), sub=tr&&tr.nextElementSibling;
  if(sub&&sub.classList.contains('subrow')) sub.classList.toggle('fold',!open);
  btn.textContent=open?'▾ 접기':'▸ 펼치기';
}
function bindItemExtras(k){
  const tb=document.getElementById('iBody'); if(!tb) return;
  tb.querySelectorAll('button[data-fold]').forEach(b=>b.onclick=()=>toggleFold(k,+b.dataset.fold,b));
  bindClosed(k);
  const rc=document.getElementById('iRegs');
  if(rc) rc.querySelectorAll('button[data-reg]').forEach(b=>b.onclick=()=>{ iRegion[k]=b.dataset.reg; redrawItems(k); });
  const oa=document.getElementById('iOpenAll'), ca=document.getElementById('iCloseAll');
  if(oa) oa.onclick=()=>{ const set=openSet(k); itemRows(k).rows.forEach(o=>set.add(o.i)); redrawItems(k); };   /* 지금 보이는 줄만 */
  if(ca) ca.onclick=()=>{ openSet(k).clear(); redrawItems(k); };
}

    +'</div>'

    +'<span class="cnt">'+list.filter(Boolean).length+'일 등록됨</span></div></div>';
