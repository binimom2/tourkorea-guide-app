<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위브투어타일랜드 · 사이트 관리</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../data.js"></script>
<style>
:root{
  --fairway:#123A2B; --fairway-deep:#08170F; --fairway-mid:#1C5B42;
  --paper:#F7F3E9; --marigold:#E8A33D; --ink:#15211C;
  --line:rgba(18,58,43,.18); --muted:#5E6F66; --danger:#c0492f;
  --font:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}

/* ── 로그인 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--fairway),var(--fairway-deep))}
.lbox{background:var(--paper);border-radius:18px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 22px 60px rgba(0,0,0,.35)}
.lbox h1{margin:0 0 3px;font-size:21px;font-weight:900;letter-spacing:-.04em}
.lbox p.sub{margin:0 0 22px;font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld label{font-size:11.5px;font-weight:800;color:var(--muted)}
.fld input{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px}
.fld input:focus{outline:2px solid var(--marigold);outline-offset:1px}
.lbtn{width:100%;background:var(--fairway);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:800;margin-top:6px}
.lbtn:hover{background:var(--fairway-mid)}
.lerr{margin-top:11px;font-size:13px;font-weight:700;color:var(--danger);min-height:18px}

/* ── 헤더 ── */
.top{position:sticky;top:0;z-index:40;background:var(--fairway);color:#fff}
.top .in{max-width:1180px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b.brand{font-size:16px;font-weight:900;letter-spacing:-.03em}
.top .who{margin-left:auto;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.72);white-space:nowrap}
.top a,.top button.lnk{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;text-decoration:none}
.top a:hover,.top button.lnk:hover{background:rgba(255,255,255,.22)}
/* 직원·어드민이 화면끼리 오갈 수 있게 — 손님 로그인과는 다른 문이다 */
.jump{display:flex;gap:6px;flex-wrap:wrap}

/* ── 탭 ── */
.tabs{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;color:var(--fairway)}
.tabs button.on{background:var(--fairway);border-color:var(--fairway);color:#fff}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--fairway)}
.subtabs button.on{background:var(--marigold);border-color:var(--marigold);color:#2A1A00}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px 17px;margin-bottom:14px}
.card > h2{margin:0 0 3px;font-size:15.5px;font-weight:800}
.card > p.desc{margin:0 0 13px;font-size:12.5px;color:var(--muted)}

/* ── 표 ── */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
th{background:rgba(18,58,43,.06);font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td input,td select,td textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px}
td input:focus,td select:focus,td textarea:focus{outline:2px solid var(--marigold);outline-offset:0}
td textarea{resize:vertical;min-height:34px;line-height:1.45}
.del{background:none;border:1px solid var(--line);border-radius:7px;color:var(--danger);font-size:12px;font-weight:800;padding:6px 9px;white-space:nowrap}
.del:hover{background:rgba(192,73,47,.09)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}
.add{background:var(--fairway);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:800}
.add:hover{background:var(--fairway-mid)}
.save{background:var(--marigold);color:#2A1A00;border:0;border-radius:9px;padding:10px 22px;font-size:14px;font-weight:900}
.save:hover{background:#f2b258}
.ghost{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;color:var(--fairway)}
.srch{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;min-width:190px;background:#fff}
.cnt{font-size:12.5px;font-weight:700;color:var(--muted)}

/* ── 자유 입력 묶음 ── */
.grid2{display:grid;gap:11px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:800;color:var(--muted)}
.f input,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.f textarea{resize:vertical;min-height:74px;line-height:1.5}
.f input:focus,.f textarea:focus{outline:2px solid var(--marigold);outline-offset:1px}
.hint{font-size:12px;color:var(--muted);margin:5px 0 0}

/* ── 계정 ── */
.accnew{background:rgba(18,58,43,.05);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:14px}
.accnew .line{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.accnew .f{min-width:150px}
.pwbox{display:flex;gap:6px}
.pwbox input{flex:1;min-width:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:rgba(18,58,43,.1);color:var(--fairway);white-space:nowrap}
.badge.fix{background:var(--marigold);color:#2A1A00}

.noauth{text-align:center;padding:56px 20px}
.noauth h2{margin:0 0 6px;font-size:19px;font-weight:900}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--fairway);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:90vw;text-align:center}
#toast.on{opacity:1}
.dirty{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>위브투어타일랜드</h1>
    <p class="sub">사이트 관리 · 어드민 전용</p>
    <div class="fld"><label for="lid">아이디</label><input id="lid" autocomplete="username"></div>
    <div class="fld"><label for="lpw">비밀번호</label><input id="lpw" type="password" autocomplete="current-password"></div>
    <button class="lbtn" id="lbtn" type="button">로그인</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="in">
      <b class="brand">위브투어타일랜드 · 사이트 관리</b>
      <nav class="jump">
        <a href="../index.html">🌐 손님 사이트</a>
        <a href="/golf/">⛳ 견적</a>
        <a href="/golf/admin/">🔧 요금·코드</a>
      </nav>
      <span class="who" id="who"></span>
      <button class="lnk" id="outBtn" type="button">로그아웃</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="pane"></div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   위브투어타일랜드 사이트 관리 (어드민 전용)

   다루는 데이터 (Supabase guide_data)
     golf_site       사이트에 보이는 내용 전부 — 이 화면에서만 만든다
     golf_codes      골프 코드 (요금관리 /golf/admin/ 과 같은 데이터를 쓴다)
     golf_roles      골프 권한 {아이디:admin|manager|agent}
     login_directory 아이디 → 로그인 이메일

   로그인 계정 자체(아이디·비밀번호)는 브라우저에서 못 만든다.
   서버 함수 /api/account (service_role)에 부탁한다.
   ══════════════════════════════════════════════════════════════ */
const SUPABASE_URL='https://aplevsrmxkzghutihyvs.supabase.co';
const SUPABASE_KEY='sb_publishable_FVavEEBxGZRRvU19F27koA_a4hJUiRl';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'gs-auth',persistSession:true,autoRefreshToken:true}});

const SITE_KEY='golf_site';
const EMAIL_DOMAIN='@wevetour.app';          /* 이 화면에서 새로 만드는 계정의 이메일 */
const ELEVATED_ADMIN_IDS=['lds1207'];        /* 명단과 무관하게 항상 어드민 — 잠금 방지 */

let currentUser=null, GROLE='', S=null, C={}, R={}, dirty={};

/* ── 알림 ── */
let _tm=null;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('on');
  clearTimeout(_tm); _tm=setTimeout(()=>t.classList.remove('on'),2600);
}

/* ══════ 저장 안전장치 ══════
   ① 저장 직전 서버 최신본을 다시 읽어, 내가 불러온 뒤 남이 바꿨으면 물어본다
   ② 덮어쓰기 직전 상태를 golf_bak_<키>_<0..9> 에 돌려가며 백업한다
   (요금관리 /golf/admin/ 과 같은 방식 — 백업 슬롯도 같이 쓴다) */
const BAK_SLOTS=10;
const _base={};
const _snap=v=>{ try{ return JSON.stringify(v===undefined?null:v); }catch(e){ return null; } };
async function loadRaw(key){
  const {data:row,error}=await sb.from('guide_data').select('data').eq('data_key',key).maybeSingle();
  if(error) throw error;
  return (row&&row.data!==undefined&&row.data!==null)?row.data:null;
}
async function saveRaw(key,data){
  try{
    const {error}=await sb.from('guide_data').upsert({data_key:key,data,updated_at:new Date().toISOString()});
    return !error;
  }catch(e){ return false; }
}
async function pushBackup(key,val){
  if(val===undefined||val===null) return;
  let meta=[];
  try{ meta=(await loadRaw('golf_bakmeta_'+key))||[]; }catch(e){ return; }
  if(!Array.isArray(meta)) meta=[];
  const sig=(_snap(val)||'').length;
  if(meta.length&&meta[0].sig===sig) return;
  const slot=meta.length?((meta[0].slot+1)%BAK_SLOTS):0;
  if(!await saveRaw('golf_bak_'+key+'_'+slot,val)) return;
  meta.unshift({slot,at:new Date().toISOString(),by:(currentUser&&currentUser.id)||'',sig});
  await saveRaw('golf_bakmeta_'+key,meta.slice(0,BAK_SLOTS));
}
const KEY_LABEL={golf_site:'사이트 내용',golf_codes:'코드',golf_roles:'계정 권한'};
async function saveSafe(key,data){
  let server=null;
  try{ server=await loadRaw(key); }
  catch(e){ toast('⚠ 서버 연결 실패 — 저장하지 않았습니다'); return false; }
  const b=_base[key], s=_snap(server);
  if(b!=null && s!==b){
    if(!confirm('['+(KEY_LABEL[key]||key)+']를 그 사이 다른 관리자가 바꿨습니다.\n\n'
      +'지금 저장하면 그 내용이 사라집니다.\n(취소하면 저장하지 않습니다 — 새로고침해 최신 내용을 확인하세요)\n\n계속할까요?')) return false;
  }
  try{ await pushBackup(key,server); }catch(e){}
  if(!await saveRaw(key,data)){ toast('❌ 저장 실패'); return false; }
  _base[key]=_snap(data);
  return true;
}

/* ══════ 로그인 ══════ */
async function resolveEmail(typed){
  const id=(typed||'').trim().toLowerCase();
  try{
    const {data:row}=await sb.from('guide_data').select('data').eq('data_key','login_directory').single();
    if(row&&row.data&&row.data[id]) return row.data[id];
  }catch(e){}
  return id+EMAIL_DOMAIN;      /* 이 화면에서 만든 계정은 매핑표가 없어도 열린다 */
}
function loginIdOf(u){ const m=(u&&u.user_metadata)||{}; return (m.acc_id||m.login_name||'').toLowerCase(); }
function golfRoleOf(u){
  const m=(u&&u.user_metadata)||{}, id=loginIdOf(u);
  if(m.role==='admin'||ELEVATED_ADMIN_IDS.includes(id)) return 'admin';
  const r=R[id];
  return (r==='admin'||r==='manager'||r==='agent')?r:'';
}
async function doLogin(){
  const id=(document.getElementById('lid').value||'').trim();
  const pw=(document.getElementById('lpw').value||'').trim();
  const err=document.getElementById('lerr'), btn=document.getElementById('lbtn');
  err.textContent='';
  if(!id||!pw){ err.textContent='아이디와 비밀번호를 입력하세요.'; return; }
  btn.textContent='로그인 중...'; btn.disabled=true;
  try{
    const email=await resolveEmail(id);
    const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(!error&&data&&data.session){ await afterAuth(data.user); return; }
    err.textContent='아이디 또는 비밀번호가 올바르지 않습니다.';
  }catch(e){ err.textContent='로그인 중 오류가 발생했습니다.'; }
  finally{ btn.textContent='로그인'; btn.disabled=false; }
}
document.getElementById('lbtn').onclick=doLogin;
['lid','lpw'].forEach(i=>document.getElementById(i)
  .addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); }));
document.getElementById('outBtn').onclick=async()=>{
  if(anyDirty()&&!confirm('저장하지 않은 변경이 있습니다. 그래도 나갈까요?')) return;
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
};

async function afterAuth(user){
  const m=(user&&user.user_metadata)||{};
  currentUser={id:m.acc_id||m.login_name||'', name:m.name||m.acc_id||'관리자', email:user.email||''};
  try{ const raw=await loadRaw('golf_roles'); R=(raw&&typeof raw==='object'&&!Array.isArray(raw))?raw:{}; _base['golf_roles']=_snap(raw); }
  catch(e){ R={}; }
  GROLE=golfRoleOf(user);
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent=currentUser.name+(GROLE?' · '+GROLE:'');

  /* 데이터 관리는 어드민과 직원(매니저)이 함께 본다.
     계정 만들기만 어드민 몫이다 — 로그인 비밀번호를 만드는 일이라서. */
  if(GROLE!=='admin'&&GROLE!=='manager'){
    document.getElementById('tabs').innerHTML='';
    document.getElementById('pane').innerHTML=
      '<div class="card noauth"><h2>접근 권한 없음</h2>'
      +'<p style="color:var(--muted)">이 화면은 어드민과 직원 계정만 사용할 수 있습니다.<br>'
      +'권한이 필요하면 관리자에게 요청해 주세요.</p></div>';
    return;
  }
  await loadAll();
  drawTabs();
}

/* ══════ 데이터 불러오기 ══════ */
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
async function loadAll(){
  /* 사이트 내용 — 저장된 게 없으면 data.js의 기본값으로 시작한다 */
  let raw=null;
  try{ raw=await loadRaw(SITE_KEY); }catch(e){}
  _base[SITE_KEY]=_snap(raw);
  S=(raw&&typeof raw==='object'&&Array.isArray(raw.courses))?deepCopy(raw):deepCopy(window.SITE_DEFAULT);
  /* 기본값에만 있는 항목(나중에 늘어난 칸)은 채워 준다 */
  Object.keys(window.SITE_DEFAULT).forEach(k=>{ if(S[k]===undefined) S[k]=deepCopy(window.SITE_DEFAULT[k]); });

  try{ const c=await loadRaw('golf_codes'); C=(c&&typeof c==='object')?deepCopy(c):{}; _base['golf_codes']=_snap(c); }
  catch(e){ C={}; }
  CODE_CATS.forEach(c=>{ if(!Array.isArray(C[c.key])) C[c.key]=[]; });
}

/* ══════ 값 읽고 쓰기 (경로 문자열) ══════
   입력칸마다 data-p="courses.3.n" 같은 경로를 달아 두고 여기서 한 번에 처리한다. */
function getPath(o,p){
  return p.split('.').reduce((a,k)=>(a==null?a:a[/^\d+$/.test(k)?Number(k):k]),o);
}
function setPath(o,p,v){
  const ks=p.split('.'); let cur=o;
  for(let i=0;i<ks.length-1;i++){ const k=/^\d+$/.test(ks[i])?Number(ks[i]):ks[i]; cur=cur[k]; }
  const last=ks[ks.length-1];
  cur[/^\d+$/.test(last)?Number(last):last]=v;
}
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function inp(path,val,ph,type){
  return '<input data-p="'+esc(path)+'" type="'+(type||'text')+'" value="'+esc(val)+'"'
    +(ph?' placeholder="'+esc(ph)+'"':'')+'>';
}
function ta(path,val,ph){
  return '<textarea data-p="'+esc(path)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea>';
}
/* 입력은 전부 여기서 받아 S에 반영한다 */
document.getElementById('pane').addEventListener('input',e=>{
  const el=e.target, p=el.dataset.p;
  if(!p) return;
  setPath(S,p,el.value);
  markDirty('site');
});
function markDirty(k){
  dirty[k]=true;
  const b=document.getElementById('tab-'+k);
  if(b&&!b.querySelector('.dirty')) b.insertAdjacentHTML('beforeend','<span class="dirty"></span>');
}
function clearDirty(k){
  dirty[k]=false;
  const b=document.getElementById('tab-'+k);
  const d=b&&b.querySelector('.dirty'); if(d) d.remove();
}
function anyDirty(){ return Object.keys(dirty).some(k=>dirty[k]); }
window.addEventListener('beforeunload',e=>{ if(anyDirty()){ e.preventDefault(); e.returnValue=''; } });

/* ══════ 탭 ══════ */
const TABS=[
  {k:'site',   label:'사이트 내용'},
  {k:'codes',  label:'코드관리'},
  {k:'accounts',label:'계정관리', adminOnly:true}
];
let tab='site';
function myTabs(){ return TABS.filter(t=>!t.adminOnly||GROLE==='admin'); }
function drawTabs(){
  const ts=myTabs();
  if(!ts.some(t=>t.k===tab)) tab=ts[0].k;
  document.getElementById('tabs').innerHTML=ts.map(t=>
    '<button id="tab-'+t.k+'" class="'+(t.k===tab?'on':'')+'">'+t.label
    +(dirty[t.k]?'<span class="dirty"></span>':'')+'</button>').join('');
  ts.forEach(t=>{ document.getElementById('tab-'+t.k).onclick=()=>{ tab=t.k; drawTabs(); }; });
  draw();
}
function draw(){
  if(tab==='site') drawSite();
  else if(tab==='codes') drawCodes();

/* ══════════════ 계정관리 ══════════════
   아이디·비밀번호는 브라우저에서 못 만든다 — 서버 함수 /api/account 가 대신 만든다.
   권한(admin/manager/agent)은 guide_data/golf_roles 에 아이디별로 둔다.
   ══════════════════════════════════════ */
const ROLE_LABEL={admin:'어드민',manager:'매니저',agent:'에이전트'};
async function api(action,payload){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const token=session&&session.access_token;
    if(!token) return {error:'로그인이 만료되었습니다. 다시 로그인해 주세요.'};
    const r=await fetch('/api/account',{method:'POST',
      headers:{'content-type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify(Object.assign({action},payload))});
    return await r.json().catch(()=>({error:'서버 응답을 해석할 수 없습니다.'}));
  }catch(e){ return {error:'서버 연결 실패: '+((e&&e.message)||e)}; }
}

function newPw(){
  const cs='abcdefghjkmnpqrstuvwxyz23456789';
  const a=new Uint32Array(8); crypto.getRandomValues(a);
  return Array.from(a,n=>cs[n%cs.length]).join('');
}
async function upsertLoginDir(id,email){
  let dir={};
  try{ dir=(await loadRaw('login_directory'))||{}; }catch(e){}
  dir[(id||'').toLowerCase()]=(email||'').toLowerCase();
  await saveRaw('login_directory',dir);
}
async function removeLoginDir(id){
  let dir={};
  try{ dir=(await loadRaw('login_directory'))||{}; }catch(e){}
  delete dir[(id||'').toLowerCase()];
  await saveRaw('login_directory',dir);
}

function drawAccounts(){
  const ids=Array.from(new Set(Object.keys(R).concat(ELEVATED_ADMIN_IDS).filter(Boolean)))
    .sort((a,b)=>a.localeCompare(b,'ko'));
  document.getElementById('pane').innerHTML=
    '<div class="card"><h2>계정 만들기</h2>'
    +'<p class="desc">아이디와 8자리 비밀번호로 로그인 계정을 만듭니다. 만들어진 비밀번호는 <b>이 자리에서만 보이니</b> 본인에게 바로 알려주세요.</p>'
    +'<div class="accnew"><div class="line">'
    +'<div class="f" style="flex:1 1 160px"><label>아이디 (영문·숫자)</label><input id="naId" placeholder="예: sooyoung"></div>'
    +'<div class="f" style="flex:1 1 200px"><label>비밀번호 (8자리)</label>'
      +'<div class="pwbox"><input id="naPw" class="mono" maxlength="32">'
      +'<button class="ghost" id="naGen" type="button">새로 만들기</button></div></div>'
    +'<div class="f" style="flex:0 0 130px"><label>권한</label><select id="naRole">'
      +'<option value="agent">에이전트 (견적만)</option>'
      +'<option value="manager">매니저 (견적·요금·코드)</option>'
      +'<option value="admin">어드민 (모두)</option></select></div>'
    +'<button class="add" id="naAdd" type="button">계정 만들기</button>'
    +'</div><p class="hint">에이전트는 견적 화면만, 매니저는 요금·코드까지, 어드민은 이 화면까지 씁니다.</p></div>'
    +'</div>'

    +'<div class="card"><h2>계정 목록 <span class="cnt">· '+ids.length+'명</span></h2>'
    +'<p class="desc">여기 없는 사람은 로그인해도 골프 화면이 열리지 않습니다.</p>'
    +'<div class="tblwrap"><table style="min-width:640px"><thead><tr>'
    +'<th style="width:170px">아이디</th><th style="width:190px">권한</th><th>비밀번호</th><th style="width:80px"></th>'
    +'</tr></thead><tbody>'
    +ids.map(id=>{
      const fixed=ELEVATED_ADMIN_IDS.includes(id);
      const role=fixed?'admin':(R[id]||'agent');
      return '<tr><td><b>'+esc(id)+'</b>'+(fixed?' <span class="badge fix">고정</span>':'')+'</td>'
        +'<td>'+(fixed?'<span class="badge">어드민</span>'
          :'<select data-role="'+esc(id)+'">'+Object.keys(ROLE_LABEL).map(r=>
            '<option value="'+r+'"'+(r===role?' selected':'')+'>'+ROLE_LABEL[r]+'</option>').join('')+'</select>')+'</td>'
        +'<td><button class="ghost" data-pw="'+esc(id)+'">비밀번호 바꾸기</button></td>'
        +'<td>'+(fixed?'':'<button class="del" data-adel="'+esc(id)+'">삭제</button>')+'</td></tr>';
    }).join('')
    +'</tbody></table></div>'
    +'<div class="rowbtns"><button class="save" id="rSave">권한 저장</button>'
    +'<span class="cnt">권한을 바꾸면 저장을 눌러야 반영됩니다</span></div></div>';

  const p=document.getElementById('pane');
  document.getElementById('naGen').onclick=()=>{ document.getElementById('naPw').value=newPw(); };
  document.getElementById('naPw').value=newPw();
  document.getElementById('naAdd').onclick=addAccount;
  p.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>{ R[s.dataset.role]=s.value; markDirty('accounts'); });
  p.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>changePw(b.dataset.pw));
  p.querySelectorAll('[data-adel]').forEach(b=>b.onclick=()=>delAccount(b.dataset.adel));
  document.getElementById('rSave').onclick=async()=>{
    if(await saveSafe('golf_roles',R)){ clearDirty('accounts'); drawTabs(); toast('✅ 권한을 저장했습니다'); }
  };
}

async function addAccount(){
  const id=(document.getElementById('naId').value||'').trim().toLowerCase();
  const pw=(document.getElementById('naPw').value||'').trim();
  const role=document.getElementById('naRole').value;
  if(!/^[a-z0-9._-]{3,}$/.test(id)){ toast('⚠ 아이디는 영문·숫자로 3자 이상 적어 주세요'); return; }
  if(pw.length<8){ toast('⚠ 비밀번호는 8자리 이상이어야 합니다'); return; }
  if(R[id]||ELEVATED_ADMIN_IDS.includes(id)){ toast('⚠ 이미 있는 아이디입니다'); return; }
  const btn=document.getElementById('naAdd');
  btn.disabled=true; btn.textContent='만드는 중...';
  const email=idToEmail(id);
  const res=await api('create',{email,password:pw,metadata:{acc_id:id,login_name:id,name:id,role:'golf'}});
  btn.disabled=false; btn.textContent='계정 만들기';
  if(res.error){ alert('계정을 만들지 못했습니다.\n\n'+res.error); return; }
  await upsertLoginDir(id,email);
  R[id]=role;
  if(!await saveSafe('golf_roles',R)){ alert('계정은 만들어졌지만 권한 저장에 실패했습니다.\n권한 저장을 다시 눌러 주세요.'); }
  else clearDirty('accounts');
  drawTabs();
  alert('계정을 만들었습니다.\n\n아이디: '+id+'\n비밀번호: '+pw+'\n권한: '+ROLE_LABEL[role]
    +'\n\n이 비밀번호는 다시 볼 수 없습니다. 본인에게 알려주세요.');
  document.getElementById('naId').value='';
}
async function changePw(id){
  const pw=prompt('「'+id+'」의 새 비밀번호 (8자리 이상)\n\n비워 두고 확인을 누르면 8자리로 자동 생성합니다.','');
  if(pw===null) return;
  const npw=pw.trim()||newPw();
  if(npw.length<8){ toast('⚠ 8자리 이상이어야 합니다'); return; }
  const res=await api('setPassword',{email:idToEmail(id),password:npw});
  if(res.error){
    /* 예전 계정은 이메일이 다를 수 있다 — 매핑표에서 찾아 한 번 더 시도한다 */
    let dir={};
    try{ dir=(await loadRaw('login_directory'))||{}; }catch(e){}
    const alt=dir[id];
    const res2=alt?await api('setPassword',{email:alt,password:npw}):{error:res.error};
    if(res2.error){ alert('비밀번호를 바꾸지 못했습니다.\n\n'+res2.error); return; }
  }
  alert('「'+id+'」의 비밀번호를 바꿨습니다.\n\n새 비밀번호: '+npw+'\n\n본인에게 알려주세요.');
}
async function delAccount(id){
  if(!confirm('「'+id+'」 계정을 지웁니다.\n\n로그인 계정 자체가 삭제되어 되돌릴 수 없습니다.\n\n계속할까요?')) return;
  let dir={};
  try{ dir=(await loadRaw('login_directory'))||{}; }catch(e){}
  const email=dir[id]||idToEmail(id);
  const res=await api('delete',{email});
  if(res.error&&!/찾지 못/.test(res.error)){ alert('계정을 지우지 못했습니다.\n\n'+res.error); return; }
  await removeLoginDir(id);
  delete R[id];
  if(await saveSafe('golf_roles',R)){ clearDirty('accounts'); }
  drawTabs();
  toast('🗑 「'+id+'」 계정을 지웠습니다');
}

  try{
    const {data}=await sb.auth.getSession();
