<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투어코리아 · 사이트 관리</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../data.js"></script>
<style>
:root{
  --fairway:#123A2B; --fairway-deep:#08170F; --fairway-mid:#1C5B42;
  --paper:#F7F3E9; --marigold:#E8A33D; --ink:#15211C;
  --line:rgba(18,58,43,.18); --muted:#5E6F66; --danger:#c0492f;
  --font:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}

/* ── 로그인 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--fairway),var(--fairway-deep))}
.lbox{background:var(--paper);border-radius:18px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 22px 60px rgba(0,0,0,.35)}
.lbox h1{margin:0 0 3px;font-size:21px;font-weight:900;letter-spacing:-.04em}
.lbox p.sub{margin:0 0 22px;font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld label{font-size:11.5px;font-weight:800;color:var(--muted)}
.fld input{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px}
.fld input:focus{outline:2px solid var(--marigold);outline-offset:1px}
.lbtn{width:100%;background:var(--fairway);color:#fff;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:800;margin-top:6px}
.lbtn:hover{background:var(--fairway-mid)}
.lerr{margin-top:11px;font-size:13px;font-weight:700;color:var(--danger);min-height:18px}

/* ── 헤더 ── */
.top{position:sticky;top:0;z-index:40;background:var(--fairway);color:#fff}
.top .in{max-width:1180px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b.brand{font-size:16px;font-weight:900;letter-spacing:-.03em}
.top .who{margin-left:auto;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.72);white-space:nowrap}
.top a,.top button.lnk{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;text-decoration:none}
.top a:hover,.top button.lnk:hover{background:rgba(255,255,255,.22)}
/* 직원·어드민이 화면끼리 오갈 수 있게 — 손님 로그인과는 다른 문이다 */
.jump{display:flex;gap:6px;flex-wrap:wrap}

/* ── 탭 ── */
.tabs{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;color:var(--fairway)}
.tabs button.on{background:var(--fairway);border-color:var(--fairway);color:#fff}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--fairway)}
.subtabs button.on{background:var(--marigold);border-color:var(--marigold);color:#2A1A00}

.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px 17px;margin-bottom:14px}
.card > h2{margin:0 0 3px;font-size:15.5px;font-weight:800}
.card > p.desc{margin:0 0 13px;font-size:12.5px;color:var(--muted)}

/* ── 표 ── */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1020px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
th{background:rgba(18,58,43,.06);font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td input,td select,td textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13.5px}
td input:focus,td select:focus,td textarea:focus{outline:2px solid var(--marigold);outline-offset:0}
td textarea{resize:vertical;min-height:34px;line-height:1.45}
/* 소개 문구처럼 긴 글을 적는 칸은 더 높게 잡는다 */
td textarea.big{min-height:80px}
/* 포함·불포함사항은 그 줄 「아래」에 한 줄을 더 깔아 넓게 적는다.
   위 줄과 한 덩어리로 보이도록 사이 선을 지우고 아래 줄만 선을 남긴다. */
tr.mainrow td{border-bottom:0;padding-bottom:2px}
tr.subrow td{padding:0 6px 11px}
/* 포함·불포함은 반씩 나눠 쓰고, 요금은 그 아래 한 줄을 통째로 쓴다(칸이 다섯 개라 넓어야 한다) */
.ierow{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding-left:58px}
.pcell{grid-column:1/-1}
.iecell{display:flex;flex-direction:column;gap:3px}
.iecell b{font-size:11px;font-weight:800;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.iecell b a{font-size:10.5px;font-weight:800;color:var(--fairway-mid);text-decoration:none}
.iecell b a:hover{text-decoration:underline}
.iecell textarea{min-height:50px}
/* 요금 칸 — 읽기 전용이라 입력칸과 다르게 보이도록 바탕을 깔고 테두리를 점선으로 */
.pbox{min-height:50px;padding:7px 9px;border:1px dashed var(--line);border-radius:7px;
  background:rgba(18,58,43,.035);display:flex;flex-direction:column;gap:3px}
.pbox span{font-size:11.5px;line-height:1.45}
.preg{font-weight:800;color:var(--fairway)}
.pln{color:var(--ink);font-variant-numeric:tabular-nums}
.pno{font-weight:800;color:var(--danger)}
.pmute{color:var(--muted)}
/* 요금 줄 — 기간 · 구분 · 시간 · 18홀 · 9홀 한 줄. 「＋」로 얼마든지 더한다. */
.rhint{font-weight:700;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:4px}
.rhead,.rrow{display:grid;grid-template-columns:234px 84px 74px 88px 88px 26px;
  gap:5px;align-items:center}
.rhead{font-size:10.5px;font-weight:800;color:var(--muted);padding:0 1px}
/* 메뉴별 요금(스파·티켓…) — 메뉴(시간 포함) · 코스·내용 · 적용 기간 · 밧 네 칸 */
.mhead,.mrow{grid-template-columns:1fr 1.1fr 236px 100px 26px}
.mrow .rdate.mprom input{background:#FEF6E4;border-color:#E8C88A}   /* 기간이 든 줄(프로모션)은 노랗게 */
/* 기간 칸 — 위는 「자주 쓰는 기간」 고르기, 아래는 날짜 두 개.
   달력을 매번 여는 게 일이라, 한 번 담아 둔 기간을 골라 쓰는 길을 위에 뒀다. */
.rper{display:flex;flex-direction:column;gap:3px;min-width:0}
.rper .rdate{display:grid;grid-template-columns:1fr 10px 1fr;gap:4px;align-items:center}
.rrow input,.rrow select{padding:5px 6px;font-size:12px;border:1px solid var(--line);
  border-radius:6px;background:#fff;width:100%}
.rrow input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.rtil{text-align:center;color:var(--muted);font-size:11px}
.rdel{background:none;border:0;color:var(--danger);font-size:13px;font-weight:900;
  cursor:pointer;padding:2px}
.rdel:hover{background:rgba(192,73,47,.1);border-radius:5px}
.rnone{font-size:11.5px;color:var(--muted);padding:4px 1px}
.radd{margin-top:5px;align-self:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:800;color:var(--fairway)}
.radd:hover{background:rgba(18,58,43,.06)}
/* ── 호텔 객실 (2026-09-03~) ──
   호텔은 골프장과 요금 모양이 달라 칸을 따로 뒀다. 한 객실이 «내용 한 줄 + 기간별 요금 여러 줄»이다.
   내용(면적·뷰·침대·조식·사진)은 golf_site에, 요금(주중·주말)은 요금표에 나뉘어 저장된다. */
.rmlist{display:flex;flex-direction:column;gap:9px}
.rmrow{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff}
.rmhead{display:grid;grid-template-columns:1.5fr 78px 96px 1.2fr 62px 44px 22px;gap:5px;align-items:center}
.rmhead input{padding:5px 6px;font-size:12px;border:1px solid var(--line);border-radius:6px;width:100%}
/* 침대 칸 — 줄바꿈이 되는 칸이라 textarea. 적은 줄 수만큼 높이가 따라간다(rows) */
.rmhead textarea{padding:5px 6px;font-size:12px;font-family:inherit;line-height:1.35;border:1px solid var(--line);border-radius:6px;width:100%;resize:none;min-height:0;box-sizing:border-box;white-space:pre-wrap}
.rmbf{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.rmbf input{margin:0;width:auto}
.rmcpy{background:none;border:1px solid var(--line);border-radius:6px;color:var(--fairway);
  font-size:11px;font-weight:800;padding:4px 5px;cursor:pointer;white-space:nowrap}
.rmcpy:hover{background:rgba(18,58,43,.08)}
.rmdel,.rmrdel{background:none;border:0;color:var(--danger);font-size:13px;font-weight:900;cursor:pointer;padding:2px}
.rmdel:hover,.rmrdel:hover{background:rgba(192,73,47,.1);border-radius:5px}
.rminc{display:flex;align-items:center;gap:7px;margin-top:6px}
.rminc>label{font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.rminc input{flex:1;padding:5px 6px;font-size:12px;border:1px solid var(--line);border-radius:6px;min-width:0}
/* 추가요금 줄 — 숫자 두 칸이라 늘어나지 않게 폭을 준다 */
.rmex>span{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.rmex input{flex:none;width:92px;text-align:right;font-variant-numeric:tabular-nums}
.rmbody{display:grid;grid-template-columns:1fr 200px;gap:10px;margin-top:7px}
.rmrates{display:flex;flex-direction:column;gap:4px;min-width:0}
.rmhd,.rmrate{display:grid;grid-template-columns:234px 108px 88px 88px 22px;gap:5px;align-items:center}
/* 써차지(특별일 추가요금) 줄은 눈에 띄게 — 기본요금과 헷갈리면 값이 두 배로 나간다 */
.rmrate.sur{background:#FFF6E6;border-radius:7px;padding:3px;margin:-3px}
.rmrate.sur input[type=number]{border-color:var(--marigold)}
.rmhd{font-size:10.5px;font-weight:800;color:var(--muted);padding:0 1px}
.rmrate input,.rmrate select{padding:5px 6px;font-size:12px;border:1px solid var(--line);
  border-radius:6px;background:#fff;width:100%}
.rmrate input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.rmpic{min-width:0}
.rmpic>label{font-size:10.5px;font-weight:800;color:var(--muted);display:block;margin-bottom:3px}
.rmnote{font-size:11.5px;color:var(--muted);margin:7px 0 0;line-height:1.5}
/* 객실 칸은 아랫줄을 통째로 쓴다 — 포함·불포함 두 칸이 있던 자리를 다 차지한다 */
.rcell{grid-column:1/-1}
/* 끼워 넣은 요금표 — 테두리 없이 이 화면의 일부처럼 보이게 */
#ratesFrame{width:100%;border:0;display:block;min-height:600px;background:transparent}
.del{background:none;border:1px solid var(--line);border-radius:7px;color:var(--danger);font-size:12px;font-weight:800;padding:6px 9px;white-space:nowrap}
.del:hover{background:rgba(192,73,47,.09)}
/* 줄 복사 — 삭제 단추 바로 위에 놓는다. 시암처럼 요금은 같고 코스만 다른 곳을 빨리 늘리려고 */
.cpy{background:none;border:1px solid var(--line);border-radius:7px;color:var(--fairway);font-size:12px;font-weight:800;padding:6px 9px;white-space:nowrap;display:block;width:100%;margin-bottom:5px}
.cpy:hover{background:rgba(18,58,43,.08)}
/* ── 📋 예약요청 ──
   표로 짜면 한 건에 골프장·호텔이 여러 줄이라 칸이 어긋난다. 그래서 건마다 카드 하나다. */
.bkcnt{margin-left:7px;font-size:12px;font-weight:800;color:var(--marigold)}
.bklist{display:flex;flex-direction:column;gap:11px}
.bkcard{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:#fff}
.bkhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.bkno{font-size:14px;font-weight:900;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.bkst{color:#fff;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800}
.bkat{font-size:12px;color:var(--muted);font-weight:700}
.bktot{margin-left:auto;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.bkwho{font-size:13.5px;margin-bottom:5px}
.bkwho b{font-weight:800}
.bkwho span{color:var(--muted);font-size:12.5px;margin-left:7px;white-space:pre-wrap}
.bkmemo{background:rgba(232,163,61,.12);border-radius:8px;padding:7px 10px;font-size:12.5px;
  line-height:1.55;margin-bottom:7px;white-space:pre-wrap}
.bkitems{list-style:none;margin:0 0 9px;padding:0;border-top:1px solid var(--line)}
.bkitems li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px}
.bkitems li:last-child{border-bottom:0}
.bkw{font-weight:800;min-width:180px}
.bkw i{font-style:normal;font-weight:700;color:var(--muted);font-size:12px}
.bkd{color:var(--muted);font-size:12.5px;flex:1;min-width:150px}
.bkm{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.bkm i{font-style:normal;color:var(--muted);font-size:12px}
.bkask{font-style:normal;color:var(--muted);font-size:12.5px;font-weight:800}
.bkfoot{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bkfoot select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13px;font-weight:700}
.bkfoot input{flex:1;min-width:160px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13px}
.bkby{font-size:11.5px;color:var(--muted);font-weight:700}
/* 바우처 줄 — 컨펌 전엔 단추 하나, 발급 뒤엔 확정번호·열기·보내기 */
.bkvc{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px;padding:9px 10px;border-radius:9px;background:rgba(232,163,61,.10)}
.bkvc.on{background:rgba(46,125,79,.10)}
.bkvc .ghost{padding:6px 11px;font-size:12.5px}
.bkvhint{font-size:12px;color:var(--muted);font-weight:700}
.bkvno{font-size:13px;font-weight:700}
.bkvno b{font-weight:900;font-variant-numeric:tabular-nums}
.bkvopen{font-size:13px;font-weight:800;color:var(--fairway);text-decoration:none;border:1px solid var(--fairway);border-radius:8px;padding:5px 11px;background:#fff}
.bkvopen:hover{background:rgba(18,58,43,.07)}
.bkvsent{flex-basis:100%;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.5}
.vcell{grid-column:1/-1}
.vcell input{margin-top:3px}
@media(max-width:640px){ .bkw{min-width:100%} .bkm{margin-left:0} }

/* 🎨 화면 꾸미기 — 고르는 단추 */
.thpick{display:flex;flex-wrap:wrap;gap:8px}
.th{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:800;color:var(--fairway)}
.th:hover{border-color:var(--fairway)}
.th.on{border-color:var(--fairway);background:rgba(18,58,43,.07);box-shadow:inset 0 0 0 1px var(--fairway)}
.th i{width:16px;height:16px;border-radius:999px;border:1px solid rgba(0,0,0,.15);display:inline-block}

/* 종류 차례 바꾸기 ▲▼ */
.ordbtns{display:flex;gap:4px}
.ord{background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--fairway);
  font-size:11px;font-weight:800;padding:6px 8px;line-height:1}
.ord:hover:not(:disabled){background:rgba(18,58,43,.08)}
.ord:disabled{opacity:.3;cursor:default}

/* 📅 공휴일 — 날짜 칸을 낱개로 늘어놓는다 */
.hdays{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hd{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;background:#fff}
.hd input{font:inherit;font-size:13px;border:0;background:none;padding:2px}
.hd .del{border:0;padding:2px 5px;font-size:14px;background:none}

.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}
.add{background:var(--fairway);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:800}
.add:hover{background:var(--fairway-mid)}
.save{background:var(--marigold);color:#2A1A00;border:0;border-radius:9px;padding:10px 22px;font-size:14px;font-weight:900}
/* 저장 줄은 화면 아래에 붙어 다닌다 — 62줄 표에서 한 줄 고칠 때마다 맨 아래까지
   내려갔다 오는 것이 번거롭다. 목록 끝에 있던 것을 그 자리에 둔 채 붙여만 둔 것이라
   표가 짧으면 원래 자리에 그대로 보인다. */
.savebar{position:sticky;bottom:0;z-index:30;margin:14px -16px -16px;padding:11px 16px;
  background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(18,58,43,.07)}
.savebar .warn{font-size:12.5px;font-weight:800;color:var(--danger)}
.savebar .tip{font-size:12px;font-weight:700;color:var(--muted)}
.save:hover{background:#f2b258}
.ghost{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;color:var(--fairway)}
.srch{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;min-width:190px;background:#fff}
.cnt{font-size:12.5px;font-weight:700;color:var(--muted)}
/* 「지역」 머리글 = 지역순으로 모아 보기 단추 (보기만 바뀌고 저장 순서는 안 건드린다) */
.sortth{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;letter-spacing:.2px}
.sortth:hover{color:var(--fairway)}
.sortth.on{color:var(--fairway);text-decoration:underline}
tr.grp td{background:rgba(18,58,43,.045);font-size:12px;font-weight:800;color:var(--fairway);padding:6px 9px}

/* ── 자유 입력 묶음 ── */
.grid2{display:grid;gap:11px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;font-weight:800;color:var(--muted)}
.f input,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.f textarea{resize:vertical;min-height:74px;line-height:1.5}
.f input:focus,.f textarea:focus{outline:2px solid var(--marigold);outline-offset:1px}
.hint{font-size:12px;color:var(--muted);margin:5px 0 0}

/* ── 계정 ── */
.accnew{background:rgba(18,58,43,.05);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:14px}
.accnew .line{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.accnew .f{min-width:150px}
.pwbox{display:flex;gap:6px}
.pwbox input{flex:1;min-width:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:rgba(18,58,43,.1);color:var(--fairway);white-space:nowrap}

.noauth{text-align:center;padding:56px 20px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--fairway);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:90vw;text-align:center}

.dirty{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}

/* 손님 화면에서 감춰 둔 줄 — 자료는 남아 있으니 지운 것처럼 보이면 안 된다.
   글자를 흐리게 하지 않는다: 전부 꺼 두고 하나씩 채우는 일이 많아, 흐려지면 표를 못 읽는다.
   꺼진 줄은 바탕색과 왼쪽 띠로만 알린다(체크칸에도 이미 드러난다). */
tr.offrow{background:#FAFAFA}
tr.mainrow.offrow td:first-child{box-shadow:inset 3px 0 0 var(--marigold)}

/* 사진칸 — 미리보기 + 올리기 + 주소 목록 */
.picbox{display:flex;flex-direction:column;gap:6px;min-width:190px}
.picbox.drop{outline:2px dashed var(--fairway);outline-offset:3px;border-radius:8px}
.picthumbs{display:flex;flex-wrap:wrap;gap:5px}
.picth{position:relative;width:52px;height:40px;border-radius:6px;overflow:hidden;background:#E8EEE9;flex:none}
.picth img{width:100%;height:100%;object-fit:cover;display:block}
.picth img.bad{display:none}
.picth.rep{outline:2px solid var(--fairway);outline-offset:-2px}
.picth i{position:absolute;left:0;bottom:0;font-style:normal;background:var(--fairway);color:#fff;font-size:9px;font-weight:800;padding:1px 4px;border-radius:0 5px 0 0}
.picth b{position:absolute;top:0;right:0;background:rgba(20,20,20,.62);color:#fff;font-size:10px;font-weight:800;
  width:15px;height:15px;line-height:15px;text-align:center;cursor:pointer;border-radius:0 0 0 5px}
.picth b:hover{background:var(--danger)}
.picbtns{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.picup{background:#fff;border:1.4px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.picup:hover{border-color:var(--fairway);background:#F1F8F3}
.picmsg{font-size:11px;color:var(--muted);line-height:1.35}
.picbox textarea{font-size:11px;line-height:1.45}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>투어코리아</h1>
    <p class="sub">사이트 관리 · 어드민 전용</p>
    <div class="fld"><label for="lid">아이디</label><input id="lid" autocomplete="username"></div>
    <div class="fld"><label for="lpw">비밀번호</label><input id="lpw" type="password" autocomplete="current-password"></div>
    <button class="lbtn" id="lbtn" type="button">로그인</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="in">
      <b class="brand">투어코리아 · 사이트 관리</b>
      <nav class="jump">
        <a href="../index.html">🌐 손님 사이트</a>
        <a href="/golf/">⛳ 견적</a>
        <a href="/golf/admin/">🔧 요금·코드</a>
      </nav>
      <span class="who" id="who"></span>
      <button class="lnk" id="outBtn" type="button">로그아웃</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="pane"></div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   위브투어타일랜드 사이트 관리 (어드민 전용)

   다루는 데이터 (Supabase guide_data)
     golf_site       사이트에 보이는 내용 전부 — 이 화면에서만 만든다
     golf_codes      골프 코드 (요금관리 /golf/admin/ 과 같은 데이터를 쓴다)
     golf_roles      골프 권한 {아이디:admin|manager|agent}
     login_directory 아이디 → 로그인 이메일

   로그인 계정 자체(아이디·비밀번호)는 브라우저에서 못 만든다.
   서버 함수 /api/account (service_role)에 부탁한다.
   ══════════════════════════════════════════════════════════════ */
const SUPABASE_URL='https://aplevsrmxkzghutihyvs.supabase.co';
const SUPABASE_KEY='sb_publishable_FVavEEBxGZRRvU19F27koA_a4hJUiRl';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'gs-auth',persistSession:true,autoRefreshToken:true}});

const SITE_KEY='golf_site';
/* 이 화면이 가진 요금 칸 — 나머지(차량·핸들링·가이드…)는 /golf/admin/ 것이라 손대지 않는다 */
const RATE_MINE=['regions','holidays'];
async function mergeRatesForSave(cur){
  let server=null;
  try{ server=await loadRaw(PRICE_KEY); }catch(e){ return null; }   // 못 읽으면 저장하지 않는다
  const out=Object.assign({},server||{});
  RATE_MINE.forEach(k=>{ if(cur&&cur[k]!==undefined) out[k]=cur[k]; });
  return out;
}
const EMAIL_DOMAIN='@wevetour.app';          /* 이 화면에서 새로 만드는 계정의 이메일 */
const ELEVATED_ADMIN_IDS=['lds1207','sooyoung'];        /* 명단과 무관하게 항상 어드민 — 잠금 방지 */

let currentUser=null, GROLE='', S=null, C={}, R={}, dirty={};
/* P = 요금표(golf_pricing) 사본, PIDX = 이름으로 찾기 좋게 편 것.
   자료를 넣으면서 요금도 같이 넣으라고 이 화면에서도 고칠 수 있게 했다.
   저장은 golf_site와 **따로** 나간다(키가 다르다) — 요금표 화면과 같은 안전장치를 쓴다. */
let P=null, PIDX={courses:{},hotels:{}};
const PRICE_KEY='golf_pricing';
let ratesTimer=0;   // 끼워 넣은 요금표 높이 맞추기 타이머

/* ── 알림 ── */
let _tm=null;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('on');
  clearTimeout(_tm); _tm=setTimeout(()=>t.classList.remove('on'),2600);
}

/* ══════ 저장 안전장치 ══════
   ① 저장 직전 서버 최신본을 다시 읽어, 내가 불러온 뒤 남이 바꿨으면 물어본다
   ② 덮어쓰기 직전 상태를 golf_bak_<키>_<0..9> 에 돌려가며 백업한다
   (요금관리 /golf/admin/ 과 같은 방식 — 백업 슬롯도 같이 쓴다) */
const BAK_SLOTS=10;
const _base={};
const _snap=v=>{ try{ return JSON.stringify(v===undefined?null:v); }catch(e){ return null; } };
async function loadRaw(key){
  const {data:row,error}=await sb.from('guide_data').select('data').eq('data_key',key).maybeSingle();
  if(error) throw error;
  return (row&&row.data!==undefined&&row.data!==null)?row.data:null;
}
async function saveRaw(key,data){
  try{
    const {error}=await sb.from('guide_data').upsert({data_key:key,data,updated_at:new Date().toISOString()});
    return !error;
  }catch(e){ return false; }
}
async function pushBackup(key,val){
  if(val===undefined||val===null) return;
  let meta=[];
  try{ meta=(await loadRaw('golf_bakmeta_'+key))||[]; }catch(e){ return; }
  if(!Array.isArray(meta)) meta=[];
  const sig=(_snap(val)||'').length;
  if(meta.length&&meta[0].sig===sig) return;
  const slot=meta.length?((meta[0].slot+1)%BAK_SLOTS):0;
  if(!await saveRaw('golf_bak_'+key+'_'+slot,val)) return;
  meta.unshift({slot,at:new Date().toISOString(),by:(currentUser&&currentUser.id)||'',sig});
  await saveRaw('golf_bakmeta_'+key,meta.slice(0,BAK_SLOTS));
}
const KEY_LABEL={golf_site:'사이트 내용',golf_codes:'코드',golf_roles:'계정 권한'};
async function saveSafe(key,data){
  let server=null;
  try{ server=await loadRaw(key); }
  catch(e){ toast('⚠ 서버 연결 실패 — 저장하지 않았습니다'); return false; }
  const b=_base[key], s=_snap(server);
  if(b!=null && s!==b){
    if(!confirm('['+(KEY_LABEL[key]||key)+']를 그 사이 다른 관리자가 바꿨습니다.\n\n'
      +'지금 저장하면 그 내용이 사라집니다.\n(취소하면 저장하지 않습니다 — 새로고침해 최신 내용을 확인하세요)\n\n계속할까요?')) return false;
  }
  try{ await pushBackup(key,server); }catch(e){}
  if(!await saveRaw(key,data)){ toast('❌ 저장 실패'); return false; }
  _base[key]=_snap(data);
  return true;
}

/* ══════ 로그인 ══════ */
async function resolveEmail(typed){
  const id=(typed||'').trim().toLowerCase();
  try{
    const {data:row}=await sb.from('guide_data').select('data').eq('data_key','login_directory').single();
    if(row&&row.data&&row.data[id]) return row.data[id];
  }catch(e){}
  return id+EMAIL_DOMAIN;      /* 이 화면에서 만든 계정은 매핑표가 없어도 열린다 */
}
function loginIdOf(u){ const m=(u&&u.user_metadata)||{}; return (m.acc_id||m.login_name||((u&&u.email)||'').split('@')[0]||'').toLowerCase(); }
function golfRoleOf(u){
  const m=(u&&u.user_metadata)||{}, id=loginIdOf(u);
  if(m.role==='admin'||ELEVATED_ADMIN_IDS.includes(id)) return 'admin';
  const r=R[id];
  return (r==='admin'||r==='manager'||r==='agent')?r:'';
}
async function doLogin(){
  const id=(document.getElementById('lid').value||'').trim();
  const pw=(document.getElementById('lpw').value||'').trim();
  const err=document.getElementById('lerr'), btn=document.getElementById('lbtn');
  err.textContent='';
  if(!id||!pw){ err.textContent='아이디와 비밀번호를 입력하세요.'; return; }
  btn.textContent='로그인 중...'; btn.disabled=true;
  try{
    const email=await resolveEmail(id);
    const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(!error&&data&&data.session){ await afterAuth(data.user); return; }
    err.textContent='아이디 또는 비밀번호가 올바르지 않습니다.';
  }catch(e){ err.textContent='로그인 중 오류가 발생했습니다.'; }
  finally{ btn.textContent='로그인'; btn.disabled=false; }
}
document.getElementById('lbtn').onclick=doLogin;
['lid','lpw'].forEach(i=>document.getElementById(i)
  .addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); }));
document.getElementById('outBtn').onclick=async()=>{
  if(anyDirty()&&!confirm('저장하지 않은 변경이 있습니다. 그래도 나갈까요?')) return;
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
};

async function afterAuth(user){
  const m=(user&&user.user_metadata)||{};
  currentUser={id:m.acc_id||m.login_name||'', name:m.name||m.acc_id||'관리자', email:user.email||''};
  try{ const raw=await loadRaw('golf_roles'); R=(raw&&typeof raw==='object'&&!Array.isArray(raw))?raw:{}; _base['golf_roles']=_snap(raw); }
  catch(e){ R={}; }
  GROLE=golfRoleOf(user);
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent=currentUser.name+(GROLE?' · '+GROLE:'');

  /* 데이터 관리는 어드민과 직원(매니저)이 함께 본다.
     계정 만들기만 어드민 몫이다 — 로그인 비밀번호를 만드는 일이라서. */
  if(GROLE!=='admin'&&GROLE!=='manager'){
    document.getElementById('tabs').innerHTML='';
    document.getElementById('pane').innerHTML=
      '<div class="card noauth"><h2>접근 권한 없음</h2>'
      +'<p style="color:var(--muted)">이 화면은 어드민과 직원 계정만 사용할 수 있습니다.<br>'
      +'권한이 필요하면 관리자에게 요청해 주세요.</p></div>';
    return;
  }
  await loadAll();
  drawTabs();
}

/* ══════ 데이터 불러오기 ══════ */
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
async function loadAll(){
  /* 사이트 내용 — 저장된 게 없으면 data.js의 기본값으로 시작한다 */
  let raw=null;
  try{ raw=await loadRaw(SITE_KEY); }catch(e){}
  _base[SITE_KEY]=_snap(raw);
  S=(raw&&typeof raw==='object'&&Array.isArray(raw.courses))?deepCopy(raw):deepCopy(window.SITE_DEFAULT);
  /* 기본값에만 있는 항목(나중에 늘어난 칸)은 채워 준다 */
  Object.keys(window.SITE_DEFAULT).forEach(k=>{ if(S[k]===undefined) S[k]=deepCopy(window.SITE_DEFAULT[k]); });

  try{ const c=await loadRaw('golf_codes'); C=(c&&typeof c==='object')?deepCopy(c):{}; _base['golf_codes']=_snap(c); }
  catch(e){ C={}; }
  CODE_CATS.forEach(c=>{ if(!Array.isArray(C[c.key])) C[c.key]=[]; });

  /* 요금표(golf_pricing) — 자료를 넣으면서 요금이 들어와 있는지 곁눈질로 보라고 읽어만 온다.
     이 화면에서는 **절대 고치지도 저장하지도 않는다** — 요금은 /golf/admin/ 이 정본이다. */
  try{ const g=await loadRaw(PRICE_KEY); P=(g&&typeof g==='object'&&g.regions)?g:null;
       _base[PRICE_KEY]=_snap(g); }
  catch(e){ P=null; }
  buildPriceIndex();
}
/* 요금표는 지역 > 골프장이름 으로 담겨 있다. 이름으로 바로 찾을 수 있게 펴 둔다.
   사이트와 요금표의 **이름이 정확히 같아야** 이어진다 — 다르면 「요금표에 없음」으로 뜬다. */
function buildPriceIndex(){
  PIDX={courses:{},hotels:{}};
  if(!P||!P.regions) return;
  const key=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
  Object.keys(P.regions).forEach(reg=>{
    const r=P.regions[reg]||{};
    (r.courses||[]).forEach(c=>{ if(c&&c.name) PIDX.courses[key(c.name)]={reg,c}; });
    (r.hotels ||[]).forEach(h=>{ if(h&&h.name) PIDX.hotels [key(h.name)]={reg,h}; });
    /* 그 밖의 종류(스파·티켓…) — 종류 키 그대로 regions[지역][키]에 담긴다(2026-09-09).
       한 항목 = { name, menu:[{n,u,p}] } — 프로그램 이름·시간(단위)·밧 */
    Object.keys(r).forEach(k=>{
      if(k==='courses'||k==='hotels'||!Array.isArray(r[k])) return;
      PIDX[k]=PIDX[k]||{};
      r[k].forEach(o=>{ if(o&&o.name) PIDX[k][key(o.name)]={reg,o}; });
    });
  });
}

/* ══════ 값 읽고 쓰기 (경로 문자열) ══════
   입력칸마다 data-p="courses.3.n" 같은 경로를 달아 두고 여기서 한 번에 처리한다. */
function getPath(o,p){
  return p.split('.').reduce((a,k)=>(a==null?a:a[/^\d+$/.test(k)?Number(k):k]),o);
}
function setPath(o,p,v){
  const ks=p.split('.'); let cur=o;
  for(let i=0;i<ks.length-1;i++){ const k=/^\d+$/.test(ks[i])?Number(ks[i]):ks[i]; cur=cur[k]; }
  const last=ks[ks.length-1];
  cur[/^\d+$/.test(last)?Number(last):last]=v;
}
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function inp(path,val,ph,type){
  return '<input data-p="'+esc(path)+'" type="'+(type||'text')+'" value="'+esc(val)+'"'
    +(ph?' placeholder="'+esc(ph)+'"':'')+'>';
}
function ta(path,val,ph,cls){
  return '<textarea data-p="'+esc(path)+'"'+(cls?' class="'+esc(cls)+'"':'')
    +(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea>';
}
/* 「방콕 · 파타야 · 후아힌」처럼 한 줄로 적고 목록으로 저장하는 칸 */
function inpList(path,arr,ph){
  return '<input data-p="'+esc(path)+'" data-list="1" type="text" value="'+esc((arr||[]).join(' · '))+'"'
    +(ph?' placeholder="'+esc(ph)+'"':'')+'>';
}
/* 입력은 전부 여기서 받아 S에 반영한다 */
document.getElementById('pane').addEventListener('input',e=>{
  const el=e.target, p=el.dataset.p;
  if(!p) return;
  if(el.dataset.bool){                 // 체크칸(손님에게 보이기 등)
    setPath(S,p,el.checked);
    /* 항목 「보이기」는 표 전체를 다시 그리지 않고 그 줄과 숫자만 고친다
       — 62줄을 다시 그리면 보고 있던 자리가 위로 튄다 */
    if(el.dataset.itemon) refreshItemOn(el);
  }else if(el.dataset.pname){          // 이름칸 — 요금표와 이어지는 기준이라 따로 표시하지 않는다
    setPath(S,p,el.value);             // (다 치고 칸을 벗어날 때 요금 칸만 새로 그린다)
  }else if(el.dataset.list){           // 지역 차례처럼 「·」로 이어 적고 목록으로 저장하는 칸
    setPath(S,p,el.value.split(/[·,]/).map(s=>s.trim()).filter(Boolean));
  }else if(el.dataset.pics){           // 사진칸 — 첫 줄이 대표(img), 나머지가 imgs
    const list=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
    const o=getPath(S,p);
    if(o){ o.img=list[0]||''; o.imgs=list.slice(1); }
  }else{
    setPath(S,p,el.value);
  }
  markDirty('site');
});
/* 「보이기」를 끄고 켤 때 그 줄 색과 숨김 개수만 새로 그린다 */
function refreshItemOn(el){
  const tr=el.closest('tr');
  /* 한 항목이 두 줄(위: 이름·소개, 아래: 포함·불포함)이라 둘 다 같이 흐려져야 한다 */
  if(tr){ tr.classList.toggle('offrow',!el.checked);
    const sub=tr.nextElementSibling;
    if(sub&&sub.classList.contains('subrow')) sub.classList.toggle('offrow',!el.checked); }
  const cnt=document.getElementById('iCnt');
  if(!cnt) return;
  cnt.innerHTML=itemCntHTML(cnt.dataset.k);   /* 찾기 중이면 「찾은 것 N곳」도 같이 유지된다 */

}
function markDirty(k){
  dirty[k]=true;
  const b=document.getElementById('tab-'+k);
  if(b&&!b.querySelector('.dirty')) b.insertAdjacentHTML('beforeend','<span class="dirty"></span>');
  if((k==='site'||k==='rates')&&typeof showDirtyNote==='function') showDirtyNote();
}
function clearDirty(k){
  dirty[k]=false;
  const b=document.getElementById('tab-'+k);
  const d=b&&b.querySelector('.dirty'); if(d) d.remove();
  if((k==='site'||k==='rates')&&typeof showDirtyNote==='function') showDirtyNote();
}
/* 이름을 다 치고 칸을 벗어나면 그 줄의 요금 칸만 새로 그린다.
   글자마다 다시 그리면 한글 조합이 끊기므로 change(=칸을 벗어날 때)에서만 한다. */
document.getElementById('pane').addEventListener('change',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.pname) return;
  const cnt=document.getElementById('iCnt'); if(!cnt) return;
  const k=cnt.dataset.k, tr=el.closest('tr'), sub=tr&&tr.nextElementSibling;
  if(!sub||!sub.classList.contains('subrow')) return;
  const item=getPath(S,el.dataset.p.replace(/\.n$/,''));
  /* 호텔은 아래 줄이 「객실 요금」 칸이다 — 이름이 바뀌면 그 칸이 들고 있던 이름도 같이 고쳐야 한다 */
  const rcell=sub.querySelector('.rcell');
  if(rcell){
    const box=document.createElement('div'); box.innerHTML=roomCell(item,Number(rcell.dataset.rix));
    rcell.replaceWith(box.firstChild);
    cnt.innerHTML=itemCntHTML(k);
    return;
  }
  const old=sub.querySelector('.pcell'); if(!old) return;
  const box=document.createElement('div'); box.innerHTML=priceCell(k,item);
  old.replaceWith(box.firstChild);
  cnt.innerHTML=itemCntHTML(k);
});
function anyDirty(){ return Object.keys(dirty).some(k=>dirty[k]); }
window.addEventListener('beforeunload',e=>{ if(anyDirty()){ e.preventDefault(); e.returnValue=''; } });

/* ══════ 📋 예약요청 ══════
   손님이 사이트 장바구니에서 「예약 요청 보내기」를 누르면 여기로 들어온다.
   금액은 «손님 화면에 그때 보이던 값»이다 — 확정가가 아니라 요금표로 다시 확인해야 한다. */
const BOOK_STATUS=[
  {k:'new',   t:'접수',   c:'#E8A33D'},
  {k:'confirmed', t:'컨펌 (바우처 발급)', c:'#2E7D4F'},   /* 「컨펌」 단추를 누르면 서버가 이 상태로 바꾼다 */
  {k:'doing', t:'진행중', c:'#1C5B42'},
  {k:'done',  t:'완료',   c:'#3C6E71'},
  {k:'cancel',t:'취소',   c:'#9AA5A0'}
];
let BOOKS=null, bookFilter='live';       // live = 접수+진행중만, all = 전부
async function bookApi(action,payload){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const token=session&&session.access_token;
    if(!token) return {error:'로그인이 만료되었습니다. 다시 로그인해 주세요.'};
    const r=await fetch('/api/golf-book',{method:'POST',
      headers:{'content-type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify(Object.assign({action},payload))});
    return await r.json().catch(()=>({error:'서버 응답을 해석할 수 없습니다.'}));
  }catch(e){ return {error:'서버 연결 실패: '+((e&&e.message)||e)}; }
}
function bookWhen(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d)) return '';
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function bookStatusOf(k){ return BOOK_STATUS.filter(s=>s.k===k)[0]||BOOK_STATUS[0]; }
/* 담긴 줄 하나 — 「람차방 CC · 골프장 파타야 / 09.17 · 18홀 · 4명 / 676,000원」.
   종류 이름은 손님이 보낸 글자를 쓰지 않고 여기서 붙인다. */
const BOOK_KIND={courses:'골프장',hotels:'호텔'};
function bookItemHtml(it){
  const money=(it.asked||!it.krw)?'<i class="bkask">요금 문의</i>'
    :('<b>'+Number(it.krw).toLocaleString('ko-KR')+'원</b>'
      +(it.baht?' <i>('+Number(it.baht).toLocaleString('ko-KR')+'밧)</i>':''));
  const tag=[BOOK_KIND[it.kind]||'', it.region||''].filter(Boolean).join(' ');
  return '<li><span class="bkw">'+esc(it.name)
    +(tag?' <i>· '+esc(tag)+'</i>':'')+'</span>'
    +'<span class="bkd">'+esc(it.label||'')+'</span>'
    +'<span class="bkm">'+money+'</span></li>';
}
function drawBooks(){
  const p=document.getElementById('pane');
  if(BOOKS===null){
    p.innerHTML='<div class="card"><h2>📋 예약요청</h2><p class="desc">불러오는 중…</p></div>';
    loadBooks();
    return;
  }
  if(BOOKS.error){
    p.innerHTML='<div class="card"><h2>📋 예약요청</h2>'
      +'<p class="desc" style="color:#B23B3B">'+esc(BOOKS.error)+'</p>'
      +'<button class="add" id="bkReload">다시 불러오기</button></div>';
    document.getElementById('bkReload').onclick=()=>{ BOOKS=null; drawBooks(); };
    return;
  }
  const all=BOOKS.list||[];
  const list=bookFilter==='all'?all:all.filter(b=>b.status==='new'||b.status==='doing');
  const nNew=all.filter(b=>b.status==='new').length;
  p.innerHTML='<div class="card">'
    +'<h2>📋 예약요청 <span class="bkcnt">'+nNew+'건 새로 들어옴</span></h2>'
    +'<p class="desc">손님이 사이트 장바구니에서 보낸 예약 요청입니다. '
    +'<b>금액은 손님 화면에 그때 보이던 값</b>이라 확정가가 아닙니다 — 요금표로 다시 확인해 안내하세요.</p>'
    +'<div class="subtabs">'
      +'<button class="'+(bookFilter==='live'?'on':'')+'" data-f="live">처리할 것 ('+all.filter(b=>b.status==='new'||b.status==='doing').length+')</button>'
      +'<button class="'+(bookFilter==='all'?'on':'')+'" data-f="all">전체 ('+all.length+')</button>'
      +'<button data-f="reload">↻ 새로고침</button>'
    +'</div>'
    +(list.length?'<div class="bklist">'+list.map(bookCardHtml).join('')+'</div>'
      :'<p class="desc" style="padding:18px 0">해당하는 예약 요청이 없습니다.</p>')
    +'</div>';
  p.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{
    if(b.dataset.f==='reload'){ BOOKS=null; drawBooks(); return; }

  });
  bindBookCards(p,list);

function bookCardHtml(b){
  const st=bookStatusOf(b.status), c=b.customer||{};
  const who=[c.tel&&('☎ '+c.tel), c.kakao&&('💬 '+c.kakao), c.email&&('✉ '+c.email)]
    .filter(Boolean).join('  ');
  return '<div class="bkcard">'
    +'<div class="bkhd">'
      +'<span class="bkno">'+esc(b.no)+'</span>'
      +'<span class="bkst" style="background:'+st.c+'">'+st.t+'</span>'
      +'<span class="bkat">'+esc(bookWhen(b.at))+'</span>'
      +'<span class="bktot">'+Number(b.total||0).toLocaleString('ko-KR')+'원</span>'
    +'</div>'
    +'<div class="bkwho"><b>'+esc(c.name||'')+'</b> <span>'+esc(who)+'</span></div>'
    +(c.memo?'<div class="bkmemo">“'+esc(c.memo)+'”</div>':'')
    +'<ul class="bkitems">'+(b.items||[]).map(bookItemHtml).join('')+'</ul>'
    +voucherRowHtml(b)
    +'<div class="bkfoot">'
      +'<select data-st="'+esc(b.no)+'">'

      +'</select>'

      +'<button class="add" data-save="'+esc(b.no)+'">저장</button>'

/* ══ 바우처(예약 확정서) — 직원이 「컨펌」을 누르면 서버가 확정번호·링크를 만든다(사장님 2026-09-10).
   손님에게는 링크를 카톡(문구 복사해서 붙여넣기)이나 이메일(서버 자동 발송)로 보낸다.
   카톡은 알림톡(사업자 채널·템플릿 심사)이 없으면 서버가 직접 못 보낸다 — 그래서 문구 복사다. */
function voucherUrlOf(b){
  return location.origin+'/golf/site/voucher/?no='+encodeURIComponent(b.no)+'&t='+encodeURIComponent(b.voucher.token);
}
function voucherRowHtml(b){
  const v=b.voucher;
  if(!v||!v.token){
    if(b.status==='cancel') return '';
    return '<div class="bkvc"><button class="add" data-confirm="'+esc(b.no)+'">✅ 컨펌 · 바우처 발급</button>'
      +'<span class="bkvhint">컨펌하면 예약 확정서(바우처)가 만들어지고 카톡·이메일로 보낼 수 있습니다</span></div>';
  }
  const sent=(v.sent||[]).slice(-3).map(x=>(x.via==='email'?'📧 ':'💬 ')+esc(x.to||'')+' · '+esc(bookWhen(x.at))).join('<br>');
  return '<div class="bkvc on">'
    +'<span class="bkvno">확정번호 <b>'+esc(v.cno)+'</b></span>'
    +'<a class="bkvopen" href="'+esc(voucherUrlOf(b))+'" target="_blank" rel="noopener">바우처 열기 ↗</a>'
    +'<button class="ghost" data-vkakao="'+esc(b.no)+'">💬 카톡 문구 복사</button>'
    +'<button class="ghost" data-vmail="'+esc(b.no)+'">📧 이메일 보내기</button>'
    +'<button class="ghost" data-vlink="'+esc(b.no)+'">🔗 링크 복사</button>'
    +'<button class="ghost" data-confirm="'+esc(b.no)+'" title="바우처에 실리는 Agent Memo(호텔 컨펌번호 등)">✎ 바우처 메모</button>'
    +'<span class="bkby">'+esc(v.by||'')+' · '+esc(bookWhen(v.at))+'</span>'
    +(sent?'<div class="bkvsent">보냄: '+sent+'</div>':'')
    +'</div>';
}
function kakaoTextOf(b){
  const co=(S.voucher&&S.voucher.name)||'투어코리아';
  const lines=(b.items||[]).map(it=>'· '+it.name+(it.option?' '+it.option:'')+' — '+(it.date||'')
    +(it.dateEnd&&it.dateEnd!==it.date?' ~ '+it.dateEnd:''));
  return '['+co+'] '+((b.customer&&b.customer.name)||'')+' 님, 예약이 확정되었습니다.\n'
    +'예약번호 '+b.no+' · 확정번호 '+b.voucher.cno+'\n'
    +lines.join('\n')+'\n'
    +'▶ 예약 확정서(바우처): '+voucherUrlOf(b)+'\n'
    +'이용 시 위 바우처를 제시해 주세요. 화면을 캡처해 보여 주셔도 됩니다.';
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
function bookOf(no){ return (BOOKS.list||[]).find(x=>x.no===no); }
function bookReplace(rec){ const i=(BOOKS.list||[]).findIndex(x=>x.no===rec.no); if(i>=0) BOOKS.list[i]=rec; }
function bindVoucherBtns(p){
  p.querySelectorAll('[data-confirm]').forEach(btn=>btn.onclick=async()=>{
    const b=bookOf(btn.dataset.confirm); if(!b) return;
    const had=!!(b.voucher&&b.voucher.token);
    const memo=prompt((had?'바우처 메모를 고칩니다.':'컨펌합니다 — 바우처(예약 확정서)를 발급합니다.')
      +'\n바우처에 실을 메모(호텔 컨펌번호 등)가 있으면 적어 주세요. 없으면 그냥 확인.',
      (b.voucher&&b.voucher.memo)||'');
    if(memo===null) return;
    btn.disabled=true; btn.textContent='처리 중…';
    const j=await bookApi('confirm',{no:b.no,memo});
    btn.disabled=false;
    if(!j||!j.ok){ toast('❌ '+((j&&j.error)||'컨펌 실패')); drawBooks(); return; }
    bookReplace(j.rec);
    toast(had?'바우처 메모를 고쳤습니다':'✅ 컨펌 — 바우처가 발급되었습니다');
    drawBooks();
  });
  p.querySelectorAll('[data-vlink]').forEach(btn=>btn.onclick=async()=>{
    const b=bookOf(btn.dataset.vlink); if(!b) return;
    toast((await copyText(voucherUrlOf(b)))?'🔗 바우처 링크를 복사했습니다':'복사 실패 — 「바우처 열기」로 주소를 복사해 주세요');
  });
  p.querySelectorAll('[data-vkakao]').forEach(btn=>btn.onclick=async()=>{
    const b=bookOf(btn.dataset.vkakao); if(!b) return;
    const t=kakaoTextOf(b);
    /* 휴대폰이면 공유창(카톡 고르기)이 바로 뜬다. PC는 복사해서 카톡 창에 붙여넣는다. */
    if(navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      try{ await navigator.share({text:t}); return; }catch(e){}
    }
    toast((await copyText(t))?'💬 카톡 문구를 복사했습니다 — 손님 카톡 창에 붙여넣으세요':'복사 실패');
  });
  p.querySelectorAll('[data-vmail]').forEach(btn=>btn.onclick=async()=>{
    const b=bookOf(btn.dataset.vmail); if(!b) return;
    const to=prompt('바우처를 보낼 이메일 주소', (b.customer&&b.customer.email)||'');
    if(to===null) return;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to.trim())){ toast('⚠ 이메일 주소를 확인해 주세요'); return; }
    btn.disabled=true; btn.textContent='보내는 중…';
    const j=await bookApi('send',{no:b.no,to:to.trim()});
    btn.disabled=false; btn.textContent='📧 이메일 보내기';
    if(j&&j.setup){
      /* 서버에 메일 열쇠(RESEND_API_KEY)가 아직 없다 — 내 메일 앱을 열어 대신 보낸다 */
      const subj='['+((S.voucher&&S.voucher.name)||'투어코리아')+'] 예약 확정서 (Voucher) · '+b.no;
      location.href='mailto:'+encodeURIComponent(to.trim())+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(kakaoTextOf(b));
      toast('서버 자동 발송이 아직 설정되지 않아 메일 앱을 열었습니다');
      return;
    }
    if(!j||!j.ok){ toast('❌ '+((j&&j.error)||'발송 실패')); return; }
    bookReplace(j.rec);
    toast('📧 '+j.to+' 로 보냈습니다');
    drawBooks();
  });
}
function bindBookCards(p){
  bindVoucherBtns(p);
  p.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=async()=>{
    const no=btn.dataset.save;
    const st=p.querySelector('[data-st="'+CSS.escape(no)+'"]').value;
    const memo=p.querySelector('[data-memo="'+CSS.escape(no)+'"]').value;
    btn.disabled=true; btn.textContent='저장 중…';
    const j=await bookApi('status',{no,status:st,memo});
    btn.disabled=false; btn.textContent='저장';
    if(!j||!j.ok){ toast('❌ '+((j&&j.error)||'저장 실패')); return; }
    /* 서버가 돌려준 최신본으로 그 한 건만 갈아 끼운다 — 목록 전체를 다시 받지 않는다 */
    bookReplace(j.rec);
    toast('저장했습니다');
    drawBooks();
  });
}
async function loadBooks(){
  const j=await bookApi('list',{});
  BOOKS=(j&&j.ok)?{list:j.list||[]}:{error:(j&&j.error)||'예약 요청을 불러오지 못했습니다.'};
  if(tab==='books') drawBooks();
}
/* 요금표 — /golf/admin/ 을 그대로 끼워 넣는다. 옮겨 적지 않은 이유는,
   요금 계산이 견적기·손님 사이트·API와 얽혀 있어 두 벌이 되면 반드시 어긋나기 때문이다.
   저장·백업도 저쪽 화면 것을 그대로 쓴다. */
function drawRates(){
  document.getElementById('pane').innerHTML=
    '<div class="card" style="padding:12px 13px 13px">'
    +'<h2>💰 요금표 · 코드</h2>'
    +'<p class="desc">골프장·호텔의 <b>원가</b>입니다. 손님에게는 안 보입니다 — '
    +'손님 화면에는 마진을 더한 원화 금액만 나갑니다. '
    +'<a href="/golf/admin/" target="_blank" rel="noopener">따로 큰 화면으로 열기 ↗</a></p>'
    +'<iframe id="ratesFrame" src="/golf/admin/?embed=1" title="요금표"></iframe>'
    +'</div>';
  /* 안쪽 화면 높이에 맞춰 늘려 준다 — 스크롤이 두 겹이면 표를 못 읽는다 */
  const f=document.getElementById('ratesFrame');
  const fit=()=>{ try{ const d=f.contentDocument; if(!d||!d.body) return;
    f.style.height=Math.max(600,d.documentElement.scrollHeight)+'px'; }catch(e){} };
  clearInterval(ratesTimer);
  f.onload=()=>{ fit(); ratesTimer=setInterval(fit,700); };   // 표를 펴고 접을 때마다 높이가 바뀐다
}

/* ══════════════ 사이트 내용 ══════════════ */
/* 골프장·호텔·스파·차량… 「종류」는 데이터(S.cats)에서 온다 — 종류를 추가하면 여기 메뉴도 늘어난다 */
function catsAll(){
  if(!Array.isArray(S.cats) || !S.cats.length)
    S.cats=[{k:'courses',ic:'⛳',t:'골프장',u:'곳',on:true},{k:'hotels',ic:'🏨',t:'호텔',u:'곳',on:true}];
  return S.cats;
}
/* courses·hotels는 원래 쓰던 자리에, 새로 만든 종류는 items 아래에 담긴다 */
function itemsArr(k){
  if(k==='courses') return (S.courses=S.courses||[]);
  if(k==='hotels')  return (S.hotels =S.hotels ||[]);
  S.items=S.items||{};
  if(!Array.isArray(S.items[k])) S.items[k]=[];
  return S.items[k];
}
function itemsPath(k,i){ return (k==='courses'||k==='hotels') ? k+'.'+i : 'items.'+k+'.'+i; }
function subs(){
  return [{k:'hero',label:'첫 화면'}]
    .concat(catsAll().map(c=>({k:'cat:'+c.k, label:(c.ic?c.ic+' ':'')+(c.t||c.k)+(c.on===false?' (숨김)':'')})))
    .concat([{k:'cats',label:'＋ 종류 관리'},{k:'holiday',label:'📅 공휴일'},
             {k:'tours',label:'기타투어'},
             {k:'board',label:'게시판'},{k:'foot',label:'연락처 · 푸터'}]);
}
let sub='hero', iSearch={}, iSort={};   /* iSort: 종류별로 「지역순 보기」를 켰는지 */
/* 지역순 보기는 처음부터 켜져 있다 — 62곳을 지역별로 나눠 봐야 찾기 쉽다. 끄면 넣은 차례대로. */
function sortOn(k){ return iSort[k]!==false; }
/* 저장 줄에 「저장 안 한 변경이 있습니다」를 띄운다 — 붙어 다니는 줄이라 늘 눈에 든다 */
function showDirtyNote(){
  const n=document.getElementById('siteDirty'); if(!n) return;
  const what=[dirty['site']&&'사이트 내용',dirty['rates']&&'요금'].filter(Boolean);
  n.textContent = what.length ? '● 저장 안 한 변경이 있습니다 ('+what.join('·')+')' : '';
}
async function saveSite(){
  const b=document.getElementById('saveSite');
  if(b&&b.disabled) return;              // 두 번 눌러 두 번 저장되는 것을 막는다
  if(b){ b.disabled=true; b.textContent='저장 중…'; }
  try{
    let ok=true, msg=[];
    if(dirty['site']){
      if(await saveSafe(SITE_KEY,S)){ clearDirty('site'); msg.push('사이트 내용'); } else ok=false;
    }
    /* 요금은 키가 달라 따로 나간다 — 한쪽이 실패해도 다른 쪽은 남는다.
       ⚠ 요금표(golf_pricing) 한 덩이를 요금·코드 화면(/golf/admin/)과 같이 쓴다.
       이 화면이 가진 것은 «regions(골프장·호텔 요금줄)»과 «holidays(공휴일)» 둘뿐이고,
       차량·핸들링·가이드는 저쪽 것이다. 그래서 저장 직전에 서버 최신본을 다시 읽어
       **저쪽 칸은 서버 것을 그대로 살려** 둔다 — 예전에는 덩이째 덮어써서
       한 화면이 다른 화면의 작업을 통째로 지웠다(2026-09-08 사고). */
    if(ok&&dirty['rates']){
      const merged=await mergeRatesForSave(P);
      if(!merged){ toast('⚠ 서버 연결 실패 — 요금을 저장하지 않았습니다'); ok=false; }
      else if(await saveSafe(PRICE_KEY,merged)){ P=merged; clearDirty('rates'); msg.push('요금'); }
      else ok=false;
    }
    drawTabs();
    /* 저장이 막혔을 때 아무 말도 없으면 저장된 줄 안다 — 특히 요금만 실패했을 때 */
    if(ok) toast(msg.length?('✅ '+msg.join('·')+' 저장했습니다'):'저장할 변경이 없습니다');
    else toast('⚠ '+(msg.length?msg.join('·')+'만 저장되고 나머지는 ':'')+'저장되지 않았습니다 — 화면 위 표시를 확인해 주세요');
  } finally { const c=document.getElementById('saveSite');
    if(c){ c.disabled=false; c.textContent='저장'; } showDirtyNote(); }
}
/* Ctrl+S — 한 곳 고치고 바로 저장하는 일이 잦다. 브라우저 「페이지 저장」은 막는다 */
document.addEventListener('keydown',e=>{
  if(!(e.key==='s'||e.key==='S')||!(e.ctrlKey||e.metaKey)||e.altKey) return;
  if(!document.getElementById('saveSite')) return;   // 사이트 내용 화면일 때만
  e.preventDefault(); saveSite();
});
function drawSite(){
  const p=document.getElementById('pane'), SUB=subs();
  if(!SUB.some(s=>s.k===sub)) sub='hero';
  p.innerHTML='<div class="subtabs">'
    +SUB.map(s=>'<button data-s="'+esc(s.k)+'" class="'+(s.k===sub?'on':'')+'">'+esc(s.label)+'</button>').join('')
    +'</div><div id="subpane"></div>'
    +'<div class="rowbtns savebar"><button class="save" id="saveSite">저장</button>'
    +'<span class="warn" id="siteDirty"></span>'
    +'<button class="ghost" id="resetSite">기본값으로 되돌리기</button>'
    +'<span class="cnt" id="siteNote"></span>'
    +'<span class="tip">Ctrl+S 로도 저장됩니다</span></div>';
  p.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{ sub=b.dataset.s; drawSite(); });
  document.getElementById('saveSite').onclick=saveSite;
  showDirtyNote();
  document.getElementById('resetSite').onclick=()=>{
    if(!confirm('지금 화면의 모든 내용을 처음 기본값으로 되돌립니다.\n(저장을 눌러야 실제로 반영됩니다)\n\n계속할까요?')) return;
    S=deepCopy(window.SITE_DEFAULT); markDirty('site'); drawTabs();

  else ({hero:subHero,cats:subCats,holiday:subHoliday,tours:subTours,board:subBoard,foot:subFoot}[sub]||subHero)();
}

function picsTa(path,x){

   파일을 고르면 브라우저에서 먼저 크기를 줄이고(긴 변 1600px, JPEG) R2에 올린다.
   원본 사진은 한 장에 5MB가 넘는 일이 흔해서, 그대로 두면 손님 화면이 느려진다. */
const PIC_MAX_EDGE=1600, PIC_QUALITY=0.82;
function shrinkImage(file){
  return new Promise(resolve=>{
    /* GIF는 움직이는 그림이라 줄이면 한 장으로 굳는다 — 원본 그대로 올린다 */
    if(file.type==='image/gif'){ resolve(file); return; }
    const img=new Image(), fr=new FileReader();
    fr.onload=()=>{ img.src=fr.result; };
    fr.onerror=()=>resolve(file);
    img.onerror=()=>resolve(file);
    img.onload=()=>{
      const s=Math.min(1,PIC_MAX_EDGE/Math.max(img.width,img.height));
      if(s>=1&&file.size<1200000){ resolve(file); return; }   // 이미 작으면 그대로
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>resolve(b||file),'image/jpeg',PIC_QUALITY);
    };
    fr.readAsDataURL(file);
  });
}
async function uploadPics(box,files){
  const ta=box.querySelector('textarea[data-pics]');
  const msg=box.querySelector('.picmsg');
  const base=box.dataset.nm||'사진';
  const {data:{session}}=await sb.auth.getSession();
  const token=session&&session.access_token;
  if(!token){ msg.textContent='로그인이 풀렸습니다. 새로고침 후 다시 해 주세요.'; return; }
  /* 이어붙일 번호는 지금 목록에 있는 장수부터 — 한 장씩 올려도 -1이 반복되지 않게 */
  let n=ta.value.split('\n').map(s=>s.trim()).filter(Boolean).length;
  let done=0, fail=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(!/^image\//.test(f.type)){ fail++; continue; }
    msg.textContent=`올리는 중… ${i+1}/${files.length}`;
    try{
      const blob=await shrinkImage(f);
      const ext=(blob.type==='image/png')?'png':(blob.type==='image/gif')?'gif':(blob.type==='image/webp')?'webp':'jpg';
      const name=`${base}-${++n}.${ext}`;
      const r=await fetch('/api/golf-img/put?name='+encodeURIComponent(name),{
        method:'PUT',
        headers:{Authorization:'Bearer '+token,'x-file-type':blob.type||'image/jpeg'},
        body:blob
      });
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||'실패');
      /* 목록에 이어 붙이고 input을 알려 S에 반영시킨다(저장 버튼을 눌러야 최종 반영) */
      const cur=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
      cur.push(j.url);
      ta.value=cur.join('\n');
      ta.dispatchEvent(new Event('input',{bubbles:true}));
      done++;
    }catch(e){ fail++; }
  }
  msg.textContent = fail ? `${done}장 올림 · ${fail}장 실패` : `${done}장 올렸습니다 — 저장을 눌러 주세요`;
  redrawPicThumbs(box);
}

    +'<b data-picdel="'+i+'" title="이 사진 빼기">✕</b>'

/* 올리기 버튼 · ✕ · 끌어다 놓기 — 표를 다시 그려도 살아 있도록 위임으로 받는다 */
document.getElementById('pane').addEventListener('click',e=>{
  const box=e.target.closest('.picbox'); if(!box) return;

    const inp=document.createElement('input');

  /* 「지역」 머리글을 누르면 지역끼리 모아서 보여 준다 — 보기만 바뀌고 저장되는 순서는 그대로다.
     지역 안에서는 원래 넣은 순서를 지킨다(sort가 안정 정렬이라 그대로 남는다).
     regionOrder(파타야·방콕·후아힌…)에 적힌 차례를 따르고, 거기 없는 지역은 뒤에 붙인다. */
  if(sortOn(k)){

/* ── 골프장·호텔 줄 아래에 붙는 요금 ──

   금액은 **그린피+캐디+카트를 합친 한 숫자**(밧)다 — 사장님이 그렇게 쓰기로 정했다.
   자료는 golf_site가 아니라 **요금표(golf_pricing)** 쪽에 넣는다. golf_site는

/* 태국휴일은 주말과 요금이 같다(사장님 확인) — 그래서 칸을 하나로 묶었다.
   견적에서 날짜를 볼 때 토·일과 태국휴일을 똑같이 「주말·휴일」로 친다. */
const RATE_PARTS=['주중','주말·휴일'];
const RATE_TIMES=['종일','오전','오후'];
/* 예전에 「주말」·「태국휴일」로 따로 적힌 것이 있으면 묶어서 보여 준다 */
function normPart(v){ return (v==='주말'||v==='태국휴일'||v==='주말·휴일')?'주말·휴일':'주중'; }
/* 이 항목의 요금 줄들을 꺼내 온다. 없으면 빈 배열을 만들어 둔다. */
/* 요금표에서 이 항목의 «자리» 자체를 꺼내 온다(없으면 null).
   이 안에는 새 요금줄(rates[]) 말고도 옛 시즌줄(seasons[]) 같은 것이 같이 들어 있다. */
function priceHomeOf(k,x){
  if(!P) return null;
  const key=String(x&&x.n||'').replace(/\s+/g,'').toLowerCase();
  if(!key) return null;
  const bag=PIDX[k]; if(!bag) return null;
  const hit=bag[key];
  return hit ? (hit.c||hit.h||hit.o) : null;
}

function isMenuKind(k){ return k!=='courses'&&k!=='hotels'; }
function menuOf(k,x){
  const o=priceHomeOf(k,x);
  if(!o) return null;
  if(!Array.isArray(o.menu)) o.menu=[];
  /* 메뉴 = 이름(n) + 코스·내용(d). 처음에 「아로마스파맛사지 2시간 (스크럽+아로마오일)」처럼
     괄호 안에 내용을 같이 적어 둔 줄은 괄호 안을 d로 떼어 낸다(사장님 2026-09-09) —
     오른쪽 견적 패널 단추에 긴 글이 밀려 끊어져서. 서버(golf-price.js)도 같은 규칙으로 뗀다. */
  o.menu.forEach(m=>{ if(m&&!m.d){ const s=splitMenu(m.n); if(s){ m.n=s.n; m.d=s.d; } } });

function splitMenu(n){
  const mm=String(n||'').match(/^(.*?)\s*[(（]([^()（）]+)[)）]\s*$/);

      +(menu.length?menu.map((m,i)=>menuRowHTML(i,m)).join(''):'<div class="rnone">아직 요금이 없습니다</div>')
      +'</div>';
    return '<div class="iecell pcell" data-pk="'+esc(k)+'" data-pn="'+esc(x.n||'')+'">'
      +'<b>메뉴별 요금 <span class="rhint">1인 기준 밧(종류 단위가 「대」면 1대 기준) — 손님에게는 마진(기본 100밧)을 얹어 원화로 보입니다</span></b>'
      +body
      +'<button type="button" class="radd">＋ 요금 줄 추가</button></div>';
  }
  const rates=ratesOf(k,x);
  let body;
  if(P===null) body='<div class="pbox"><span class="pmute">요금표를 못 읽었습니다</span></div>';
  else if(rates===null) body='<div class="pbox"><span class="pno">요금표에 「'+esc(x.n||'이름 없음')
    +'」이 없습니다 — 아래 ＋를 누르면 만들어집니다</span></div>';
  else {
    /* 옛 요금표(시즌줄)로 들어 있는 곳은 여기서 못 고치지만, 있다는 것은 알려 준다 —
       안 그러면 「요금 없음」으로 보여서 이미 넣어 둔 요금을 또 넣게 된다. */
    const nOld=oldSeasonCount(priceHomeOf(k,x));
    body='<div class="rlist">'
    +'<div class="rhead"><span>기간</span><span>구분</span><span>시간</span><span>18홀</span><span>9홀</span></div>'
    +(rates.length?rates.map((r,i)=>rateRowHTML(k,i,r)).join('')
      :'<div class="rnone">'+(nOld?('옛 요금표에 '+nOld+'줄이 들어 있습니다 — 「💰 요금표」 탭에서 보입니다')
                                  :'아직 요금이 없습니다')+'</div>')
    +'</div>';
  }
  return '<div class="iecell pcell" data-pk="'+esc(k)+'" data-pn="'+esc(x.n||'')+'">'
    +'<b>요금 <span class="rhint">그린피+캐디+카트 합산 · 밧</span></b>'
    +body
    +'<button type="button" class="radd">＋ 요금 줄 추가</button></div>';
}
/* 요금표에 이 항목 자리가 없으면 만들어 준다. 지역은 사이트 쪽에 적힌 지역을 그대로 쓴다. */
function ensureRateHome(k,x){
  if(!P){ P={regions:{}}; }
  if(!P.regions) P.regions={};
  const reg=(x.r||'기타');
  if(!P.regions[reg]) P.regions[reg]={courses:[],hotels:[]};
  /* 골프장·호텔은 예전 자리(courses·hotels), 그 밖의 종류는 종류 키 그대로(spa·ticket…) */
  const arrName=(k==='hotels')?'hotels':(k==='courses')?'courses':k;
  const arr=P.regions[reg][arrName]=P.regions[reg][arrName]||[];
  const key=String(x.n||'').replace(/\s+/g,'').toLowerCase();
  let o=arr.filter(e=>String(e.name||'').replace(/\s+/g,'').toLowerCase()===key)[0];
  if(!o){ o=isMenuKind(k)?{name:x.n||'',menu:[]}:{name:x.n||'',rates:[]}; arr.push(o); }
  if(isMenuKind(k)){ if(!Array.isArray(o.menu)) o.menu=[]; }
  else if(!Array.isArray(o.rates)) o.rates=[];
  buildPriceIndex();
  return o;
}
/* 요금 줄을 고치거나 더하거나 지운 뒤 — 그 항목의 요금 칸만 새로 그린다 */
function redrawRateCell(cell){
  const k=cell.dataset.pk, name=cell.dataset.pn;
  const box=document.createElement('div');
  box.innerHTML=priceCell(k,{n:name,r:''});
  cell.replaceWith(box.firstChild);
}
document.getElementById('pane').addEventListener('click',e=>{
  const add=e.target.closest('.radd'), del=e.target.closest('.rdel');
  if(!add&&!del) return;
  const cell=e.target.closest('.pcell'); if(!cell) return;
  const k=cell.dataset.pk, name=cell.dataset.pn;
  const item=(itemsArr(k)||[]).filter(z=>String(z.n||'')===name)[0];
  if(!item) return;
  const o=ensureRateHome(k,item);
  if(isMenuKind(k)){                                   // 스파·티켓… 메뉴별 요금
    if(add) o.menu.push({n:'',u:'',p:''});

  }else if(add){
    /* 기간은 물려받는다 — 같은 기간에 오전·오후를 잇달아 넣는 일이 많다.
       이 골프장에 줄이 하나도 없으면 방금 다른 골프장에서 쓴 기간을 가져온다. */
    const last=o.rates[o.rates.length-1]||lastPeriod;
    o.rates.push({from:last.from||'',to:last.to||'',part:normPart(last.part),time:'종일',p18:'',p9:''});
  }else{
    const row=e.target.closest('.rrow'); if(!row) return;
    o.rates.splice(Number(row.dataset.ri),1);
  }
  markDirty('rates'); redrawRateCell(cell);
  const cnt=document.getElementById('iCnt');       // 「요금 없음 N곳」도 같이 고친다
  if(cnt) cnt.innerHTML=itemCntHTML(cnt.dataset.k);
});

/* 「기간 고르기」 드롭다운 — 고르면 그 줄의 시작·끝 날짜가 한 번에 채워진다 */
document.getElementById('pane').addEventListener('change',e=>{
  const sel=e.target; if(!sel.dataset||!sel.dataset.rper) return;
  const cell=sel.closest('.pcell'), row=sel.closest('.rrow');
  if(!cell||!row) return;
  const k=cell.dataset.pk, name=cell.dataset.pn;
  const item=(itemsArr(k)||[]).filter(z=>String(z.n||'')===name)[0]; if(!item) return;
  const o=ensureRateHome(k,item), r=o.rates[Number(row.dataset.ri)]; if(!r) return;
  const v=sel.value;
  if(v==='__add'){
    if(!r.from&&!r.to){ alert('먼저 이 줄의 기간을 넣어 주세요.\n그 기간이 목록에 담깁니다.'); redrawRateCell(cell); return; }
    const list=ratePeriods(), kk=perKey(r.from,r.to);
    if(list.some(p=>perKey(p.from,p.to)===kk)) alert('이미 목록에 있는 기간입니다.');
    else{
      const lbl=prompt('이 기간을 뭐라고 부를까요?\n(비워 두면 날짜가 그대로 이름이 됩니다)\n\n'+kk,'');
      if(lbl===null){ redrawRateCell(cell); return; }
      list.push({from:r.from||'',to:r.to||'',label:String(lbl).trim()});
      rememberPeriod(r.from,r.to);
      markDirty('rates');
      toast('✅ 기간을 목록에 담았습니다 — 이제 다른 골프장에서 골라 쓰시면 됩니다');
    }
  }else if(v==='__del'){
    const list=ratePeriods();
    const pick=prompt('지울 기간의 번호를 적어 주세요.\n\n'
      +list.map((p,i)=>(i+1)+'. '+(p.label?p.label+' ('+perKey(p.from,p.to)+')':perKey(p.from,p.to))).join('\n'),'');
    const i=Number(pick)-1;
    if(list[i]){ list.splice(i,1); markDirty('rates'); toast('🗑 기간을 목록에서 지웠습니다'); }
  }else if(v){
    const [f,t]=v.split('~');
    r.from=f||''; r.to=t||'';
    rememberPeriod(r.from,r.to);
    markDirty('rates');
  }
  redrawRateCell(cell);
});
/* ── 줄 복사 ──
   시암처럼 「요금·사진·문구는 다 같고 코스 이름만 다른」 곳이 많다. 한 곳을 다 채운 뒤
   복사를 누르면 그 줄을 통째로(요금 줄까지) 베껴 바로 아래에 새 줄로 넣는다.
   이름만 새로 받는다 — 사이트와 요금표를 잇는 기준이 **이름**이라 겹치면 안 된다. */
function nameKey(s){ return String(s||'').replace(/\s+/g,'').toLowerCase(); }
function copyItem(k,i){
  const arr=itemsArr(k), src=arr[i]; if(!src) return;
  /* 요금은 **자리 통째로** 베낀다. 새 요금줄(rates[])만 보면, 옛 시즌줄(seasons[])로
     들어 있는 골프장을 복사할 때 요금이 하나도 안 따라온다 — 처음에 그렇게 만들어 놓쳤다. */
  const home=priceHomeOf(k,src);
  const nRate=(home&&Array.isArray(home.rates))?home.rates.length:0;
  const nMenu=(home&&Array.isArray(home.menu))?home.menu.length:0;   // 스파·티켓… 메뉴 줄
  const nSeason=oldSeasonCount(home);
  const priceNote=nRate?(' · 요금 '+nRate+'줄'):nMenu?(' · 메뉴 요금 '+nMenu+'줄'):nSeason?(' · 옛 요금표 '+nSeason+'줄'):'';
  const nm=prompt('「'+(src.n||'이름 없음')+'」을(를) 그대로 베껴 새로 만듭니다.\n'
    +'지역·영문이름·소개문구·사진·포함사항'+priceNote+'이 그대로 따라옵니다.\n'
    +'(저장을 눌러야 실제로 반영됩니다)\n\n새 이름을 적어 주세요:', (src.n||'')+' 2');
  if(nm===null) return;                       // 취소
  const name=String(nm).trim();
  if(!name){ alert('이름을 적어야 합니다.'); return; }
  if(arr.some(x=>nameKey(x&&x.n)===nameKey(name))){
    alert('「'+name+'」은(는) 이미 있습니다. 다른 이름으로 해 주세요.'); return; }
  const row=deepCopy(src); row.n=name;
  arr.splice(i+1,0,row);
  markDirty('site');
  /* 요금은 golf_site가 아니라 요금표(golf_pricing) 쪽에 있다 — 거기에도 자리를 만들어 베낀다.
     이름만 새 이름으로 두고 나머지(요금줄·옛 시즌줄·마진…)는 전부 그대로 옮긴다. */
  if(home){
    const o=ensureRateHome(k,row);
    Object.keys(home).forEach(f=>{ if(f!=='name') o[f]=deepCopy(home[f]); });
    markDirty('rates');
  }
  /* 찾기로 걸러 둔 상태인데 새 이름이 안 걸리면 새 줄이 안 보인다 — 찾기를 푼다 */
  const q=iSearch[k]||'';
  if(q && !((row.r||'')+(row.n||'')+(row.e||'')+(row.d||'')).toLowerCase().includes(q.toLowerCase()))
    iSearch[k]='';
  drawTabs();
  /* 새로 생긴 줄의 이름칸으로 데려다 준다 */
  const el=document.querySelector('[data-p="'+itemsPath(k,i+1)+'.n"]');
  if(el){ el.scrollIntoView({block:'center'}); el.focus(); }
  /* 요금이 몇 줄 따라왔는지 꼭 말해 준다 — 안 따라온 것을 모르고 넘어가면 안 된다 */
  const got=nRate?('요금 '+nRate+'줄 포함'):nSeason?('옛 요금표 '+nSeason+'줄 포함')
    :(home?'※ 원본에 요금이 없어 요금은 안 따라왔습니다':'※ 원본이 요금표에 없어 요금은 안 따라왔습니다');
  toast('📋 「'+name+'」(으)로 베껴 넣었습니다 · '+got+' — 저장을 눌러 주세요');
}
/* ══════════ 호텔 객실 (2026-09-03~) ══════════
   호텔은 포함·불포함사항을 쓰지 않는다(사장님 지시) — 객실마다 조식 여부가 달라
   한 문장으로 묶이지 않는다. 그 자리에 «객실 타입별 요금»이 들어간다.

   한 객실이 두 군데에 나뉘어 저장된다:
     · 내용(타입·면적·뷰·침대·조식·사진) → golf_site 의 hotels[].rooms[]  … 손님도 읽는다(공개해도 되는 자료)
     · 요금(기간·주중·주말)             → 요금표(golf_pricing) 의 hotels[].rooms[].rates[]
   둘을 잇는 기준은 **객실 타입 이름**이다(사이트↔요금표를 이름으로 잇는 것과 같다).
   그래서 이름을 고치면 요금표 쪽 이름도 같이 고쳐 준다(아래 change 처리). */
function siteRoomsOf(x){ if(!Array.isArray(x.rooms)) x.rooms=[]; return x.rooms; }
/* 그릴 때만 쓰는 읽기 전용 — 요금표에 없는 호텔의 자리를 괜히 만들지 않는다 */
function priceRoomsRO(x){
  const h=priceHomeOf('hotels',x);
  return (h&&Array.isArray(h.rooms))?h.rooms:[];
}
function findRoom(list,t){ return list.filter(z=>nameKey(z.t)===nameKey(t))[0]||null; }
/* 써차지 줄인가 — 서버(golf-price.js)의 isSur과 같은 판정이어야 한다 */
function isSurRate(r){ return !!r && (r.sur===true||r.sur===1||r.sur==='1'); }
/* 추가 인원 요금 — 처음에 extraPax(3인)·extraBed(엑스트라베드)로 넣어 둔 값도 읽는다.
   서버(golf-price.js)의 EXTRA_OLD와 같아야 한다. */
const EXTRA_OLD={extraAdult:'extraPax',extraChild:'extraBed'};
function exVal(pr,k){
  if(!pr) return '';
  if(pr[k]!=null&&pr[k]!=='') return pr[k];
  const o=pr[EXTRA_OLD[k]];
  return (o!=null&&o!=='')?o:'';
}
/* 고칠 때 쓴다 — 요금표에 자리가 없으면 만든다 */
function priceRoomOf(x,t){
  const o=ensureRateHome('hotels',x);
  if(!Array.isArray(o.rooms)) o.rooms=[];
  let r=findRoom(o.rooms,t);
  if(!r){ r={t:String(t||''),rates:[]}; o.rooms.push(r); }
  if(!Array.isArray(r.rates)) r.rates=[];
  return r;
}
function hotelByName(n){ return (itemsArr('hotels')||[]).filter(z=>String(z.n||'')===n)[0]||null; }
/* 한 줄 = 한 기간. 「구분」이 «＋추가(써차지)»면 그 기간에 걸린 날은
   기본요금 위에 이 금액이 **더해진다**(크리스마스·연말 같은 특별일). */

      +'<span class="rtil">~</span>'
      +'<input type="date" data-rmf="to" value="'+esc(n(r.to))+'" title="기간 끝">'
      +'</div></div>'
    +'<select data-rmf="sur" title="써차지로 두면 기본요금에 더해집니다">'
      +'<option value=""'+(sur?'':' selected')+'>기본요금</option>'
      +'<option value="1"'+(sur?' selected':'')+'>＋추가(써차지)</option></select>'
    +'<input type="number" data-rmf="wd" value="'+esc(n(r.wd))+'" placeholder="'+(sur?'＋주중':'주중')+'" min="0">'
    +'<input type="number" data-rmf="we" value="'+esc(n(r.we))+'" placeholder="'+(sur?'＋주말':'주말·휴일')+'" min="0">'
    +'<button type="button" class="rmrdel" title="이 기간 지우기">✕</button>'

/* 요금줄 묶음만 따로 그린다 — 이름을 적거나 줄을 더할 때 이 칸만 갈아 끼운다.
   객실칸 전체를 다시 그리면 옆 사진칸이 새로 만들어져 「올렸습니다」 알림이 사라지고,
   위 이름칸에서 탭으로 옮겨 가던 손가락이 갈 곳을 잃는다. */
function roomRatesHTML(rates,rm){
  return (rates.length
      ? '<div class="rmhd"><span>기간</span><span>구분</span><span>주중</span><span>주말·휴일</span></div>'

/* 그 객실의 요금칸만 새로 그린다 */
function redrawRoomRates(row,x){

function roomRowHTML(x,i,rm,j,pr){
  const rates=(pr&&Array.isArray(pr.rates))?pr.rates:[];
  /* 사진칸은 골프장과 같은 것을 쓴다 — 올린 주소가 이 객실의 img·imgs로 들어간다.
     파일 이름이 겹치지 않게 「호텔이름 객실타입」을 밑이름으로 넘긴다. */
  const picPath='hotels.'+i+'.rooms.'+j;
  const picShim={ n:(x.n||'호텔')+' '+(rm.t||('객실'+(j+1))), img:rm.img, imgs:rm.imgs };
  return '<div class="rmrow" data-mi="'+j+'">'
    +'<div class="rmhead">'
      +'<input data-mf="t" data-mt0="'+esc(rm.t||'')+'" value="'+esc(rm.t||'')+'" placeholder="디럭스 시티뷰">'
      +'<input data-mf="size" value="'+esc(rm.size||'')+'" placeholder="33㎡">'
      +'<input data-mf="view" value="'+esc(rm.view||'')+'" placeholder="시티뷰">'

       한 방은 2인 기준. 3인째는 «엑스트라 베드 요금», 4인째는 아동 2명이 함께 들 때만 되고

         이름을 바꾸면 적어 둔 값이 끊긴다. ※ 처음에 extraPax·extraBed로 넣어 둔 값이 있으면 그대로 보여 준다. */
    +'<div class="rminc rmex"><label>추가 인원 <span class="rhint">3인째 = 엑스트라 베드 · 4인째(아동 2명일 때) = 조식 쿠폰</span></label>'

      +'<div class="rmrates">'+roomRatesHTML(rates,rm)+'</div>'

function roomCell(x,i){
  const rooms=siteRoomsOf(x), prs=priceRoomsRO(x);
  const home=priceHomeOf('hotels',x);
  /* 옛 호텔 요금(1박 단가·골프식 요금줄)이 들어 있으면 알려 준다 — 모르고 또 넣으면 안 된다 */
  const old=home?((Array.isArray(home.rates)?home.rates.length:0)+oldSeasonCount(home)+((+home.perNight>0)?1:0)):0;
  return '<div class="iecell rcell" data-rn="'+esc(x.n||'')+'" data-rix="'+i+'">'
    +'<b>🛏 객실 타입별 요금 <span class="rhint">1실 1박 · 밧 · 한쪽만 적으면 주중·주말 같은 값으로 봅니다 · '
      +'「＋추가(써차지)」 줄은 그 기간에 걸린 날짜에 기본요금 위로 더해집니다</span></b>'
    +(rooms.length
      ? '<div class="rmlist">'+rooms.map((rm,j)=>roomRowHTML(x,i,rm,j,findRoom(prs,rm.t))).join('')+'</div>'
      : '<div class="rnone">아직 객실이 없습니다 — 아래 「＋ 객실 추가」로 넣어 주세요</div>')
    +'<button type="button" class="radd rmadd">＋ 객실 추가</button>'
    +(old?'<p class="rmnote">※ 옛 호텔 요금 '+old+'줄이 요금표에 남아 있습니다 — 객실별 요금을 다 넣으신 뒤 「💰 요금표」 탭에서 지우시면 됩니다.</p>':'')
    +'</div>';
}
function redrawRoomCell(cell){

  const box=document.createElement('div');
  box.innerHTML=roomCell(x,Number(cell.dataset.rix));
  cell.replaceWith(box.firstChild);
  const cnt=document.getElementById('iCnt');
  if(cnt) cnt.innerHTML=itemCntHTML(cnt.dataset.k);
}

});
/* 객실 타입 이름을 고치면 요금표 쪽 이름도 같이 고친다 — 안 그러면 요금이 끊긴다.
   글자마다가 아니라 칸을 벗어날 때 한 번만 한다(한글 조합이 끊기지 않게). */
document.getElementById('pane').addEventListener('change',e=>{
  const el=e.target;
  if(!el.dataset||el.dataset.mf!=='t') return;
  const cell=el.closest('.rcell'); if(!cell) return;
  const x=hotelByName(cell.dataset.rn); if(!x) return;
  const was=el.dataset.mt0||'', now=String(el.value||'').trim();
  el.dataset.mt0=now;
  if(!now) return;
  if(was&&nameKey(was)!==nameKey(now)){
    const home=priceHomeOf('hotels',x);
    const pr=(home&&Array.isArray(home.rooms))?findRoom(home.rooms,was):null;
    if(pr){ pr.t=now; markDirty('rates'); }
  }
  /* 이름을 처음 적은 객실에는 빈 요금줄 한 개를 미리 깔아 준다 —
     이름만 적고 나서 「요금 넣는 칸이 어디냐」가 되지 않게(사장님, 2026-09-03). */
  const row=el.closest('.rmrow'); if(!row) return;
  const pr=priceRoomOf(x,now);
  if(!pr.rates.length){
    pr.rates.push({from:lastPeriod.from||'',to:lastPeriod.to||'',wd:'',we:''});
    markDirty('rates');
  }
  redrawRoomRates(row,x);
});
/* ── 객실 요금(요금표 쪽) ── */
document.getElementById('pane').addEventListener('input',e=>{

     : (f==='sur')          ? (e.target.value==='1')

  markDirty('rates');
  /* 기본요금 ⇄ 써차지를 바꾸면 줄 색과 안내 글자가 같이 바뀌어야 한다 */

});

document.getElementById('pane').addEventListener('input',e=>{

/* 객실 요금줄의 「기간 고르기」 — 골프장 쪽과 같은 목록을 쓴다 */
document.getElementById('pane').addEventListener('change',e=>{
  const sel=e.target;
  if(!sel.dataset||!sel.dataset.rper) return;
  const cell=sel.closest('.rcell'), row=sel.closest('.rmrow'), rr=sel.closest('.rmrate');
  if(!cell||!row||!rr) return;                       // 골프장 쪽 요금줄은 위 handler가 맡는다
  const x=hotelByName(cell.dataset.rn); if(!x) return;
  const rm=siteRoomsOf(x)[Number(row.dataset.mi)]; if(!rm) return;
  const pr=priceRoomOf(x,rm.t), r=pr.rates[Number(rr.dataset.ri)];
  if(!r){ redrawRoomRates(row,x); return; }
  const v=sel.value;
  if(v==='__add'){
    if(!r.from&&!r.to){ alert('먼저 이 줄의 기간을 넣어 주세요.\n그 기간이 목록에 담깁니다.'); redrawRoomRates(row,x); return; }
    const list=ratePeriods(), kk=perKey(r.from,r.to);
    if(list.some(p=>perKey(p.from,p.to)===kk)) alert('이미 목록에 있는 기간입니다.');
    else{
      const lbl=prompt('이 기간을 뭐라고 부를까요?\n(비워 두면 날짜가 그대로 이름이 됩니다)\n\n'+kk,'');
      if(lbl===null){ redrawRoomRates(row,x); return; }
      list.push({from:r.from||'',to:r.to||'',label:String(lbl).trim()});
      rememberPeriod(r.from,r.to); markDirty('rates');
      toast('✅ 기간을 목록에 담았습니다');
    }
  }else if(v==='__del'){
    const list=ratePeriods();
    const pick=prompt('지울 기간의 번호를 적어 주세요.\n\n'
      +list.map((p,i)=>(i+1)+'. '+(p.label?p.label+' ('+perKey(p.from,p.to)+')':perKey(p.from,p.to))).join('\n'),'');
    const i=Number(pick)-1;
    if(list[i]){ list.splice(i,1); markDirty('rates'); toast('🗑 기간을 목록에서 지웠습니다'); }
  }else if(v){
    const [f,t]=v.split('~');
    r.from=f||''; r.to=t||'';
    rememberPeriod(r.from,r.to); markDirty('rates');
  }
  redrawRoomRates(row,x);
});
/* ── 객실 추가·복사·삭제, 기간 추가·삭제 ── */
document.getElementById('pane').addEventListener('click',e=>{
  const cell=e.target.closest('.rcell'); if(!cell) return;
  const x=hotelByName(cell.dataset.rn); if(!x) return;
  const rooms=siteRoomsOf(x), row=e.target.closest('.rmrow');
  const rm=row?rooms[Number(row.dataset.mi)]:null;
  if(e.target.closest('.rmadd')){
    rooms.push({t:'',size:'',view:'',bed:'',bf:true});
    markDirty('site');
  }else if(e.target.closest('.rmdel')){
    if(!rm) return;
    if(!confirm('「'+(rm.t||'이름 없는 객실')+'」을(를) 지웁니다.\n요금도 같이 지워집니다.\n'
      +'(저장을 눌러야 실제로 반영됩니다)\n\n계속할까요?')) return;
    const home=priceHomeOf('hotels',x);
    if(home&&Array.isArray(home.rooms)){
      const q=home.rooms.indexOf(findRoom(home.rooms,rm.t));
      if(q>=0){ home.rooms.splice(q,1); markDirty('rates'); }
    }
    rooms.splice(Number(row.dataset.mi),1);
    markDirty('site');
  }else if(e.target.closest('.rmcpy')){
    if(!rm) return;
    const nm=prompt('「'+(rm.t||'이름 없는 객실')+'」을(를) 요금까지 그대로 베낍니다.\n\n새 객실 타입 이름:',(rm.t||'객실')+' 2');
    if(nm===null) return;
    const name=String(nm).trim();
    if(!name){ alert('이름을 적어야 합니다.'); return; }
    if(rooms.some(z=>nameKey(z.t)===nameKey(name))){ alert('「'+name+'」은(는) 이미 있습니다.'); return; }
    const copy=JSON.parse(JSON.stringify(rm)); copy.t=name;
    rooms.splice(Number(row.dataset.mi)+1,0,copy);
    markDirty('site');
    const src=findRoom(priceRoomsRO(x),rm.t);
    if(src&&Array.isArray(src.rates)&&src.rates.length){
      priceRoomOf(x,name).rates=JSON.parse(JSON.stringify(src.rates));
      markDirty('rates');
    }
  }else if(e.target.closest('.rmradd')){
    if(!rm) return;
    if(!String(rm.t||'').trim()){ alert('먼저 객실 타입 이름을 적어 주세요.\n요금은 이름으로 이어집니다.'); return; }
    const pr=priceRoomOf(x,rm.t);
    const last=pr.rates[pr.rates.length-1]||lastPeriod;
    pr.rates.push({from:last.from||'',to:last.to||'',wd:'',we:''});
    markDirty('rates');
    redrawRoomRates(row,x); return;          // 요금칸만 — 옆 사진칸은 그대로 둔다
  }else if(e.target.closest('.rmrdel')){
    const rr=e.target.closest('.rmrate');
    if(!rm||!rr) return;
    const pr=priceRoomOf(x,rm.t);
    pr.rates.splice(Number(rr.dataset.ri),1);
    markDirty('rates');
    redrawRoomRates(row,x); return;
  }else return;
  redrawRoomCell(cell);
});

function itemBodyHTML(k){
  const cat=catsAll().filter(c=>c.k===k)[0]||{k:k,t:k,u:'곳'}, u=cat.u||'곳';
  const {rows}=itemRows(k), {bk,bp}=itemBadge(k), sortR=sortOn(k);
  const dft=incExcDef(k);
  let last=null;
  return rows.map(o=>{ const p=itemsPath(k,o.i);
    /* 지역순으로 볼 때는 지역이 바뀌는 자리마다 「파타야 · 19곳」 같은 묶음줄을 끼운다 */
    let grp='';
    if(sortR&&(o.x.r||'')!==last){ last=o.x.r||'';
      const cnt=rows.filter(z=>(z.x.r||'')===last).length;
      grp='<tr class="grp"><td colspan="8">'+esc(last||'지역 없음')+' · '+cnt+u+'</td></tr>'; }
    const off=o.x.on===false?' offrow':'';   // 체크를 끈 줄은 위·아래 줄 모두 흐리게
    /* 체크를 풀면 손님 화면에서만 빠진다 — 자료(사진·문구)는 그대로 남는다 */
    return grp+'<tr class="mainrow'+off+'">'
      +'<td style="text-align:center"><input type="checkbox" data-p="'+esc(p)+'.on" data-bool="1" data-itemon="1"'
        +(o.x.on===false?'':' checked')+' title="끄면 손님 화면에서 감춰집니다"></td>'
      +'<td>'+inp(p+'.r',o.x.r||'',S.regionOrder&&S.regionOrder[0]||'파타야')+'</td>'
      +'<td>'+inp(p+'.n',o.x.n||'').replace('<input','<input data-pname="1"')+'</td>'
      +'<td>'+inp(p+'.e',o.x.e||'','Siam Country Club')+'</td>'
      +'<td>'+inp(p+'.'+bk,o.x[bk]||'',bp)+'</td>'
      +'<td>'+ta(p+'.d',o.x.d||'','','big')+'</td>'
      +'<td>'+picsTa(p,o.x)+'</td>'
      +'<td><button class="cpy" data-copy="'+esc(k)+'" data-i="'+o.i+'" '
        +'title="이 줄을 요금까지 그대로 베껴 바로 아래에 새로 만듭니다">복사</button>'
        +'<button class="del" data-del="'+esc(k==='courses'||k==='hotels'?k:'items.'+k)+'" data-i="'+o.i+'">삭제</button></td></tr>'
      /* 아래 줄 — 포함·불포함사항(비워 두면 흐린 글씨=기본 문구가 손님에게 나간다)과
         요금표에 뭐가 들어와 있는지 곁눈질용 요약. 요금은 여기서 못 고친다.
         ── 호텔만 다르다: 포함·불포함 대신 「객실 타입별 요금」이 통째로 들어간다. */
      +'<tr class="subrow'+off+'"><td colspan="8"><div class="ierow">'
        +(k==='hotels' ? roomCell(o.x,o.i)
          : '<div class="iecell"><b>포함사항</b>'+ta(p+'.inc',o.x.inc||'',dft.inc)+'</div>'
            +'<div class="iecell"><b>불포함사항</b>'+ta(p+'.exc',o.x.exc||'',dft.exc)+'</div>'
            +priceCell(k,o.x))
        /* 바우처(예약 확정서) 머리에 찍히는 업체 주소·전화 — 손님 화면에는 안 나온다 */
        +'<div class="iecell vcell"><b>바우처용 주소 · 전화 <span class="rhint">예약 확정서 머리에 찍힙니다</span></b>'
          +inp(p+'.addr',o.x.addr||'','주소 (영문) — 예: 300 Sukhumvit 55, Bangkok 10110, Thailand')
          +inp(p+'.tel',o.x.tel||'','전화 — 예: +66(0) 2 020 8000')+'</div>'
      +'</div></td></tr>';
  }).join('');
}

   예전에는 /golf/admin/ 에 있었는데 관리 화면을 하나로 모으려고 이리로 옮겼다(사장님 2026-09-08).

function subHoliday(){
  const box=document.getElementById('subpane');
  if(!P){
    box.innerHTML='<div class="card"><h2>📅 태국 공휴일</h2>'
      +'<p class="desc" style="color:#B23B3B">요금표를 불러오지 못했습니다. 새로고침해 주세요.</p></div>';
    return;
  }
  if(!Array.isArray(P.holidays)) P.holidays=[];
  const list=P.holidays;
  box.innerHTML='<div class="card"><h2>📅 태국 공휴일</h2>'
    +'<p class="desc">여기 적은 날짜는 <b>토·일과 똑같이 「주말·휴일」 요금</b>으로 계산됩니다 — 골프장·호텔 모두. '
    +'개수 제한이 없으니 다음 해 것을 미리 넣어 두셔도 됩니다. 넣으신 뒤 <b>저장</b>을 눌러 주세요.</p>'
    +'<div class="hdays">'
    +list.map((d,i)=>'<span class="hd"><input type="date" data-hd="'+i+'" value="'+esc(d||'')+'">'
      +'<button class="del" data-hdx="'+i+'" title="빼기">×</button></span>').join('')
    +(list.length?'':'<span class="cnt">아직 없습니다. 아래 「＋ 날짜 추가」를 눌러 주세요.</span>')
    +'</div>'
    +'<div class="rowbtns"><button class="add" id="hdAdd">＋ 날짜 추가</button>'
    +'<span class="cnt">'+list.filter(Boolean).length+'일 등록됨</span></div></div>';
  box.querySelectorAll('[data-hd]').forEach(el=>el.onchange=()=>{
    list[Number(el.dataset.hd)]=el.value; markDirty('rates');
  });
  box.querySelectorAll('[data-hdx]').forEach(b=>b.onclick=()=>{
    list.splice(Number(b.dataset.hdx),1); markDirty('rates'); subHoliday();
  });
  document.getElementById('hdAdd').onclick=()=>{ list.push(''); markDirty('rates'); subHoliday(); };
}

    +(S.contact||[]).map((c,i)=>'<tr><td>'+inp('contact.'+i+'.k',c.k,'KAKAO')+'</td>'
      +'<td>'+inp('contact.'+i+'.v',c.v)+'</td>'
      +'<td>'+inp('contact.'+i+'.s',c.s)+'</td>'

      +'<td><button class="del" data-del="contact" data-i="'+i+'">삭제</button></td></tr>').join('')
    +'</tbody></table></div>'
    +'<div class="rowbtns"><button class="add" data-add="contact">＋ 연락처 추가</button></div></div>'

/* 바우처(예약 확정서)에 찍히는 회사 정보 — 「예약요청 → 컨펌」으로 발급되는 확정서의 아래쪽에 실린다.
   저장 위치는 golf_site.voucher. 서버(/api/golf-book)가 바우처를 열 때마다 여기서 읽어 붙인다. */

    +'골프장·호텔의 주소·전화는 각 종류 표의 줄 아래 「바우처용 주소 · 전화」에 적으세요.</p>'
    +'<div class="grid2">'

    +f('issuer','Issued by (발행 담당·연락처)','wevetour, +82 10-0000-0000')
    +f('emergency','비상연락망 (유의 사항 맨 아래)','+66(0)80-000-0000 (태국번호, 취침 시간에는 긴급건 ONLY)')
    +'</div>'
    +'<div class="f" style="margin-top:10px"><label>중요 안내 (비워 두면 이 칸이 안 나갑니다 — 아동·간이침대·보증금 안내 등)</label>'+ta('voucher.notes',v.notes||'','예) 숙소 도착 시 1박당 THB 1,000 의 보증금이 필요합니다.\n보증금은 체크아웃 시 전액 환불됩니다.')+'</div>'

    +'</div>';

/* 추가·삭제 버튼은 모양이 다 같아서 한곳에서 묶어 처리한다 */
const ADDERS={
  /* 종류(골프장·호텔·스파…)에 항목 한 줄 추가 — 어느 종류인지는 버튼의 data-k에 적혀 온다 */
  item: (i,k)=>{
    const key=k||'courses';
    const row={r:(S.regionOrder&&S.regionOrder[0])||'파타야',n:'',e:'',d:''};
    row[key==='hotels'?'g':key==='courses'?'h':'b']='';
    itemsArr(key).push(row);
  },
  /* 새 종류 — 저장 이름은 겹치지 않게 cat1, cat2… 로 만들어 두고 관리자가 고쳐 쓴다 */
  cat: ()=>{
    let n=1; while(catsAll().some(c=>c.k==='cat'+n)) n++;
    catsAll().push({k:'cat'+n,ic:'✨',t:'',u:'곳',on:false});
    S.items=S.items||{}; S.items['cat'+n]=[];
    sub='cats';
  },
  post:    ()=>S.board.unshift({tag:'공지',t:'',d:'',b:''}),
  contact: ()=>S.contact.push({k:'',v:'',s:'',href:'#'}),
  footer:  ()=>S.footer.push(''),
  trust:   ()=>S.trust.push({b:'',s:''}),
  herokey: ()=>(S.hero.keys=S.hero.keys||[]).push(''),
  tour:    ()=>S.tours.push({icon:'✨',t:'',d:'',items:[]}),
  touritem:i=>{ const t=S.tours[i]; (t.items=t.items||[]).push({n:'',s:''}); }
};
function bindRowBtns(){
  const p=document.getElementById('pane');
  p.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    ADDERS[b.dataset.add](Number(b.dataset.i), b.dataset.k);
    markDirty('site'); drawTabs();
  });
  p.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
    copyItem(b.dataset.copy, Number(b.dataset.i));
  });
  p.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const arr=getPath(S,b.dataset.del), i=Number(b.dataset.i);
    const what=(arr[i]&&(arr[i].n||arr[i].t||arr[i].b))||'이 줄';
    if(!confirm('「'+what+'」을(를) 지웁니다.\n(저장을 눌러야 실제로 반영됩니다)\n\n계속할까요?')) return;
    arr.splice(i,1); markDirty('site'); drawTabs();
  });
}

/* ══════════════ 코드관리 ══════════════ */

];

    +'<div class="tblwrap"><table style="min-width:560px"><thead><tr>'
    +'<th style="width:150px">코드</th><th>이름</th><th style="width:88px">사용</th><th style="width:64px"></th>'
    +'</tr></thead><tbody>'
    +list.map((x,i)=>'<tr>'
      +'<td><input data-c="'+i+'" data-f="code" value="'+esc(x.code)+'"></td>'
      +'<td><input data-c="'+i+'" data-f="label" value="'+esc(x.label)+'"></td>'
      +'<td><select data-c="'+i+'" data-f="active">'

  document.getElementById('cAdd').onclick=()=>{ C[ccat].push({code:'',label:'',active:true}); markDirty('codes'); drawTabs(); };
